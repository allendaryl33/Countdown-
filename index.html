const SYNC_WORDS = {
  "off":        () => "",
  "signed-out": d => "Not signed in" + (d ? " · " + d : ""),
  "syncing":    d => d || "Syncing…",
  "synced":     d => "Synced" + (d ? " · " + d : ""),
  "conflict":   () => "Changed elsewhere — needs you",
  "error":      d => d || "Sync problem"
};

/* Is somebody part-way through typing into the view render() would rebuild?
   On a phone the sync state changes constantly — the signal flickers, the
   keyboard opens, the app is switched away from — and every one of those
   used to wipe whatever was half-typed and drop focus. */
function viewHasLiveInput(){
  const el = document.activeElement;
  if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return false;
  return !!el.closest("#view");
}

/* A render skipped for that reason is owed, and gets paid once the field is
   let go of, so the view doesn't sit showing stale data forever. Anything
   the user did not just ask for goes through here rather than render(). */
let renderOwed = false;
function renderQuiet(){
  if (viewHasLiveInput()){ renderOwed = true; return; }
  render();
}
document.addEventListener("focusout", () => {
  setTimeout(() => {
    if (renderOwed && !viewHasLiveInput()){ renderOwed = false; render(); }
  }, 80);
});

function renderSync(){
  const pill = $("#sync-pill"), txt = $("#sync-text");
  if (!pill) return;
  if (Cloud.state === "off"){ pill.hidden = true; return; }
  pill.hidden = false;
  pill.className = "sync " + Cloud.state;
  txt.textContent = SYNC_WORDS[Cloud.state](Cloud.detail);
  if (App.view !== "data" || Cloud.signingIn) return;
  renderQuiet();
}

/* Two devices changed the same shop. Never pick for him, and never throw
   either copy away — the losing side goes to a file before anything moves. */
function onCloudConflict(remote){
  const mine = Store.data, theirs = remote && remote.data;
  const count = d => d ? `${(d.jobs||[]).length} jobs · ${(d.customers||[]).length} customers` : "—";
  openModal(`
    <div class="modal-head"><h2>This shop changed somewhere else</h2></div>
    <div class="modal-body">
      <p style="margin-top:0">Another device saved changes while this one had its own.
        Nothing has been overwritten. Pick which one is right — whichever you don't
        keep gets downloaded first, so you can always get it back.</p>
      <div class="opt-card" style="cursor:default">
        <div class="oc-t">📱 This device</div>
        <div class="oc-s">${esc(count(mine))}</div>
      </div>
      <div class="opt-card" style="cursor:default">
        <div class="oc-t">☁️ The other device${remote && remote.device ? " · " + esc(remote.device) : ""}</div>
        <div class="oc-s">${esc(count(theirs))}${remote && remote.updated_at
          ? " · saved " + esc(fmtStamp(Date.parse(remote.updated_at))) : ""}</div>
      </div>

      ${count(mine) === count(theirs) ? `<p class="t-sub" style="margin:14px 0 0;max-width:62ch">
        Both copies hold the same amount of work, so this is almost certainly the
        same shop saved twice rather than two different days' work. Either button
        is safe.</p>` : ""}

      ${Cloud.conflictCount > 1 ? `<div class="legal-note" style="margin:14px 0 0">
        <strong>This keeps happening.</strong> Something else is signed in and saving
        at the same time — usually the app left open in another tab, or the old
        icon on your home screen, which iOS keeps separate from Safari. Close the
        other one and this stops.</div>` : `<p class="t-sub" style="margin:14px 0 0;max-width:62ch">
        If you have the app open somewhere else — another tab, or the icon on your
        home screen — close it, or the two will keep overwriting each other.</p>`}
    </div>
    <div class="modal-foot">
      <div class="spacer"></div>
      <button class="btn" data-conflict="theirs">Take the other one</button>
      <button class="btn primary" data-conflict="mine">Keep this device</button>
    </div>`, { wide:true });
  Cloud._conflictRemote = remote;
}

async function resolveConflict(which){
  const remote = Cloud._conflictRemote;
  const stamp = todayStr();
  try {
    if (which === "mine"){
      if (remote) download(`poseidon-other-device-${stamp}.json`,
        JSON.stringify(remote.data, null, 2));
      closeModal();
      Cloud.set("syncing", "replacing the other copy…");
      Cloud.dirty = true;
      const r = await Cloud.push({ force:true });
      Cloud.set(r.pushed || r.created ? "synced" : "error",
                r.pushed || r.created ? "just now" : "couldn't write");
    } else {
      download(`poseidon-this-device-${stamp}.json`, JSON.stringify(Store.data, null, 2));
      closeModal();
      Cloud.set("syncing", "taking the other copy…");
      Cloud.dirty = false;
      await Cloud.pull({ force:true });
      Cloud.set("synced", "just now");
      toast("Took the other device's copy", "ok");
    }
  } catch(err){
    Cloud.set("error", err.message || "couldn't resolve");
  }
  Cloud._conflictRemote = null;
  Cloud.conflictOpen = false;
  // anything he changed while the question was on screen was held back; send it
  if (Cloud.dirty) Cloud.markDirty();
}

/* One stop on the run, with the actions you'd actually reach for on site. */
function stopCard(j){
  const c = Store.customer(j.customerId);
  const addr = custAddr(j.customerId);
  const next = NEXT_STATUS[j.status];
  const missing = Store.missingFor(j);
  const paid = Store.payState(j);
  const bal = Store.balance(j);
  const mapQ = encodeURIComponent(addr + ", AB");
  const tel = String(c && c.phone || "").replace(/\D/g,"");

  // The forward button says what actually happens next, in field words.
  const stepWord = { scheduled:"On my way", dispatched:"I'm here",
                     in_progress:"Mark done", new:"Schedule it" }[j.status] || null;

  return `
  <div class="stop pri-${esc(j.priority)} st-${esc(j.status)}">
    <div class="stop-main" data-job="${j.id}">
      <div class="stop-when">
        <div class="w">${esc(fieldWindow(j.window))}</div>
        <div class="n">#${j.no}</div>
      </div>
      <div class="stop-body">
        <div class="cust">${esc(custName(j.customerId))}</div>
        <div class="addr">${esc(addr) || "No address on file"}</div>
        <div class="what">${esc(j.type)}</div>
        <div class="tags">
          ${statusBadge(j.status)}
          ${j.priority !== "Normal" ? priorityBadge(j.priority) : ""}
          ${j.status === "complete" && bal > 0.005 ? `<span class="badge pay-invoiced"><span class="dot"></span>${esc(money(bal))} owing</span>` : ""}
          ${paid === "paid" ? `<span class="badge pay-paid"><span class="dot"></span>Paid</span>` : ""}
        </div>
      </div>
    </div>

    ${c && c.notes ? `<div class="stop-flag">📌 ${esc(c.notes)}</div>` : ""}
    ${missing.length ? `<div class="stop-flag">✍ Needs signing: ${esc(missing.map(w => w.title).join(" · "))}</div>` : ""}
    ${(() => { const n = Store.stillNeeded(j); return n
      ? `<div class="stop-flag">🧰 ${n} part${n===1?"":"s"} still to pick up for this one</div>` : ""; })()}

    <div class="stop-acts">
      ${tel ? `<a class="btn" href="tel:${esc(tel)}">📞 Call</a>` : ""}
      ${c ? `<button class="btn" data-message="${j.id}:${j.status==="scheduled"?"onway":j.status==="complete"?"done":"onway"}">💬 Text</button>` : ""}
      ${addr ? `<a class="btn" href="https://www.google.com/maps/search/?api=1&query=${mapQ}" target="_blank" rel="noopener noreferrer">🧭 Directions</a>` : ""}
      ${missing.length ? `<button class="btn" data-add-waiver="${j.id}">✍ Waiver</button>` : ""}
      ${stepWord && next ? `<button class="btn accent" data-advance="${j.id}">${esc(stepWord)}</button>` : ""}
      ${(() => {
        const live = Store.entriesOf(j).some(e => !e.endedAt);
        const spent = Store.totalMs(j);
        if (live) return `<button class="btn clock-on" data-clock="out:job:${j.id}">⏹ Clock out</button>`;
        return `<button class="btn" data-clock="in:job:${j.id}">▶ Clock in${spent ? ` · ${esc(fmtDur(spent))} so far` : ""}</button>`;
      })()}
      ${j.status === "complete" && bal > 0.005 ? `<button class="btn accent" data-job="${j.id}">💵 Take payment</button>` : ""}
    </div>
  </div>`;
}

/* ============================================================
   View: Schedule board (drag a job onto a technician)
   ============================================================ */
function viewSchedule(){
  const mode = App.scheduleMode;
  const label = mode === "day" ? fmtDateLong(App.date)
              : mode === "week" ? fmtWeekRange(App.date)
              : fmtMonth(App.date);
  const seg = (id, txt) =>
    `<button class="${mode===id?"on":""}" data-smode="${id}">${esc(txt)}</button>`;

  // Jobs with no date at all have nowhere to sit on the board — park them
  // above it so they can be dragged onto a day.
  const loose = Store.data.jobs.filter(j => !j.scheduledDate && isOpen(j));

  const body = mode === "day" ? dayBoard() : mode === "week" ? weekGrid() : monthGrid();

  return `
  <div class="board-bar">
    <div class="segmented">${seg("day","Day")}${seg("week","Week")}${seg("month","Month")}</div>
    <div class="datenav">
      <button data-date="prev" title="Previous ${esc(mode)}">‹</button>
      <span class="today-lbl">${esc(label)}</span>
      <button data-date="next" title="Next ${esc(mode)}">›</button>
    </div>
    <button class="btn sm" data-date="today">Today</button>
    ${mode==="day" ? `<input class="input" type="date" style="width:auto" id="board-date" value="${esc(App.date)}">` : ""}
    <div class="spacer" style="flex:1"></div>
    <span class="filter-note">${esc(scheduleHint(mode))}</span>
    ${mode==="day" ? `<button class="btn sm" data-action="print-board">🖨 Tickets</button>` : ""}
    <button class="btn sm accent" data-action="new-job">＋ New Job</button>
  </div>

  ${loose.length ? `
    <div class="tray">
      <div class="tray-head">
        <span class="nm">⚠ ${loose.length} job${loose.length===1?"":"s"} with no date</span>
        <span class="t-sub" style="font-size:12px">— drag one onto a day to schedule it</span>
      </div>
      <div class="tray-strip">
        ${loose.map(j => miniCard(j, { showDate:false })).join("")}
      </div>
    </div>` : ""}

  ${body}`;
}

function scheduleHint(mode){
  const n = (list) => list.length;
  if (mode === "day"){
    const c = n(Store.data.jobs.filter(j => j.scheduledDate === App.date));
    return `${c} job${c===1?"":"s"} · drag a card onto a technician to assign`;
  }
  if (mode === "week"){
    const days = weekDays(App.date);
    const c = n(Store.data.jobs.filter(j => days.includes(j.scheduledDate)));
    return `${c} job${c===1?"":"s"} this week · drag to change the day or the tech`;
  }
  const c = n(Store.data.jobs.filter(j => sameMonth(j.scheduledDate, App.date)));
  return `${c} job${c===1?"":"s"} this month · click a day to open it`;
}

function sortForBoard(list){
  return list.slice().sort((a,b) => {
    const w = WINDOWS.indexOf(a.window) - WINDOWS.indexOf(b.window);
    return w !== 0 ? w : PRIORITIES.indexOf(a.priority) - PRIORITIES.indexOf(b.priority);
  });
}

  const today = todayStr();
  const inWeek = Store.data.jobs.filter(j => days.includes(j.scheduledDate));
  const rows = [
    { key:"", name:"Unassigned", color:"#b0bcc8", unassigned:true },
    ...Store.activeTechs().map(t => ({ key:t.id, name:t.name, color:t.color, skill:t.skill }))
  ];

  const head = `<div class="wk-corner"></div>` + days.map(d => {
    const dt = parseYmd(d);

  }).join("");

  const body = rows.map(r => {
    const mine = inWeek.filter(j => (j.techId||"") === r.key);
    return `<div class="wk-techcell">
        <span class="avatar" style="background:${esc(r.color)}">${r.unassigned?"?":esc(initials(r.name))}</span>
        <div><div class="nm">${esc(r.name)}</div>

/* One compact card, used in the week grid, the month grid and the tray. */
function miniCard(j, opts){
  opts = opts || {};
  const tech = Store.tech(j.techId);
  return `
  <div class="minicard pri-${esc(j.priority)} st-${esc(j.status)}" draggable="true" data-job="${j.id}">
    <div class="mc-top">
      <span class="mc-win">${esc(opts.compact ? shortWindow(j.window) : j.window)}</span>
      ${opts.showTech === false ? "" :
        (tech ? `<span class="mc-dot" style="background:${esc(tech.color)}" title="${esc(tech.name)}"></span>`
              : `<span class="mc-dot" style="background:#c3ccd6" title="Unassigned"></span>`)}
    </div>
    <div class="mc-cust">${esc(custName(j.customerId))}</div>
    <div class="mc-type">${esc(j.type)}</div>
  </div>`;
}

/* On a field card the arrival window is the thing that matters: "10–12". */
function fieldWindow(w){
  if (!w) return "";
  if (w.startsWith("ASAP")) return "ASAP";
  if (w === "Anytime") return "Any time";
  const m = /^(\d+):\d+–(\d+):\d+/.exec(w);
  return m ? m[1] + "–" + m[2] : w;
}

/* "8:00–10:00" is too wide for a month cell; "8a" is enough. */
function shortWindow(w){
  if (!w) return "";
  if (w.startsWith("ASAP")) return "ASAP";
  if (w === "Anytime") return "Any";
  const m = /^(\d+):(\d+)/.exec(w);
  if (!m) return w;
  const h = Number(m[1]);
  return h + (h >= 8 && h < 12 ? "a" : "p");
}

function jobCardHtml(j){
  return `
  <div class="jobcard pri-${esc(j.priority)} st-${esc(j.status)}" draggable="true" data-job="${j.id}">
    <div class="jc-top">
      <span class="jc-win">${esc(j.window)}</span>
      <span class="jc-id">#${j.no}</span>
    </div>
    <div class="jc-cust">${esc(custName(j.customerId))}</div>
    <div class="jc-meta">${esc(custAddr(j.customerId))}</div>
    <div class="jc-meta" style="margin-top:3px">${esc(j.type)}</div>
    <div class="jc-foot">${statusBadge(j.status)}${j.priority!=="Normal"?priorityBadge(j.priority):""}</div>
  </div>`;
}

function wireBoard(){
  let draggedId = null;

  $$("[data-job][draggable='true']").forEach(card => {
    card.addEventListener("dragstart", e => {
      draggedId = card.dataset.job;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      // Some browsers won't start a drag unless data is set.
      try { e.dataTransfer.setData("text/plain", draggedId); } catch(_){}
    });
    card.addEventListener("dragend", () => {
      draggedId = null;
      card.classList.remove("dragging");
      $$("[data-drop]").forEach(c => c.classList.remove("dragover"));
    });
  });

  $$("[data-drop]").forEach(cell => {
    cell.addEventListener("dragover", e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      cell.classList.add("dragover");
    });
    cell.addEventListener("dragleave", () => cell.classList.remove("dragover"));
    cell.addEventListener("drop", e => {
      e.preventDefault();
      cell.classList.remove("dragover");
      const id = draggedId || (e.dataTransfer && e.dataTransfer.getData("text/plain"));
      const job = id && Store.job(id);
      if (!job) return;

      // A cell can carry a date, a technician, or both. Whatever it names,
      // the job takes; anything it doesn't name is left alone.
      const newDate = cell.dataset.dropDate;
      const hasTech = Object.prototype.hasOwnProperty.call(cell.dataset, "dropTech");
      const newTech = hasTech ? (cell.dataset.dropTech || null) : job.techId;

      const dateChanged = newDate != null && newDate !== job.scheduledDate;
      const techChanged = hasTech && (newTech || "") !== (job.techId || "");
      if (!dateChanged && !techChanged) return;

      if (dateChanged) Store.setDate(job, newDate);
      if (techChanged) Store.assign(job, newTech);
      render();

      const bits = [];
      if (techChanged) bits.push(newTech ? Store.tech(newTech).name : "Unassigned");
      if (dateChanged) bits.push(fmtDate(newDate));
      toast(`#${job.no} → ${bits.join(" · ")}`, "ok");
    });
  });
}

            <span class="mat-q">${m.qty > 1 ? esc(m.qty) + "&times;" : ""}</span>
            <span class="mat-t">${esc(m.text)}</span>
            <input class="input mat-c" type="number" min="0" step="0.01" placeholder="cost"
                   value="${m.cost == null ? "" : esc(m.cost)}"
                   data-mat-cost="${g.kind}:${g.rec.id}:${m.id}" aria-label="What it cost">
          </li>`).join("")}
      </ul>
    </div>`).join("")}

  <p class="t-sub" style="margin-top:16px;max-width:66ch">
    Tick each one as it goes in the cart. Anything still on this list means
    there's another trip in it — which is the whole reason this screen exists.
  </p>`;
}

/* ============================================================
   View: Time & Money — is the flat rate actually working?
   ============================================================ */
function viewTimeMoney(){
  const days = App.moneyRange;
  const since = days ? addDays(todayStr(), -days) : "0000-00-00";
  const target = Number(Store.data.settings.laborRate) || 0;

  const done = Store.data.jobs.filter(j =>
    j.status === "complete" && (j.scheduledDate || "") >= since);
  const timed = done.filter(j => Store.jobTotalMs(j) > 0);
  const untimed = done.length - timed.length;

  // Parts cost is optional. Until he enters it, "billed" includes the price of
  // a water heater and the hourly figure reads far better than the day did.
  const costed = timed.some(j => (Number(j.materialCost) || 0) > 0);

  const row = list => {
    const ms = list.reduce((s,j) => s + Store.jobTotalMs(j), 0);
    const billed = list.reduce((s,j) => s + Store.jobTotal(j), 0);
    const mat = list.reduce((s,j) => s + (Number(j.materialCost) || 0), 0);
    const hrs = hoursOf(ms);
    return { n:list.length, hrs, billed, mat, net: billed - mat,
             rate: hrs > 0 ? (billed - mat) / hrs : null };
  };
  const all = row(timed);

  const byType = [...new Set(timed.map(j => j.type))]
    .map(type => Object.assign({ type }, row(timed.filter(j => j.type === type))))
    .sort((a,b) => (a.rate ?? 1e9) - (b.rate ?? 1e9));

  // Quoting is a cost whether or not the quote lands.
  const sinceMs = days ? (parseYmd(since) ? parseYmd(since).getTime() : 0) : 0;
  const quotes = Store.data.estimates.filter(e => (e.createdAt || 0) >= sinceMs);
  const quoteMs = quotes.reduce((s,e) => s + Store.totalMs(e), 0);
  const lost = quotes.filter(e => e.status === "declined");
  const lostMs = lost.reduce((s,e) => s + Store.totalMs(e), 0);
  const won = quotes.filter(e => e.status === "approved").length;
  const decided = won + lost.length;

  const rateClass = r => r == null ? "" : r >= target ? "rate-good" : r >= target * 0.7 ? "rate-thin" : "rate-bad";
  const rateText = r => r == null ? "—" : money(r) + "/hr";
  const pick = (d, label) =>
    `<button class="btn sm ${days===d?"primary":""}" data-money-range="${d}">${esc(label)}</button>`;

  return `
  <div class="toolbar">
    ${pick(30,"30 days")}${pick(90,"3 months")}${pick(180,"6 months")}${pick(365,"1 year")}${pick(0,"All")}
    <div style="flex:1"></div>
    <span class="filter-note">Your target is ${esc(money(target))}/hr</span>
  </div>

  ${timed.length < 5 ? `
    <div class="legal-note" style="border-color:#f0c9a8;background:#fdf3ea">
      <strong>Only ${timed.length} finished job${timed.length===1?"":"s"} with time on ${timed.length===1?"it":"them"} so far.</strong>
      That's not enough to change your prices over — one bad morning skews it. Keep clocking in
      and come back when you've got a couple of dozen.
    </div>` : ""}

  <div class="stat-row">
    <div class="stat"><div class="label">Hours on the tools</div>
      <div class="value">${all.hrs.toFixed(1)}</div>
      <div class="foot">across ${all.n} finished job${all.n===1?"":"s"}</div></div>
    <div class="stat"><div class="label">${costed ? "Kept after parts" : "Billed"}</div>
      <div class="value">${esc(money(costed ? all.net : all.billed))}</div>
      <div class="foot">${costed ? esc(money(all.billed)) + " billed, " + esc(money(all.mat)) + " of it parts"
        : (untimed ? untimed + " job" + (untimed===1?"":"s") + " had no time logged" : "every job timed")}</div></div>
    <div class="stat"><div class="label">You actually earn</div>
      <div class="value ${rateClass(all.rate)}"${all.rate == null
        ? ` style="font-size:19px;color:var(--muted-2)"` : ""}>${all.rate == null
        ? "Nothing yet" : esc(rateText(all.rate))}</div>
      <div class="foot">${all.rate == null ? "clock a job and this fills itself in"
        : all.rate >= target
        ? "ahead of your " + money(target) + " target"
        : "short of your " + money(target) + " target"}</div></div>
    <div class="stat"><div class="label">Hours quoting</div>
      <div class="value">${hoursOf(quoteMs).toFixed(1)}</div>
      <div class="foot">${hoursOf(lostMs).toFixed(1)}h on quotes that went nowhere</div></div>
  </div>

  <div class="section-title">By type of work — worst rate first</div>
  ${!byType.length ? `
  <div class="card"><div class="empty">
    <div class="big">⏱</div>
    No finished jobs with time logged in this window yet.<br>
    Clock in when you get to a job and out when you leave — this fills itself in.
  </div></div>` : `
  <div class="card"><table>
    <thead><tr>
      <th>Work</th><th class="num">Jobs</th><th class="num">Hours</th>
      <th class="num">Avg time</th><th class="num">Billed</th>${costed
        ? `<th class="num">Parts cost</th>` : ""}<th class="num">Avg price</th>
      <th class="num">You earn</th>
    </tr></thead>
    <tbody>
      ${byType.map(t => `
        <tr>
          <td class="t-strong">${esc(t.type)}</td>
          <td class="num">${t.n}</td>
          <td class="num">${t.hrs.toFixed(1)}</td>
          <td class="num">${esc(fmtDur(t.hrs / t.n * 3600000))}</td>
          <td class="num">${esc(money(t.billed))}</td>
          ${costed ? `<td class="num t-sub">${esc(money(t.mat))}</td>` : ""}
          <td class="num">${esc(money(t.billed / t.n))}</td>
          <td class="num t-strong ${rateClass(t.rate)}">${esc(rateText(t.rate))}</td>
        </tr>`).join("")}
    </tbody>
  </table></div>`}

  ${byType.length && byType[0].rate != null && byType[0].rate < target ? `
    <div class="callout" style="border-left:4px solid var(--amber);background:var(--amber-soft);padding:14px 16px;border-radius:0 6px 6px 0;margin-top:14px;font-size:14px;color:#9c5712">
      <strong>${esc(byType[0].type)} is your thinnest work at ${esc(rateText(byType[0].rate))}.</strong>
      To hit ${esc(money(target))}/hr on the ${byType[0].n} you've done, the average price would need to be
      about ${esc(money((target * byType[0].hrs + byType[0].mat) / byType[0].n))} instead of ${esc(money(byType[0].billed / byType[0].n))}.
    </div>` : ""}

  ${timed.length && !costed ? `
    <div class="legal-note">
      <strong>These rates don't know what your parts cost you.</strong>
      A water heater at ${esc(money(2250))} will always look like a great hour because the tank's
      price is sitting in the billed column. Put what you paid in the
      <em>"What the parts cost you"</em> box on a job and this table starts telling the truth.
    </div>` : ""}

  <div class="section-title">Quoting</div>
  <div class="card"><div class="card-body">
    <div class="money-row"><span class="mr-label">Quotes written</span>
      <span class="mr-val">${quotes.length}</span></div>
    <div class="money-row"><span class="mr-label">Won</span>
      <span class="mr-val">${won}${decided ? ` · ${Math.round(won/decided*100)}% of the ones decided` : ""}</span></div>
    <div class="money-row"><span class="mr-label">Time spent quoting</span>
      <span class="mr-val">${hoursOf(quoteMs).toFixed(1)}h</span></div>
    <div class="money-row" style="border-bottom:0"><span class="mr-label">Of that, on quotes you lost</span>
      <span class="mr-val" style="color:${lostMs ? "var(--amber)" : "inherit"}">${hoursOf(lostMs).toFixed(1)}h${
        target && lostMs ? ` · ${esc(money(hoursOf(lostMs) * target))} of your time` : ""}</span></div>
  </div></div>

  <p class="t-sub" style="margin-top:14px;max-width:70ch">
    "You earn" is what you kept${costed ? " after parts" : ""} divided by the hours you actually
    clocked, including the time spent quoting a job before it became one. It still isn't profit —
    fuel, insurance, the truck and the hours you don't bill for all come out of it.
  </p>`;
}

/* ============================================================
   View: Estimates
   ============================================================ */
function viewEstimates(){
  const f = App.estFilter;
  const all = Store.data.estimates;
  let list = all.slice();
  if (f === "open")     list = list.filter(e => e.status === "draft" || e.status === "sent");
  // Approved is a list of work still to do. Once its job has been billed it
  // drops out of here and lives in All, so this stops growing forever.
  if (f === "approved") list = list.filter(e => {
    if (e.status !== "approved") return false;
    const j = e.jobId ? Store.job(e.jobId) : null;
    return !j || !j.payment || j.payment.status === "unbilled";
  });
  if (f === "declined") list = list.filter(e => e.status === "declined");
  list.sort((a,b) => b.createdAt - a.createdAt);

  const sent = all.filter(e => e.status === "sent");
  const outValue = sent.reduce((s,e) => s + Store.estimateTotal(e), 0);
  const won = all.filter(e => e.status === "approved");
  const liveWon = won.filter(e => {
    const j = e.jobId ? Store.job(e.jobId) : null;
    return !j || !j.payment || j.payment.status === "unbilled";
  });
  const wonValue = won.reduce((s,e) => s + Store.estimateTotal(e), 0);
  const decided = won.length + all.filter(e => e.status === "declined").length;
  const winRate = decided ? Math.round(won.length / decided * 100) : null;

  const tab = (id, label, n) =>
    `<button class="btn sm ${f===id?"primary":""}" data-est-filter="${id}">${esc(label)}${n!=null?` (${n})`:""}</button>`;

  return `
  <div class="stat-row">
    ${(() => {
      const waiting = (Cloud.signLinks || []).filter(l => !l.signed_at).length;
      return `<div class="stat ${sent.length?"alert":""}"><div class="label">Out for decision</div>
        <div class="value">${sent.length}</div>

    <div class="stat"><div class="label">Approved</div>
      <div class="value">${won.length}</div><div class="foot">${esc(money(wonValue))} won</div></div>
    <div class="stat"><div class="label">Win rate</div>
      <div class="value">${winRate==null?"—":winRate+"%"}</div>
      <div class="foot">${decided} decided</div></div>
  </div>

  <div class="toolbar">
    ${tab("open","Open", Store.openEstimates().length)}
    ${tab("approved","Approved", liveWon.length)}
    ${tab("declined","Declined", all.filter(e=>e.status==="declined").length)}
    ${tab("all","All", all.length)}
    <div style="flex:1"></div>
    <button class="btn sm accent" data-action="new-estimate">＋ New Estimate</button>
  </div>

  <div class="card"><table>
    <thead><tr>
      <th>Estimate</th><th>Customer</th><th>Work</th><th>Created</th><th>Status</th><th class="num">Amount</th><th></th>
    </tr></thead>
    <tbody>
      ${list.length ? list.map(e => {
        const c = Store.estContact(e);
        const job = e.jobId ? Store.job(e.jobId) : null;
        return `<tr class="clickable" data-estimate="${e.id}">
          <td class="t-sub" style="font-variant-numeric:tabular-nums">EST-${e.no}</td>
          <td>
            <div class="t-strong">${esc(c.name)}</div>
            <div class="t-sub">${esc([c.address,c.city].filter(Boolean).join(", "))}${e.customerId?"":" · not yet a customer"}</div>
          </td>
          <td><div>${esc(e.type)}</div><div class="t-sub">${(e.items||[]).length} line${(e.items||[]).length===1?"":"s"}</div></td>
          <td class="t-sub">${esc(fmtStamp(e.createdAt).split(" · ")[0])}</td>
          <td>${estBadge(e.status)}${job?`<div class="t-sub" style="margin-top:3px">→ job #${job.no}</div>`:""}</td>
          <td class="num t-strong">${esc(money(Store.estimateTotal(e)))}</td>

            ${e.status === "approved" && !e.jobId
              ? `<button class="btn sm" data-convert="${e.id}">Make the job →</button>` : ""}

        </tr>`;
      }).join("")
      : `<tr><td colspan="7"><div class="empty"><div class="big">📋</div>No estimates in this view.</div></td></tr>`}

      "<strong>Data &amp; Setup</strong> and they'll show up here. " +

            ${l.source && l.source !== "website" ? `<span class="chip">${esc(l.source)}</span>` : ""}</div>
          <div class="addr">${esc([l.service, l.address].filter(Boolean).join(" · ") || "no service given")}</div>
          ${when ? `<div class="what t-sub">came in ${esc(when)}</div>` : ""}

      </div>
      <div class="lead-body">
        ${l.photos.length ? `<div class="lead-shots" data-lead-shots="${esc(l.id)}">
          ${l.photos.map((_, i) => `<div class="ls" data-i="${i}"></div>`).join("")}
        </div>` : ""}
        ${l.what ? `<p class="lead-said">${esc(l.what)}</p>` : ""}
        ${row("Phone", l.phone ? fmtPhone(l.phone) : "")}
        ${row("Email", l.email)}
        ${row("Free", l.timing)}
      </div>
      <div class="stop-acts">
        ${l.phone ? `<a class="btn" href="tel:${esc(String(l.phone).replace(/[^\d+]/g,""))}">📞 Call</a>` : ""}
        <button class="btn accent" data-lead-est="${esc(l.id)}">Make an estimate →</button>
        <button class="btn" data-lead-job="${esc(l.id)}">Book a job →</button>
        <button class="btn ghost" data-lead-drop="${esc(l.id)}">Not a job</button>
        ${String(l.id).startsWith("man_")
          ? `<button class="btn ghost" data-lead-forget="${esc(l.id)}">Delete</button>` : ""}
      </div>
    </div>`;
  };

  return `
  <div class="today-head">
    <span class="big">${open.length ? open.length + " lead" + (open.length===1?"":"s") + " waiting"
                                    : (looking ? "Looking…" : "Nothing waiting")}</span>

  <div class="toolbar" style="margin-bottom:12px">

    </div>` : ""}

  ${looking && !open.length ? `<div class="today-empty">
      <div class="big">🛜</div>Checking the website for new inquiries…
    </div>` : ""}

  ${open.length ? open.map(card).join("")
    : (trouble || looking ? "" : `<div class="today-empty">
         <div class="big">📨</div>
         <div style="font-weight:600;color:var(--text);margin-bottom:4px">Nothing waiting.</div>

  ${handled.length ? `<div class="sec-head">Already dealt with</div>

  <p class="t-sub" style="margin-top:16px;max-width:66ch">

/* ============================================================
   View: Invoices — what's gone out, and what's still owed
   ============================================================
   Before this, an invoice existed only inside the job that produced it.
   To find out what he was owed he had to remember which jobs he'd
   finished and go looking one at a time, which is no way to run a
   business. This is the one screen that answers "what's out there".

   Three lists, and work moves left to right: finished and not yet
   billed, billed and waiting, paid. Saving the PDF moves it from the
   first to the second by itself. Only the last move is a tap, because
   only he knows when the money arrived. */
function viewInvoices(){
  const toSend = Store.invToSend()
    .sort((a,b) => String(a.scheduledDate).localeCompare(String(b.scheduledDate)));
  // Longest out first: the one that's been ignored the longest is the one
  // worth a phone call.
  const out = Store.outstanding().slice()
    .sort((a,b) => (Store.invDaysOut(b) || 0) - (Store.invDaysOut(a) || 0));
  const paid = Store.invPaid().slice()
    .sort((a,b) => ((b.payment || {}).paidAt || 0) - ((a.payment || {}).paidAt || 0));

  const owed     = out.reduce((s,j) => s + Store.balance(j), 0);
  const late     = out.filter(j => Store.invOverdueBy(j) > 0);
  const lateSum  = late.reduce((s,j) => s + Store.balance(j), 0);
  const readySum = toSend.reduce((s,j) => s + Store.invoiceTotal(j), 0);

  const month = todayStr().slice(0,7);
  const thisMonth = paid.filter(j => j.payment.paidAt &&
      ymd(new Date(j.payment.paidAt)).slice(0,7) === month)
    .reduce((s,j) => s + (Number(j.payment.amountPaid) || 0), 0);

  /* Until he picks a tab, open on the one with something on it. Landing on
     an empty Out list while three finished jobs sit unbilled is a wasted tap. */
  const tab = App.invTab || (out.length ? "out" : toSend.length ? "tosend" : "out");

  const list = tab === "tosend" ? toSend : tab === "paid" ? paid : out;
  const btn = (id, label, n) =>
    `<button class="btn sm ${tab===id?"primary":""}" data-inv-tab="${id}">${esc(label)}${n!=null?` (${n})`:""}</button>`;

  const ref = j => (j.payment && j.payment.ref) || (j.invoiceNo ? "INV-" + j.invoiceNo : "#" + j.no);

  /* One row per invoice. Amount on the left where the eye lands, who and
     what in the middle, and the action he'd actually reach for. */
  function row(j){
    const over = Store.invOverdueBy(j);
    const days = Store.invDaysOut(j);
    const due  = Store.invoiceDue(j);
    const bal  = Store.balance(j);
    const got  = Number((j.payment || {}).amountPaid) || 0;

    let amount, when, flag = "", acts, tone;
    if (tab === "tosend"){
      tone   = "inv-tosend";
      amount = Store.invoiceTotal(j);
      when   = j.scheduledDate ? "finished " + fmtDate(j.scheduledDate) : "finished";
      acts   = `<button class="btn primary" data-invoice="${j.id}">Make the invoice →</button>`;
    } else if (tab === "paid"){
      tone   = "inv-paid";
      amount = got;
      when   = (j.payment.paidAt ? "paid " + fmtStamp(j.payment.paidAt).split(" · ")[0] : "paid") +
               (j.payment.method ? " · " + j.payment.method : "");
      acts   = `<button class="btn" data-invoice="${j.id}">See the invoice</button>
                <button class="btn ghost" data-inv-pay="${j.id}">Not actually paid…</button>`;
    } else {
      tone   = over ? "inv-late" : "inv-out";
      amount = bal;
      when   = days == null ? "sent" : days === 0 ? "sent today"
             : `sent ${days} day${days===1?"":"s"} ago`;
      if (due && !over) when += ` · due ${fmtDate(due)}`;
      // Both facts can be true at once — an invoice can be part paid and
      // still overdue — and the one that got dropped was the one he'd want.
      const bits = [];
      if (over) bits.push(`${over} day${over===1?"":"s"} overdue`);
      if (got > 0.005) bits.push(`Part paid — ${money(got)} of ${money(Store.invoiceTotal(j))} in`);
      else if (over) bits.push(`${money(bal)} still owed`);
      if (bits.length) flag = `<div class="stop-flag">${esc(bits.join(" · "))}</div>`;
      acts   = `<button class="btn accent" data-inv-got="${j.id}">💵 Money received</button>
                <button class="btn" data-inv-pay="${j.id}">Part payment…</button>
                <button class="btn ghost" data-invoice="${j.id}">See the invoice</button>`;
    }

    return `<div class="stop ${tone}">
      <div class="stop-main" data-job="${j.id}">
        <div class="stop-when">
          <div class="w">${esc(money(amount))}</div>
          <div class="n">${esc(tab === "tosend" ? "#" + j.no : ref(j))}</div>
        </div>
        <div class="stop-body">
          <div class="cust">${esc(custName(j.customerId))}</div>
          <div class="addr">${esc(j.type)}${tab === "tosend" ? "" : " · job #" + j.no}</div>
          <div class="what t-sub">${esc(when)}</div>
        </div>
      </div>
      ${flag}
      <div class="stop-acts">${acts}</div>
    </div>`;
  }

  const empty = {
    tosend: ["🧾", "Nothing waiting to be billed.",
             "Finish a job with parts or labour on it and it turns up here."],
    out:    ["💵", "Nothing out there.",
             "Every invoice you've sent has been paid. Enjoy it."],
    paid:   ["✓", "Nothing paid yet.",
             "Once you mark an invoice received it moves here and stays, so there's a record of it."]
  }[tab];

  return `
  <div class="stat-row">
    <div class="stat ${owed ? "alert" : ""}"><div class="label">Owed to you</div>
      <div class="value">${esc(money(owed))}</div>
      <div class="foot">${out.length} invoice${out.length===1?"":"s"} out</div></div>
    <div class="stat ${late.length ? "alert" : ""}"><div class="label">Overdue</div>
      <div class="value">${esc(money(lateSum))}</div>
      <div class="foot">${late.length ? late.length + " past the due date" : "nothing late"}</div></div>
    <div class="stat"><div class="label">Ready to invoice</div>
      <div class="value">${esc(money(readySum))}</div>
      <div class="foot">${toSend.length} finished job${toSend.length===1?"":"s"}</div></div>
    <div class="stat"><div class="label">Collected</div>
      <div class="value">${esc(money(thisMonth))}</div>
      <div class="foot">${esc(fmtDate(todayStr(), { month:"long" }))} so far</div></div>
  </div>

  <div class="toolbar">
    ${btn("tosend","To send", toSend.length)}
    ${btn("out","Out", out.length)}
    ${btn("paid","Paid", paid.length)}
    <div style="flex:1"></div>
    <span class="filter-note">Tap a row to open the job</span>
  </div>

  ${list.length ? list.map(row).join("")
    : `<div class="today-empty">
         <div class="big">${empty[0]}</div>
         <div style="font-weight:600;color:var(--text);margin-bottom:4px">${esc(empty[1])}</div>
         <div>${esc(empty[2])}</div>
       </div>`}

  ${tab === "out" && out.length ? `
    <p class="t-sub" style="margin-top:16px;max-width:66ch">
      Stripe doesn't tell the app when somebody pays — it takes the money and
      that's the end of its involvement. So when the money lands, tap
      <strong>Money received</strong> and it moves to Paid. Nothing here is
      guessing on your behalf.
    </p>` : ""}`;
}

/* The money-came-in sheet. One number, already filled in with the whole
   balance, because that's what happens nearly every time. */
function openInvPayment(id){
  const j = Store.job(id);
  if (!j) return;
  const pay   = j.payment || blankPayment();
  const total = Store.invoiceTotal(j);
  const got   = Number(pay.amountPaid) || 0;
  const bal   = Store.balance(j);

  openModal(`
    <div class="modal-head">
      <div><div class="t-sub">${esc(custName(j.customerId))} · job #${esc(j.no)}</div>
        <h2>${esc(pay.ref || (j.invoiceNo ? "INV-" + j.invoiceNo : "Not invoiced yet"))}</h2></div>
      <div class="spacer"></div><button class="x" data-close>&times;</button>
    </div>
    <div class="modal-body">
      <div class="card" style="margin-bottom:14px">
        <div class="money-row"><span class="mr-label">Invoice total</span>
          <span class="mr-val">${esc(money(total))}</span></div>
        <div class="money-row"><span class="mr-label">Already received</span>
          <span class="mr-val">${esc(money(got))}</span></div>
        <div class="money-row" style="border-bottom:0"><span class="mr-label">Still owed</span>
          <span class="mr-val" style="color:${bal>0.005?"var(--amber)":"var(--green)"}">${esc(money(bal))}</span></div>
      </div>
      <div class="row2">
        <div class="field"><label>How much came in</label>
          <input class="input" id="ipay-amt" type="number" min="0" step="0.01" value="${esc(bal.toFixed(2))}">
          <div class="hint">The whole balance is filled in already. Change it for a part payment.</div></div>
        <div class="field"><label>How it came in</label>
          <select class="input" id="ipay-method">
            ${PAY_METHODS.map(m => `<option value="${esc(m)}"${m===pay.method?" selected":""}>${esc(m||"—")}</option>`).join("")}
          </select></div>
      </div>
      <p class="t-sub" style="margin:4px 0 0">

      </p>
    </div>
    <div class="modal-foot">
      <button class="btn primary" data-ipay-save="${j.id}">Record it</button>
      ${got > 0.005 || pay.status === "paid"

      <div class="spacer"></div>
      <button class="btn" data-close>Cancel</button>

}

/* ============================================================
   View: Jobs list
   ============================================================ */
function viewJobs(){
  const f = App.filters;
  const t = todayStr();
  let list = Store.data.jobs.slice();

  if (f.when === "today")    list = list.filter(j => j.scheduledDate === t);
  if (f.when === "upcoming") list = list.filter(j => isOpen(j));
  if (f.when === "past")     list = list.filter(j => !isOpen(j));
  if (f.when === "tobill")   list = Store.toInvoice();
  if (f.when === "unpaid")   list = Store.outstanding();
  if (f.status) list = list.filter(j => j.status === f.status);
  if (f.techId) list = list.filter(j => (j.techId||"") === (f.techId === "none" ? "" : f.techId));
  if (f.type)   list = list.filter(j => j.type === f.type);

  list.sort((a,b) => {
    const A = a.scheduledDate || "9999-99-99", B = b.scheduledDate || "9999-99-99";
    if (A !== B) return f.when === "past" ? B.localeCompare(A) : A.localeCompare(B);
    return WINDOWS.indexOf(a.window) - WINDOWS.indexOf(b.window);
  });

  const opt = (v,label,cur) => `<option value="${esc(v)}"${cur===v?" selected":""}>${esc(label)}</option>`;

  return `
  <div class="toolbar">
    <select id="f-when">
      ${opt("upcoming","Open jobs",f.when)}${opt("today","Today only",f.when)}
      ${opt("past","Closed jobs",f.when)}${opt("all","All jobs",f.when)}
      ${opt("tobill","Ready to invoice",f.when)}${opt("unpaid","Awaiting payment",f.when)}
    </select>
    <select id="f-status">${opt("","Any status",f.status)}${STATUSES.map(s=>opt(s.id,s.label,f.status)).join("")}</select>
    <select id="f-tech">${opt("","Any technician",f.techId)}${opt("none","— Unassigned —",f.techId)}${Store.data.techs.map(x=>opt(x.id,x.name,f.techId)).join("")}</select>
    <select id="f-type">${opt("","Any job type",f.type)}${JOB_TYPES.map(x=>opt(x,x,f.type)).join("")}</select>
    <button class="btn sm ghost" data-action="clear-filters">Clear</button>
    <div style="flex:1"></div>
    <span class="filter-note">${list.length} job${list.length===1?"":"s"}${
      (f.when==="tobill"||f.when==="unpaid")
        ? ` · ${esc(money(list.reduce((sum,j) => sum + (f.when==="unpaid"?Store.balance(j):Store.jobTotal(j)), 0)))}`
        : ""}</span>
    <button class="btn sm accent" data-action="new-job">＋ New Job</button>
  </div>
  <div class="card"><table>${JOB_TABLE_HEAD}<tbody>${jobRows(list)}</tbody></table></div>`;
}

      <div class="card" style="margin-top:16px">

        <div class="card-body t-sub" style="line-height:1.65">

            /* Built from what is actually true on this device, not a list
               written once and left behind. It used to name photos, customer
               messages and invoices as missing long after all three shipped,
               which made the whole panel worth ignoring. */
            const synced = Cloud.configured() && !!Cloud.cfg.refreshToken;
            const live   = !!Store.data.liveSince;
            const todo = [];

            if (!synced) todo.push(`<strong>Connect this device</strong> — so a dead laptop
              isn't a dead business, and the phone and the office see the same jobs.
              <em>See Sync across your devices, above.</em>`);

            if (!d.settings.gst) todo.push(`<strong>GST number, once you're registered</strong>
              — invoices charge no tax until one is on file, which is correct until you
              are, and wrong the day after.`);

            const blanks = [["email","a business email"],["website","your website"],
                            ["address","a business address"]]
              .filter(([k]) => !d.settings[k]).map(([,label]) => label);
            if (blanks.length) todo.push(`<strong>Business details</strong> — still no
              ${esc(blanks.join(", no "))}. Each one prints on documents only once it's filled in.`);

            if (!live) todo.push(`<strong>Clear the demo</strong> — the sample jobs and
              customers are still here. Do it when you take your first real call, not before.`);

            todo.push(`<strong>Get the waivers looked at</strong> — fourteen templates,
              drafted but never reviewed by a lawyer or your insurer. It's the only thing
              on this screen with real liability attached to it.`);

            return (todo.length > 1 || !synced || !live
              ? `What's still outstanding, roughly in the order it starts to hurt:`
              : `Nearly everything is in place. Outstanding:`) +
              `<ul style="padding-left:18px;margin:8px 0 0">
                ${todo.map(t => `<li style="margin-bottom:6px">${t}</li>`).join("")}
              </ul>`;
          })()}
        </div>
      </div>
    </div>
  </div>`;
}

function storageSize(){
  try {
    const bytes = new Blob([JSON.stringify(Store.data)]).size;
    return bytes < 1024 ? bytes + " B" : (bytes/1024).toFixed(1) + " KB";
  } catch(e){ return "—"; }
}

/* ============================================================
   View: Global search results
   ============================================================ */
function viewSearch(){
  const q = App.search.trim().toLowerCase();
  const digits = q.replace(/\D/g,"");
  const custHit = c =>
    c.name.toLowerCase().includes(q) ||
    (c.address||"").toLowerCase().includes(q) ||
    (c.email||"").toLowerCase().includes(q) ||
    (digits.length >= 3 && String(c.phone||"").replace(/\D/g,"").includes(digits));

  const customers = Store.data.customers.filter(custHit);
  const custIds = new Set(customers.map(c => c.id));
  const jobs = Store.data.jobs.filter(j =>
    custIds.has(j.customerId) ||
    String(j.no).includes(q.replace("#","")) ||
    (j.type||"").toLowerCase().includes(q) ||
    (j.description||"").toLowerCase().includes(q)
  ).sort((a,b) => (b.scheduledDate||"").localeCompare(a.scheduledDate||""));

  const estimates = Store.data.estimates.filter(e => {
    const c = Store.estContact(e);
    return custIds.has(e.customerId) ||
      (c.name||"").toLowerCase().includes(q) ||
      (c.address||"").toLowerCase().includes(q) ||
      (digits.length >= 3 && String(c.phone||"").replace(/\D/g,"").includes(digits)) ||
      String(e.no).includes(q.replace(/[^0-9]/g,"")) && q.replace(/[^0-9]/g,"") !== "" ||
      (e.type||"").toLowerCase().includes(q) ||
      (e.description||"").toLowerCase().includes(q);
  }).sort((a,b) => b.createdAt - a.createdAt);

  return `
  <div class="toolbar">
    <span class="filter-note">Results for “${esc(App.search)}” — ${jobs.length} job${jobs.length===1?"":"s"}, ${estimates.length} estimate${estimates.length===1?"":"s"}, ${customers.length} customer${customers.length===1?"":"s"}</span>
    <div style="flex:1"></div>
    <button class="btn sm ghost" data-action="clear-search">Clear search</button>
  </div>
  ${customers.length ? `
    <div class="section-title">Customers</div>
    <div class="card"><table>
      <thead><tr><th>Customer</th><th>Phone</th><th>Address</th><th class="num">Jobs</th></tr></thead>
      <tbody>${customers.map(c => `
        <tr class="clickable" data-customer="${c.id}">
          <td class="t-strong">${esc(c.name)}</td>
          <td>${esc(fmtPhone(c.phone))}</td>
          <td>${esc([c.address,c.city].filter(Boolean).join(", "))}</td>
          <td class="num">${Store.jobsForCustomer(c.id).length}</td>
        </tr>`).join("")}</tbody>
    </table></div>` : ""}
  ${estimates.length ? `
    <div class="section-title">Estimates</div>
    <div class="card"><table>
      <thead><tr><th>Estimate</th><th>Customer</th><th>Work</th><th>Status</th><th class="num">Amount</th></tr></thead>
      <tbody>${estimates.map(e => `
        <tr class="clickable" data-estimate="${e.id}">
          <td class="t-sub">EST-${e.no}</td>
          <td class="t-strong">${esc(Store.estContact(e).name)}</td>
          <td>${esc(e.type)}</td>
          <td>${estBadge(e.status)}</td>
          <td class="num t-strong">${esc(money(Store.estimateTotal(e)))}</td>
        </tr>`).join("")}</tbody>
    </table></div>` : ""}
  <div class="section-title">Jobs</div>
  <div class="card"><table>${JOB_TABLE_HEAD}<tbody>${jobRows(jobs,{emptyMsg:"No jobs matched that search."})}</tbody></table></div>`;
}

/* ============================================================
   Modals
   ============================================================ */
function openModal(html, opts){
  opts = opts || {};
  const root = $("#modal-root");
  root.innerHTML = `<div class="overlay" data-overlay>
    <div class="modal ${opts.wide?"wide":""}" role="dialog" aria-modal="true">${html}</div>
  </div>`;
  const overlay = $("[data-overlay]", root);
  overlay.addEventListener("mousedown", e => { if (e.target === overlay) closeModal(); });
  const first = $(".modal input:not([type=hidden]), .modal select, .modal textarea", root);
  if (first && !opts.noFocus) setTimeout(() => first.focus(), 30);
  document.body.style.overflow = "hidden";
  // a record can open with photo cells in it; the pictures arrive after
  if (typeof fillPhotos === "function") fillPhotos(root);
  if (typeof fillLeadShots === "function") fillLeadShots();
}
function closeModal(){
  $("#modal-root").innerHTML = "";
  document.body.style.overflow = "";
  forgetPlaceModal();
}
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("#modal-root").innerHTML) return closeModal();
  closeNavSheet();
});

/* ---------- Job detail ---------- */
function openJob(id){
  const j = Store.job(id);
  if (!j) return;
  rememberPlace({ kind:"job", id });
  const c = Store.customer(j.customerId);
  const next = NEXT_STATUS[j.status];
  const parts = j.parts || [];
  const partsTotal = parts.reduce((s,p) => s + (Number(p.qty)||0)*(Number(p.price)||0), 0);
  const laborTotal = (Number(j.laborHours)||0) * (Number(j.laborRate)||0);

  openModal(`
    <div class="modal-head">
      <div>
        <div class="t-sub">Job #${j.no} · opened ${esc(fmtStamp(j.createdAt))}</div>
        <h2>${esc(j.type)} — ${esc(c ? c.name : "(deleted customer)")}</h2>
      </div>
      <div class="spacer"></div>
      ${priorityBadge(j.priority)} ${statusBadge(j.status)} ${payBadge(j)}
      <button class="x" data-close>×</button>
    </div>
    <div class="modal-body">
      <div class="status-steps" style="margin-bottom:16px">
        ${next ? `<button class="btn sm" data-advance="${j.id}">Mark ${esc(STATUS_LABEL[next])} →</button>` : ""}
        <select class="input" style="width:auto;padding:5px 8px" data-setstatus="${j.id}">
          ${STATUSES.map(s => `<option value="${s.id}"${s.id===j.status?" selected":""}>${esc(s.label)}</option>`).join("")}
        </select>
        <select class="input" style="width:auto;padding:5px 8px" data-settech="${j.id}">
          <option value="">— Unassigned —</option>
          ${Store.activeTechs().map(t => `<option value="${t.id}"${t.id===j.techId?" selected":""}>${esc(t.name)}</option>`).join("")}
        </select>
        ${c && String(c.phone||"").replace(/\D/g,"")
          ? `<a class="btn sm" href="tel:${esc(String(c.phone).replace(/\D/g,""))}">📞 Call ${esc(c.name.split(" ")[0])}</a>` : ""}
        ${c ? `<button class="btn sm" data-message="${j.id}">💬 Message customer</button>` : ""}
        <button class="btn sm" data-edit-job="${j.id}">Edit details</button>
        <button class="btn sm" data-print-job="${j.id}">🖨 Ticket</button>
        <button class="btn sm primary" data-invoice="${j.id}">🧾 Invoice</button>
      </div>

      <div class="detail-grid">
        <div>
          <div class="dl"><dt>Customer</dt><dd>
            ${c ? `<div class="t-strong">${esc(c.name)}</div>
                   <div>${esc(fmtPhone(c.phone))}</div>
                   ${c.email?`<div class="t-sub">${esc(c.email)}</div>`:""}` : "—"}
          </dd></div>
          <div class="dl"><dt>Service address</dt><dd>${esc(custAddr(j.customerId)) || "—"}</dd></div>
          ${c && c.notes ? `<div class="dl"><dt>Site notes</dt><dd class="t-sub">${esc(c.notes)}</dd></div>` : ""}
        </div>
        <div>
          <div class="dl"><dt>Scheduled</dt><dd>${j.scheduledDate?esc(fmtDateLong(j.scheduledDate)):"Not scheduled"}<br>
            <span class="t-sub">${esc(j.window||"")}</span></dd></div>
          <div class="dl"><dt>Technician</dt><dd>${techPill(j.techId,"lg")}</dd></div>
          ${j.completedAt?`<div class="dl"><dt>Completed</dt><dd>${esc(fmtStamp(j.completedAt))}</dd></div>`:""}
        </div>
      </div>

      <div class="dl"><dt>Reported problem</dt><dd style="white-space:pre-wrap">${esc(j.description)||"—"}</dd></div>

      <div class="section-title" style="margin-top:22px">Parts &amp; labor</div>
      <table style="border:1px solid var(--line);border-radius:6px">
        <thead><tr><th>Item</th><th class="num" style="width:70px">Qty</th><th class="num" style="width:100px">Price</th><th class="num" style="width:100px">Line</th><th style="width:40px"></th></tr></thead>
        <tbody>
          ${parts.map((p,i) => `<tr>
            <td>${esc(p.desc)}</td>
            <td class="num">${esc(p.qty)}</td>
            <td class="num">${esc(money(p.price))}</td>
            <td class="num">${esc(money((Number(p.qty)||0)*(Number(p.price)||0)))}</td>
            <td class="num"><button class="btn sm ghost" data-del-part="${j.id}:${i}" title="Remove">×</button></td>
          </tr>`).join("")}
          <tr>
            <td><input class="input" id="part-desc" placeholder="Add a part or material…"></td>
            <td><input class="input num" id="part-qty" type="number" min="0" step="1" value="1"></td>
            <td><input class="input" id="part-price" type="number" min="0" step="0.01" placeholder="0.00"></td>
            <td colspan="2"><button class="btn sm" data-add-part="${j.id}">Add</button></td>
          </tr>
          <tr>
            <td>Labor <span class="t-sub">@ ${esc(money(j.laborRate||0))}/hr</span></td>
            <td class="num"><input class="input" id="labor-hours" type="number" min="0" step="0.25" value="${esc(j.laborHours||0)}" style="width:70px"></td>
            <td class="num t-sub">hours</td>
            <td class="num">${esc(money(laborTotal))}</td>
            <td class="num"><button class="btn sm" data-save-labor="${j.id}">✓</button></td>
          </tr>
          <tr>
            <td colspan="3" class="t-strong" style="text-align:right">Job total</td>
            <td class="num t-strong">${esc(money(partsTotal + laborTotal))}</td><td></td>
          </tr>
          <tr>
            <td colspan="2" class="t-sub" style="text-align:right">
              What the parts cost <em>you</em> <span class="t-sub">(optional)</span></td>
            <td class="num"><input class="input" id="mat-cost" type="number" min="0" step="0.01"
                 value="${j.materialCost ? esc(j.materialCost) : ""}" placeholder="0.00" style="width:90px"></td>
            <td class="num t-sub">${j.materialCost
              ? "leaves " + esc(money(partsTotal + laborTotal - j.materialCost))
              : "for Time &amp; Money"}</td>
            <td class="num"><button class="btn sm" data-save-matcost="${j.id}">✓</button></td>
          </tr>
          ${j.quotedTotal != null ? (() => {
            const est = j.estimateId ? Store.estimate(j.estimateId) : null;
            const diff = (partsTotal + laborTotal) - j.quotedTotal;
            const over = diff > 0.005, under = diff < -0.005;
            return `<tr>
              <td colspan="3" class="t-sub" style="text-align:right">
                Quoted${est?` on <span class="linkish" data-estimate="${est.id}">EST-${est.no}</span>`:""}</td>
              <td class="num t-sub">${esc(money(j.quotedTotal))}</td><td></td>
            </tr>
            ${over || under ? `<tr>
              <td colspan="3" class="t-sub" style="text-align:right">${over?"Over quote":"Under quote"}</td>
              <td class="num t-strong" style="color:${over?"var(--red)":"var(--green)"}">${over?"+":"−"}${esc(money(Math.abs(diff)))}</td><td></td>
            </tr>` : ""}`;
          })() : ""}
        </tbody>

function saveJobFromForm(id){
  const custVal = $("#f-customer").value;
  const desc = $("#f-desc").value.trim();
  let ok = true;

  $("#e-customer").style.display = "none";
  $("#e-desc").style.display = "none";

  let customerId = custVal;
  if (custVal === "__new"){
    const name = $("#nc-name").value.trim();
    if (!name){ $("#nc-name").classList.add("invalid"); ok = false; }
    else {
      const c = {
        id: uid("cus"), name,
        phone: $("#nc-phone").value.trim(),
        email: "",
        address: $("#nc-address").value.trim(),
        city: $("#nc-city").value.trim() || "Edmonton", zone: "city",
        notes: "", createdAt: Date.now()
      };
      Store.data.customers.push(c);
      customerId = c.id;
    }
  } else if (!custVal){
    $("#e-customer").style.display = "block"; ok = false;
  }
  if (!desc){ $("#e-desc").style.display = "block"; ok = false; }
  if (!ok) return;

  const fields = {
    customerId,
    type: $("#f-type").value,
    priority: $("#f-priority").value,
    scheduledDate: $("#f-date").value || null,
    window: $("#f-window").value,
    description: desc
  };
  const techId = $("#f-tech").value || null;

  if (id){
    const j = Store.job(id);
    Object.assign(j, fields);
    if ((j.techId||"") !== (techId||"")) Store.assign(j, techId);
    Store.addLog(j, "Job details updated");
    Store.save();
    closeModal(); render(); openJob(j.id);
    toast("Job updated", "ok");
  } else {
    const j = Object.assign({
      id: uid("job"), no: Store.nextJobNo(), createdAt: Date.now(),
      status: "new", techId: null, completedAt: null,
      laborHours: 0, laborRate: Store.data.settings.laborRate,
      parts: [], payment: blankPayment(), log: [{ ts: Date.now(), text: "Job created" }]
    }, fields);
    Store.data.jobs.push(j);
    if (techId) Store.assign(j, techId);
    else if (j.scheduledDate) { j.status = "scheduled"; Store.addLog(j, "Scheduled, awaiting a technician"); }
    Store.save();
    closeModal(); render();
    toast(`Job #${j.no} created`, "ok");
  }
}

/* ---------- Estimate detail ---------- */
function openEstimate(id){
  const e = Store.estimate(id);
  if (!e) return;
  rememberPlace({ kind:"estimate", id });
  const c = Store.estContact(e);
  const total = Store.estimateTotal(e);
  const job = e.jobId ? Store.job(e.jobId) : null;
  const items = e.items || [];
  const book = Store.data.priceBook;

  const actions = [];
  if (e.status === "draft")  actions.push(`<button class="btn sm" data-est-status="${e.id}:sent">Mark as Sent</button>`);
  if (e.status === "draft" || e.status === "sent"){
    actions.push(`<button class="btn primary sm" data-est-status="${e.id}:approved">✓ They approved it</button>`);
    actions.push(`<button class="btn sm" data-est-status="${e.id}:declined">Customer declined</button>`);
  }
  // Normally approving makes the job by itself; this only shows if that
  // could not happen — no line items, or no name to make a customer from.
  if (e.status === "approved" && !e.jobId)
    actions.push(`<button class="btn sm" data-convert="${e.id}">Make the job →</button>`);
  if (e.status === "declined")
    actions.push(`<button class="btn sm" data-est-status="${e.id}:sent">Reopen as Sent</button>`);

  openModal(`
    <div class="modal-head">
      <div>
        <div class="t-sub">Estimate EST-${e.no} · created ${esc(fmtStamp(e.createdAt))}</div>
        <h2>${esc(e.type)} — ${esc(c.name)}</h2>
      </div>
      <div class="spacer"></div>
      ${estBadge(e.status)}
      <button class="x" data-close>×</button>
    </div>
    <div class="modal-body">
      <div class="status-steps" style="margin-bottom:16px">
        ${actions.join("")}
        <button class="btn sm" data-edit-estimate="${e.id}">Edit details</button>
        ${e.approval ? "" : `<button class="btn sm primary" data-sign-estimate="${e.id}">✍ Sign &amp; approve here</button>`}
        ${e.approval ? "" : `<button class="btn sm accent" data-link-estimate="${e.id}">✉ ${e.linkSentAt ? "Send the link again" : "Send it to them to sign"}</button>`}
        <button class="btn sm" data-send-estimate="${e.id}">Just the numbers, no link</button>
        <button class="btn sm" data-print-estimate="${e.id}">🖨 Print estimate</button>
      </div>

      ${(() => {
        if (e.approval) return "";
        const mine = (Cloud.signLinks || []).filter(l => l.estimate_id === e.id);
        const out  = mine.filter(l => !l.signed_at)
          .sort((a,b) => String(b.created_at).localeCompare(String(a.created_at)))[0];
        const err  = Cloud.linkError;

        /* The whole point of Check now is the times it has not come back by
           itself, so hiding it whenever the lookup fails took the tool away
           at precisely the moment it was needed. It shows for anything sent
           and not yet approved. */
        if (!out && !mine.length && !(err && e.status === "sent")) return "";

        const check = `<button class="btn sm primary" data-check-signed="${e.id}">Check now</button>`;

        if (err){
          const why = {
            "offline":  "No connection. It'll come in when you've got a bar.",
            "no-table": "The signing table isn't readable yet. If you only just ran " +
                        "<strong>supabase-signing.sql</strong>, give it a minute — the database " +
                        "takes a moment to notice a new table. If it keeps saying this, the SQL " +
                        "didn't finish."
          }[err] || esc(err);
          return `<div class="opt-card" style="cursor:default;margin-bottom:16px;border-color:#f0d6bb;background:var(--amber-soft)">
            <div class="oc-t">⚠ Can't check for signatures</div>
            <div class="oc-s">${why}</div>
            <div style="margin-top:9px">${check}</div>
          </div>`;
        }

        // Signed, but the approval hasn't been written on yet.
        if (!out && mine.some(l => l.signed_at)){
          return `<div class="opt-card" style="cursor:default;margin-bottom:16px;border-color:#bfe0cc;background:var(--green-soft)">
            <div class="oc-t">✓ They signed it</div>
            <div class="oc-s">Bringing it in now.</div>
            <div style="margin-top:9px">${check}</div>
          </div>`;
        }
        if (!out) return "";

        // A link that was made but never actually sent is not "out" — saying so
        // is exactly the lie that leaves him wondering whether it went.
        if (!e.linkSentAt && !out.signed_at){
          return `<div class="opt-card" style="cursor:default;margin-bottom:16px;border-color:#d6d1f5;background:var(--purple-soft)">
            <div class="oc-t">🔗 A link is ready — you haven't sent it yet</div>
            <div class="oc-s">Nothing has gone to them. Open it again to text or email it.</div>
            <div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn sm primary" data-link-estimate="${e.id}">Send it now</button>
              <button class="btn sm" data-copy-link="${esc(out.token)}" data-sent-id="${e.id}">Copy the link</button>
              ${check}
            </div>
          </div>`;
        }

        const sent = out.created_at ? daysBetween(String(out.created_at).slice(0,10), todayStr()) : null;
        const dead = out.expires_at && new Date(out.expires_at) < new Date();
        return `<div class="opt-card" style="cursor:default;margin-bottom:16px;border-color:#d6d1f5;background:var(--purple-soft)">
          <div class="oc-t">🔗 ${dead ? "The signing link has expired" : "Out for signature"}</div>
          <div class="oc-s">${dead
            ? "Send a fresh one when you're ready."
            : `Sent ${sent === 0 ? "today" : sent === 1 ? "yesterday" : sent + " days ago"} —
               waiting on them. It lands here the moment they sign.`}</div>
          <div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap">
            ${dead ? "" : check}
            <button class="btn sm" data-copy-link="${esc(out.token)}">Copy the link again</button></div>
        </div>`;
      })()}

      ${e.approval ? (() => {
        const drift = Store.approvalDrift(e);
        return `<div class="opt-card on" style="cursor:default;margin-bottom:16px">
          <div class="oc-t">✍ Approved by ${esc(e.approval.name)}${e.approval.role ? " · " + esc(e.approval.role) : ""}</div>
          <div class="oc-s">${esc(fmtStamp(e.approval.at))} · ${esc(e.approval.how)} ·
            agreed at ${esc(money(e.approval.total))}</div>
          ${e.approval.signature ? `<div style="margin-top:8px"><img src="${esc(e.approval.signature)}"
               alt="Signature of ${esc(e.approval.name)}" style="max-height:60px;background:#fff;border-radius:4px"></div>` : ""}
          ${Math.abs(drift) > 0.005 ? `<div class="stop-flag" style="margin:10px -14px -12px;border-radius:0">
            Edited since they signed — it now comes to ${esc(money(Store.estimateTotal(e)))},
            ${drift > 0 ? esc(money(drift)) + " more" : esc(money(-drift)) + " less"} than they agreed to.
            Get it re-approved before you bill it.</div>` : ""}
        </div>`;
      })() : ""}

      ${job ? `<div class="opt-card on" style="cursor:default;margin-bottom:16px">
        <div class="oc-t">✅ Converted to job #${job.no}</div>
        <div class="oc-s">${esc(STATUS_LABEL[job.status])} · <span class="linkish" data-job="${job.id}">open the job →</span></div>
      </div>` : ""}

      <div class="detail-grid">
        <div>
          <div class="dl"><dt>${e.customerId ? "Customer" : "Quoted to"}</dt><dd>
            <div class="t-strong">${esc(c.name)}</div>
            <div>${esc(fmtPhone(c.phone))}</div>
            ${c.email?`<div class="t-sub">${esc(c.email)}</div>`:""}
            ${e.customerId
              ? `<div class="t-sub linkish" data-customer="${e.customerId}" style="margin-top:3px">view customer →</div>`
              : `<div class="t-sub" style="margin-top:3px">Not a customer yet — added on approval.</div>`}
          </dd></div>
        </div>
        <div>
          <div class="dl"><dt>Service address</dt><dd>${esc([c.address,c.city].filter(Boolean).join(", ")) || "—"}</dd></div>
          <div class="dl"><dt>Valid for</dt><dd>${esc(e.validDays||30)} days${e.sentAt?` · sent ${esc(fmtStamp(e.sentAt))}`:""}</dd></div>
        </div>
      </div>

      <div class="dl"><dt>Scope of work</dt><dd style="white-space:pre-wrap">${esc(e.description)||"—"}</dd></div>

      ${(() => {
        const lead = e.fromLead ? Store.leads().find(l => l.id === e.fromLead) : null;

      <div class="section-title" style="margin-top:22px">Photos</div>

/* ---------- Signature pad ---------- */
let SigPad = null;
function initSigPad(){
  const cv = $("#sigpad");
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  cv.width  = Math.max(1, Math.round(rect.width  * dpr));
  cv.height = Math.max(1, Math.round(rect.height * dpr));
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#16222e";

  SigPad = {
    cv, ctx, dpr, drawing:false, dirty:false,
    cssW: rect.width, cssH: rect.height,
    bounds: { minX:Infinity, minY:Infinity, maxX:-Infinity, maxY:-Infinity }
  };

  const pos = ev => {
    const r = cv.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  };
  const mark = pt => {
    const b = SigPad.bounds;
    if (pt.x < b.minX) b.minX = pt.x;
    if (pt.y < b.minY) b.minY = pt.y;
    if (pt.x > b.maxX) b.maxX = pt.x;
    if (pt.y > b.maxY) b.maxY = pt.y;
  };
  const start = ev => {
    ev.preventDefault();
    SigPad.drawing = true;
    const pt = pos(ev);
    mark(pt);
    ctx.beginPath(); ctx.moveTo(pt.x, pt.y);
    try { cv.setPointerCapture(ev.pointerId); } catch(_){}
  };
  const move = ev => {
    if (!SigPad.drawing) return;
    ev.preventDefault();
    const pt = pos(ev);
    mark(pt);
    ctx.lineTo(pt.x, pt.y); ctx.stroke();
    if (!SigPad.dirty){
      SigPad.dirty = true;
      $("#sigwrap").classList.add("filled");
      const err = $("#wv-sig-err");
      if (err) err.style.display = "none";
    }
  };
  const end = () => { SigPad.drawing = false; };

  cv.addEventListener("pointerdown", start);
  cv.addEventListener("pointermove", move);
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);
  cv.addEventListener("pointerleave", end);
}
function clearSigPad(){
  if (!SigPad) return;
  SigPad.ctx.clearRect(0, 0, SigPad.cv.width, SigPad.cv.height);
  SigPad.dirty = false;
  SigPad.bounds = { minX:Infinity, minY:Infinity, maxX:-Infinity, maxY:-Infinity };
  $("#sigwrap").classList.remove("filled");
}

/* Export just the inked area. Storing the whole blank canvas costs ~50KB a
   signature, which fills the browser's storage after a couple of months of
   work; cropped to the ink it is a fraction of that. */
function exportSignature(){
  if (!SigPad || !SigPad.dirty) return null;
  const { cv, dpr, bounds: b, cssW, cssH } = SigPad;
  const pad = 8;
  const x = Math.max(0, b.minX - pad);
  const y = Math.max(0, b.minY - pad);
  const w = Math.min(cssW - x, (b.maxX - b.minX) + pad * 2);
  const h = Math.min(cssH - y, (b.maxY - b.minY) + pad * 2);
  if (!(w > 0 && h > 0)) return cv.toDataURL("image/png");

  // Enough resolution to stay crisp in print, capped so the file stays small.
  const scale = Math.min(dpr, 2, 900 / w);
  const out = document.createElement("canvas");
  out.width  = Math.max(1, Math.round(w * scale));
  out.height = Math.max(1, Math.round(h * scale));
  const octx = out.getContext("2d");
  octx.drawImage(cv, x * dpr, y * dpr, w * dpr, h * dpr, 0, 0, out.width, out.height);
  return out.toDataURL("image/png");
}

function saveWaiverSignature(payload){
  const [tplId, jobId] = payload.split(":");
  const tpl = Store.waiverTemplate(tplId);
  const job = jobId ? Store.job(jobId) : null;
  let ok = true;

  const boxes = $$(".wv-ack");
  const allTicked = boxes.every(b => b.checked);
  $("#wv-ack-err").style.display = allTicked ? "none" : "block";
  if (!allTicked) ok = false;

  const name = $("#wv-name").value.trim();
  if (!name){ $("#wv-name").classList.add("invalid"); ok = false; }

  const signed = SigPad && SigPad.dirty;
  $("#wv-sig-err").style.display = signed ? "none" : "block";
  if (!signed) ok = false;

  if (!ok) return;

  const rec = Store.signWaiver(tpl, {
    job,
    signerName: name,
    signerRole: $("#wv-role").value,
    fillIns: $("#wv-fill") ? $("#wv-fill").value.trim() : "",
    signature: exportSignature()
  });

  closeModal(); render();
  if (job) openJob(job.id); else openSignedWaiver(rec.id);
  toast(`${tpl.title} signed by ${name}`, "ok");
}

function saveTemplateFromForm(id){
  const title = $("#wt-title").value.trim();
  const body  = $("#wt-body").value.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
  const acks  = $("#wt-acks").value.split("\n").map(x => x.trim()).filter(Boolean);
  let ok = true;
  if (!title){ $("#wt-title").classList.add("invalid"); ok = false; }
  $("#wt-body-err").style.display = body.length ? "none" : "block";
  $("#wt-acks-err").style.display = acks.length ? "none" : "block";
  if (!body.length || !acks.length) ok = false;
  if (!ok) return;

  const fields = { title, category: $("#wt-cat").value, whenToUse: $("#wt-when").value.trim(), body, acks };
  if (id){ Object.assign(Store.waiverTemplate(id), fields); toast("Template updated", "ok"); }
  else {
    Store.data.waiverTemplates.push(Object.assign({ id: uid("wt"), key: null, builtin: false, archived: false }, fields));
    toast("Waiver created", "ok");
  }
  Store.save(); closeModal();
  App.view = "waivers"; App.waiverTab = "templates";
  render();
}

/* Leads in front of him on the day's screen, without a notification.
   Victor does the pinging and he likes it that way — this is just so the
   list can't be forgotten once the ping has scrolled past. */
function leadStrip(){
  const n = Store.leadsOpen().length;
  if (!n) return "";
  return `
  <div class="waiting lead-wait" data-nav="leads" style="cursor:pointer">
    <span class="w-ico">📨</span>
    <span><b>${n} new lead${n===1?"":"s"}</b> off the website, waiting on you.</span>
    <button class="btn sm ghost w-act" data-nav="leads">Open</button>
  </div>`;
}

function waitingStrip(){
  if (!Cloud.configured() || !Cloud.cfg.refreshToken) return "";
  const photos = Store.pendingPhotos().length;
  const offline = Cloud.state === "error";
  // Ordinary edits go up in a couple of seconds and are tiny. Saying so after
  // every keystroke would make this strip noise, and then he'd stop reading
  // it on the day it matters. Photos and a dead connection only.
  if (!photos && !offline) return "";

  return `
  <div class="waiting">
    <span class="w-ico">${offline ? "📡" : "↑"}</span>
    <span>
      ${photos ? `<b>${photos} photo${photos===1?"":"s"}</b> still only on this phone. ` : ""}
      ${offline
        ? "No connection right now. Everything's safe here and goes up by itself when you're back in range."
        : "Uploading now."}
    </span>
    ${offline ? "" : `<button class="btn sm ghost w-act" data-action="sync-now">Retry</button>`}
  </div>`;
}

async function printInvoice(id){
  const j = Store.job(id);
  if (!j) return;
  $("#print-area").innerHTML = await invoiceDocHtml(j);
  // give the photos a moment to decode, or they print as empty boxes
  const imgs = $$("#print-area img");
  await Promise.all(imgs.map(i => i.complete ? null : new Promise(r => {
    i.onload = r; i.onerror = r; setTimeout(r, 1500);
  })));
  window.print();
  /* Saving the PDF is the moment the invoice leaves his hands, so that's
     when it joins the Invoices list. Waiting for him to tick a box
     somewhere afterwards means it never gets ticked. */
  const fresh = !j.payment || j.payment.status === "unbilled";
  Store.markInvoiced(j);
  if (fresh) toast(`INV-${j.invoiceNo} is in Invoices now, waiting on payment`, "ok");
  renderQuiet();
}

/* The record draws first and the pictures arrive after. */
async function fillPhotos(root){
  const cells = $$("[data-ph-img]", root || document);
  for (const el of cells){
    if (el.dataset.filled) continue;
    const id = el.dataset.phImg;
    let url = await Photos.localUrl(id);
    if (!url){
      const found = Store.findPhoto(id);
      if (found && found.photo.up && Cloud.configured() && Cloud.cfg.refreshToken){
        try { url = await Cloud.signPhoto(found.photo.path); } catch(e){ url = null; }
      }
    }
    if (url){
      el.style.backgroundImage = `url("${url}")`;
      el.dataset.filled = "1";
    } else {
      el.classList.add("ph-missing");
      el.textContent = "—";
      el.dataset.filled = "1";
    }
  }
}

function refreshPhotos(kind, id){
  const rec = Store.recordOf(kind, id);
  const host = $(`[data-ph-host="${kind}:${id}"]`);
  if (!rec || !host) return;
  const wrap = document.createElement("div");
  wrap.innerHTML = photosPanel(kind, rec);
  const fresh = wrap.firstElementChild;
  host.replaceWith(fresh);
  fillPhotos(fresh);
}

/* Taking several at once is normal — a before, a model plate, a close-up. */
async function takePhotos(kind, id, files){
  const rec = Store.recordOf(kind, id);
  if (!rec || !files || !files.length) return;
  const host = $(`[data-ph-host="${kind}:${id}"]`);
  if (host) host.classList.add("busy");

  let added = 0, failed = 0;
  for (const file of Array.from(files)){
    if (!/^image\//.test(file.type || "")){ failed++; continue; }
    try {
      const { blob, w, h } = await Photos.shrink(file);
      const meta = Store.addPhoto(kind, id, { w, h, size: blob.size, name: file.name || "" });
      await Photos.put(meta.id, blob);
      added++;
    } catch(e){ failed++; }
  }

  if (host) host.classList.remove("busy");
  refreshPhotos(kind, id);
  if (added) toast(added === 1 ? "Photo saved" : added + " photos saved", "ok");
  if (failed) toast(failed + " couldn't be read", "err");
  if (added) Cloud.flushPhotos().then(n => { if (n) Cloud.markDirty(); });
}
