<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Park City Plumbing — Service Dispatch</title>
<style>
:root{
  --navy:#0f2740; --navy-2:#16354f;
  --blue:#1d6fa5; --blue-soft:#e8f1f8;
  --orange:#e2701f; --orange-soft:#fdf0e5;
  --bg:#f3f6f9; --card:#fff; --line:#e1e7ed;
  --text:#16222e; --muted:#6b7c8c; --muted-2:#93a2b0;
  --green:#1f8a4c; --green-soft:#e6f4ec;
  --red:#c0392b; --red-soft:#fbeae8;
  --purple:#5b4bb5; --purple-soft:#eeecfa;
  --radius:8px;
  --shadow:0 1px 2px rgba(16,36,56,.06),0 2px 8px rgba(16,36,56,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh}
#sidebar{
  width:216px;flex:0 0 216px;background:var(--navy);color:#cfdcea;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .mark{display:flex;align-items:center;gap:9px}
.brand .logo{
  width:30px;height:30px;border-radius:7px;background:var(--orange);
  display:grid;place-items:center;font-size:16px;flex:0 0 30px;
}
.brand .name{color:#fff;font-weight:700;font-size:14px;line-height:1.15;letter-spacing:-.01em}
.brand .sub{font-size:11px;color:#8ba2b9;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
nav{padding:10px 10px;flex:1;overflow:auto}
nav .nav-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#6f88a1;padding:12px 8px 6px}
nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;color:#cfdcea;padding:8px 10px;border-radius:6px;
  font-size:13.5px;margin-bottom:1px;
}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button.active{background:var(--blue);color:#fff;font-weight:600}
nav button .ico{width:18px;text-align:center;font-size:14px;opacity:.95}
nav button .count{
  margin-left:auto;background:rgba(255,255,255,.14);color:#fff;font-size:11px;
  padding:1px 6px;border-radius:9px;font-weight:600;
}
nav button.active .count{background:rgba(255,255,255,.25)}
nav button .count.alert{background:var(--orange);color:#fff}
.sidebar-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#728ca6}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
header.topbar{
  background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:19px}
.topbar .crumb{font-size:12px;color:var(--muted);margin-bottom:1px}
.topbar .spacer{flex:1}
.search{position:relative}
.search input{
  width:250px;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:6px;
  background:var(--bg);outline:none;
}
.search input:focus{border-color:var(--blue);background:#fff}
.search .si{position:absolute;left:9px;top:7px;color:var(--muted-2);font-size:13px}
main.content{padding:22px 24px 60px;flex:1}

/* ---------- Buttons ---------- */
.btn{
  border:1px solid var(--line);background:#fff;color:var(--text);
  padding:8px 13px;border-radius:6px;font-size:13.5px;font-weight:550;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{background:#f7f9fb;border-color:#cfd8e1}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1a6193;border-color:#1a6193}
.btn.accent{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.accent:hover{background:#cc6317;border-color:#cc6317}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:#eef2f6;color:var(--text)}
.btn.danger{color:var(--red);border-color:#f0d4d0}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Cards / layout ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{
  padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
}
.card-head h3{font-size:14.5px}
.card-head .spacer{flex:1}
.card-body{padding:16px}
.grid{display:grid;gap:16px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .value{font-size:27px;font-weight:700;margin-top:5px;letter-spacing:-.02em}
.stat .foot{font-size:12px;color:var(--muted);margin-top:2px}
.stat.alert{border-color:#f3c9a8;background:linear-gradient(180deg,#fff9f3,#fff)}
.stat.alert .value{color:var(--orange)}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;margin:26px 0 10px}
.two-col{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:1080px){.two-col{grid-template-columns:1fr}}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:650;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafcfd;white-space:nowrap;
}
td{padding:11px 12px;border-bottom:1px solid #eef2f6;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:#f7fafc}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.t-strong{font-weight:600}
.t-sub{font-size:12px;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:26px;opacity:.5;margin-bottom:8px}

/* ---------- Badges ---------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 8px;border-radius:20px;white-space:nowrap;line-height:1.4;
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{background:#eef2f6;color:#54687a}
.s-scheduled{background:var(--blue-soft);color:#175f8e}
.s-dispatched{background:var(--purple-soft);color:var(--purple)}
.s-in_progress{background:var(--orange-soft);color:#b95b12}
.s-complete{background:var(--green-soft);color:var(--green)}
.s-cancelled{background:#f0f2f4;color:#8b98a4;text-decoration:line-through}
.p-Emergency{background:var(--red-soft);color:var(--red)}
.p-High{background:var(--orange-soft);color:#b95b12}
.p-Normal{background:#eef2f6;color:#54687a}
.p-Low{background:#eef2f6;color:#8b98a4}
.e-draft{background:#eef2f6;color:#54687a}
.e-sent{background:var(--orange-soft);color:#b95b12}
.e-approved{background:var(--green-soft);color:var(--green)}
.e-declined{background:var(--red-soft);color:var(--red)}
.money-lg{font-size:19px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.linkish{color:var(--blue);cursor:pointer;font-weight:600}
.linkish:hover{text-decoration:underline}
.sigpad-wrap{border:1px solid #d5dde5;border-radius:7px;background:#fff;position:relative;overflow:hidden}
.sigpad-wrap.filled{border-color:var(--green)}
#sigpad{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair}
.sigpad-line{position:absolute;left:24px;right:24px;bottom:34px;border-bottom:1px solid #cfd8e1;pointer-events:none}
.sigpad-hint{position:absolute;left:24px;bottom:14px;font-size:11.5px;color:var(--muted-2);pointer-events:none}
.waiver-body p{margin:0 0 10px;line-height:1.6}
.waiver-body p:last-child{margin-bottom:0}
.ack-list{list-style:none;margin:0;padding:0}
.ack-list li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f2f5f8}
.ack-list li:last-child{border-bottom:0}
.ack-list input{margin-top:3px;flex:0 0 auto;width:15px;height:15px}
.ack-list label{font-size:13px;line-height:1.5;cursor:pointer}
.legal-note{
  border:1px solid #f0d9b8;background:#fdf7ee;border-radius:7px;padding:12px 14px;
  font-size:12.5px;line-height:1.6;color:#7a5a25;margin-bottom:16px;
}
.legal-note strong{color:#5e441a}
.pay-unbilled{background:#eef2f6;color:#54687a}
.pay-invoiced{background:var(--orange-soft);color:#b95b12}
.pay-paid{background:var(--green-soft);color:var(--green)}
.pay-partial{background:var(--orange-soft);color:#b95b12}
.money-row{display:flex;align-items:baseline;gap:10px;padding:9px 16px;border-bottom:1px solid #f2f5f8}
.money-row .mr-label{font-size:12.5px;color:var(--muted)}
.money-row .mr-val{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:650}
.tpl-card{border:1px solid var(--line);border-radius:8px;background:#fff;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.tpl-card .tc-cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--blue)}
.tpl-card h4{font-size:14px;margin:5px 0 6px;line-height:1.35}
.tpl-card .tc-when{font-size:12.5px;color:var(--muted);line-height:1.55}
.tpl-card .tc-foot{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:14px}
.pick-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
.pick-row .field{margin-bottom:0}
.opt-card{border:1px solid var(--line);border-radius:7px;padding:12px 14px;margin-bottom:10px;cursor:pointer;background:#fff}
.opt-card:hover{border-color:#c6d2de}
.opt-card.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 3px rgba(29,111,165,.1)}
.opt-card .oc-t{font-weight:650;font-size:13.5px;display:flex;align-items:center;gap:7px}
.opt-card .oc-s{font-size:12px;color:var(--muted);margin-top:2px}
.chip{
  display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:5px;
  background:#eef2f6;color:#54687a;font-weight:550;
}
.tech-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.avatar{
  width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:10px;font-weight:700;color:#fff;flex:0 0 22px;letter-spacing:.02em;
}
.avatar.lg{width:32px;height:32px;font-size:12px;flex-basis:32px}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:#455565;margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--muted-2);margin-top:4px}
.input,select.input,textarea.input{
  width:100%;padding:8px 10px;border:1px solid #d5dde5;border-radius:6px;background:#fff;outline:none;
}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,111,165,.12)}
textarea.input{resize:vertical;min-height:76px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}
.err{color:var(--red);font-size:12px;margin-top:4px}
.input.invalid{border-color:var(--red)}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(15,39,64,.45);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;
}
.modal{
  background:#fff;border-radius:10px;width:100%;max-width:720px;
  box-shadow:0 12px 40px rgba(10,25,45,.28);animation:pop .13s ease-out;
}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:translateY(-8px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-head h2{font-size:16.5px}
.modal-head .spacer{flex:1}
.modal-body{padding:20px;max-height:calc(100vh - 220px);overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;background:#fafcfd;border-radius:0 0 10px 10px}
.modal-foot .spacer{flex:1}
.x{border:0;background:none;font-size:20px;color:var(--muted);line-height:1;padding:2px 6px;border-radius:5px}
.x:hover{background:#eef2f6;color:var(--text)}

/* ---------- Schedule board ---------- */
.board-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px}
.datenav button{border:0;background:none;padding:6px 10px;border-radius:4px;color:var(--muted)}
.datenav button:hover{background:#eef2f6;color:var(--text)}
.datenav .today-lbl{padding:0 10px;font-weight:650;font-size:13.5px;min-width:180px;text-align:center}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{
  flex:1 1 238px;min-width:238px;max-width:340px;background:#eaeff4;border-radius:8px;padding:8px;min-height:180px;
  border:1px solid #dfe6ed;
}
.col.unassigned{background:var(--orange-soft);border-color:#f2d7bd}
.col.dragover{outline:2px dashed var(--blue);outline-offset:-3px;background:#e2eef7}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 4px 10px}
.col-head .nm{font-weight:650;font-size:13px}
.col-head .ct{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600;background:#fff;padding:1px 7px;border-radius:10px}
.jobcard{
  background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px;margin-bottom:8px;
  cursor:grab;box-shadow:0 1px 2px rgba(16,36,56,.07);border-left:3px solid var(--blue);
}
.jobcard:hover{border-color:#c6d2de;box-shadow:0 2px 8px rgba(16,36,56,.1)}
.jobcard:active{cursor:grabbing}
.jobcard.dragging{opacity:.4}
.jobcard.pri-Emergency{border-left-color:var(--red)}
.jobcard.pri-High{border-left-color:var(--orange)}
.jobcard.pri-Low{border-left-color:#c3ccd6}
.jobcard.st-complete{border-left-color:var(--green);background:#fbfdfc}
.jobcard.st-cancelled{opacity:.55}
.jobcard .jc-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.jobcard .jc-win{font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.01em}
.jobcard .jc-id{margin-left:auto;font-size:10.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.jobcard .jc-cust{font-weight:600;font-size:13px;margin-bottom:2px}
.jobcard .jc-meta{font-size:11.5px;color:var(--muted);line-height:1.45}
.jobcard .jc-foot{display:flex;align-items:center;gap:6px;margin-top:7px}
.col-empty{text-align:center;color:var(--muted-2);font-size:12px;padding:18px 6px}

/* ---------- Detail drawer ---------- */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.dl{margin-bottom:13px}
.dl dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;margin-bottom:3px}
.dl dd{margin:0;font-size:13.5px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:9px 0 9px 18px;border-left:2px solid var(--line);position:relative;font-size:13px}
.timeline li:before{
  content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;
  background:var(--blue);border:2px solid #fff;
}
.timeline li .ts{font-size:11.5px;color:var(--muted-2);display:block;margin-top:1px}
.status-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar select,.toolbar input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff}
.filter-note{font-size:12.5px;color:var(--muted)}

/* ---------- Toast ---------- */
#toasts{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--navy);color:#fff;padding:11px 15px;border-radius:7px;font-size:13.5px;
  box-shadow:0 6px 20px rgba(10,25,45,.3);animation:slidein .18s ease-out;max-width:330px;
}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Print (dispatch ticket) ---------- */
#print-area{display:none}
@media print{
  #app,.overlay,#toasts,.no-print{display:none!important}
  body{background:#fff}
  #print-area{display:block;padding:0}
  .ticket{page-break-after:always;padding:28px 4px}
  .ticket h1{font-size:20px}
  .ticket .tk-head{border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:16px;display:flex}
  .ticket table{margin-top:10px}
  .ticket .sig,.estdoc .sig{margin-top:44px;border-top:1px solid #000;width:280px;padding-top:5px;font-size:12px}
  .wvdoc{page-break-after:always;padding:28px 4px;font-size:12px;line-height:1.55}
  .wvdoc h1{font-size:18px}
  .wvdoc .wv-head{border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:14px;display:flex}
  .wvdoc .wv-meta{width:100%;border-collapse:collapse;margin-bottom:14px}
  .wvdoc .wv-meta td{padding:3px 4px;border-bottom:1px solid #ddd}
  .wvdoc p{margin:0 0 9px}
  .wvdoc ul{margin:6px 0 0;padding-left:18px}
  .wvdoc li{margin-bottom:5px}
  .wvdoc .wv-sig{margin-top:22px;border-top:2px solid #000;padding-top:12px;display:flex;gap:30px;align-items:flex-end}
  .wvdoc .wv-sig img{max-height:70px;border-bottom:1px solid #000}
  .estdoc{page-break-after:always;padding:28px 4px}
  .estdoc h1{font-size:20px}
  .estdoc .ed-head{border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:16px;display:flex}
  .estdoc table{margin-top:10px;width:100%;border-collapse:collapse}
  .estdoc th,.estdoc td{border-bottom:1px solid #ccc;padding:6px 4px;font-size:12.5px}
  .estdoc .tot{font-weight:700;font-size:15px;border-top:2px solid #000}
  .estdoc .terms{margin-top:24px;font-size:11.5px;color:#333;line-height:1.6}
}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="mark">
        <div class="logo">🔧</div>
        <div>
          <div class="name">Park City<br>Plumbing</div>
        </div>
      </div>
      <div class="sub">Service Dispatch</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div id="storage-note">Local prototype · data on this device</div>
    </div>
  </aside>

  <div id="main">
    <header class="topbar">
      <div>
        <div class="crumb" id="crumb">Dispatch</div>
        <h1 id="page-title">Dashboard</h1>
      </div>
      <div class="spacer"></div>
      <div class="search">
        <span class="si">🔍</span>
        <input id="global-search" type="search" placeholder="Search jobs, customers, phone…" autocomplete="off">
      </div>
      <button class="btn" id="btn-new-estimate">＋ Estimate</button>
      <button class="btn accent" id="btn-new-job">＋ New Job</button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>
<div id="print-area"></div>

<script>
"use strict";
/* ============================================================
   Park City Plumbing — Service Dispatch
   Single-file prototype. All data persists to localStorage.
   ============================================================ */

/* ---------- Constants ---------- */
const STORAGE_KEY = "pcp.dispatch.v1";

const STATUSES = [
  { id:"new",         label:"Unscheduled" },
  { id:"scheduled",   label:"Scheduled" },
  { id:"dispatched",  label:"Dispatched" },
  { id:"in_progress", label:"In Progress" },
  { id:"complete",    label:"Complete" },

/* ---------- Tiny helpers ---------- */
const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function esc(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function uid(prefix){
  return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function todayStr(){
  const d = new Date();
  return ymd(d);
}
function ymd(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseYmd(s){
  const [y,m,d] = String(s || "").split("-").map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m-1, d);
}
function addDays(s, n){
  const d = parseYmd(s) || new Date();
  d.setDate(d.getDate() + n);
  return ymd(d);
}
function fmtDate(s, opts){
  const d = parseYmd(s);
  if (!d) return "—";
  return d.toLocaleDateString(undefined, opts || { weekday:"short", month:"short", day:"numeric" });
}
function fmtDateLong(s){
  return fmtDate(s, { weekday:"long", month:"long", day:"numeric", year:"numeric" });
}
function fmtStamp(ts){
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " · " +
         d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function money(n){
  const v = Number(n) || 0;
  return "$" + v.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
}
function initials(name){
  return String(name||"?").trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();
}
function fmtPhone(p){
  const d = String(p||"").replace(/\D/g,"");
  if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  return p || "";
}
function blankPayment(){
  return { status:"unbilled", amountPaid:0, method:"", ref:"", url:"", invoicedAt:null, paidAt:null };
}
function payBadge(job){
  const st = Store.payState(job);
  const label = st === "partial" ? "Part paid" : PAY_LABEL[st];
  return `<span class="badge pay-${st}"><span class="dot"></span>${esc(label)}</span>`;
}

function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

/* ============================================================
   Store — everything lives in one object, saved to localStorage
   ============================================================ */
const Store = {
  data: null,

  load(){
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); }
    catch(e){ console.warn("localStorage unavailable, running in-memory", e); }

    if (raw){
      try {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.jobs)){
          this.data = parsed;
          this.data.techs     = this.data.techs     || [];
          this.data.customers = this.data.customers || [];
          this.data.counter   = this.data.counter   || 1000;
          // Added with estimates — older saved data won't have these.
          this.data.estimates  = this.data.estimates  || [];
          this.data.priceBook  = this.data.priceBook  || seedPriceBook();
          this.data.counterEst = this.data.counterEst || 2000;
          // Added with waivers.
          this.data.waiverTemplates = this.data.waiverTemplates || seedWaiverTemplates();
          this.data.signedWaivers   = this.data.signedWaivers   || [];
          this.data.counterWaiver   = this.data.counterWaiver   || 5000;
          // Added with payment tracking — older jobs have no payment block.
          this.data.jobs.forEach(j => { if (!j.payment) j.payment = blankPayment(); });
          return;
        }
      } catch(e){ console.warn("Saved data was unreadable; starting fresh.", e); }
    }
    this.data = seedData();
    this.save();
  },

  save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); }
    catch(e){
      // Quota or private-mode failure: keep working in memory, but say so once.
      if (!this._warned){ this._warned = true; toast("Couldn't save to this browser — changes are in memory only.", "err"); }
    }
  },

  reset(){
    this.data = seedData();
    this.save();
  },

  nextJobNo(){
    this.data.counter = (this.data.counter || 1000) + 1;
    return this.data.counter;
  },

  nextEstNo(){
    this.data.counterEst = (this.data.counterEst || 2000) + 1;
    return this.data.counterEst;
  },

  /* --- lookups --- */
  tech(id){ return this.data.techs.find(t => t.id === id) || null; },
  customer(id){ return this.data.customers.find(c => c.id === id) || null; },
  job(id){ return this.data.jobs.find(j => j.id === id) || null; },
  activeTechs(){ return this.data.techs.filter(t => t.active); },
  jobsForCustomer(cid){
    return this.data.jobs.filter(j => j.customerId === cid)
      .sort((a,b) => (b.scheduledDate||"").localeCompare(a.scheduledDate||""));
  },
  estimate(id){ return this.data.estimates.find(e => e.id === id) || null; },
  estimatesForCustomer(cid){
    return this.data.estimates.filter(e => e.customerId === cid)
      .sort((a,b) => b.createdAt - a.createdAt);
  },
  openEstimates(){ return this.data.estimates.filter(e => e.status === "draft" || e.status === "sent"); },

  /* An estimate is quoted either to a saved customer or to a loose contact
     ("lead") that only becomes a customer if the work is approved. */
  estContact(e){
    const c = e.customerId ? this.customer(e.customerId) : null;
    return c || e.lead || { name:"(no contact)", phone:"", email:"", address:"", city:"" };
  },
  estimateTotal(e){
    return (e.items || []).reduce((s,i) => s + (Number(i.qty)||0) * (Number(i.price)||0), 0);
  },

  addEstLog(e, text){
    e.log = e.log || [];
    e.log.push({ ts: Date.now(), text });
  },

  setEstStatus(e, status){
    if (e.status === status) return;
    const from = EST_STATUS_LABEL[e.status] || e.status;
    e.status = status;
    if (status === "sent" && !e.sentAt) e.sentAt = Date.now();
    if (status === "approved" || status === "declined") e.decidedAt = Date.now();
    this.addEstLog(e, `Status: ${from} → ${EST_STATUS_LABEL[status]}`);
    this.save();
  },

  /* Approved work becomes a real job. Line items and the agreed price carry
     over, so the board shows what was quoted, not a blank job. */
  convertEstimate(e, opts){
    const total = this.estimateTotal(e);
    const job = {
      id: uid("job"), no: this.nextJobNo(), createdAt: Date.now(),
      customerId: opts.customerId,
      type: e.type, priority: opts.priority || "Normal",
      description: e.description,
      scheduledDate: opts.scheduledDate || null,
      window: opts.window || "Anytime",
      techId: null, status: "new", completedAt: null,
      laborHours: 0, laborRate: this.data.settings.laborRate,
      payment: blankPayment(),
      parts: (e.items || []).map(i => ({ desc: i.desc, qty: i.qty, price: i.price })),
      estimateId: e.id, quotedTotal: total,
      log: [{ ts: Date.now(), text: `Created from estimate EST-${e.no} · quoted ${money(total)}` }]
    };
    this.data.jobs.push(job);
    if (opts.techId) this.assign(job, opts.techId);
    else if (job.scheduledDate){ job.status = "scheduled"; this.addLog(job, "Scheduled, awaiting a technician"); }

    e.customerId = opts.customerId;
    e.lead = null;
    e.jobId = job.id;
    if (e.status !== "approved"){
      e.status = "approved";
      e.decidedAt = Date.now();
    }
    this.addEstLog(e, `Approved and converted to job #${job.no}`);
    this.save();
    return job;
  },

  deleteEstimate(id){
    this.data.estimates = this.data.estimates.filter(e => e.id !== id);
    this.save();
  },

  /* Payment tracking. Deliberately manual: Stripe (or whoever) stays the system
     of record, this just indexes it so the office can see what's outstanding. */
  balance(job){
    return Math.max(0, this.jobTotal(job) - (Number(job.payment && job.payment.amountPaid) || 0));
  },
  payState(job){
    const pay = job.payment || blankPayment();
    if (pay.status === "paid") return "paid";
    if (pay.status === "invoiced" && (Number(pay.amountPaid) || 0) > 0) return "partial";
    return pay.status;
  },
  /* Finished work nobody has billed yet. */
  toInvoice(){
    return this.data.jobs.filter(j => j.status === "complete" &&
      (!j.payment || j.payment.status === "unbilled"));
  },
  /* Billed and still waiting on the money. */
  outstanding(){
    return this.data.jobs.filter(j => j.payment && j.payment.status === "invoiced");
  },
  setPayment(job, fields){
    const prev = job.payment ? job.payment.status : "unbilled";
    job.payment = Object.assign(blankPayment(), job.payment, fields);
    if (job.payment.status === "invoiced" && !job.payment.invoicedAt) job.payment.invoicedAt = Date.now();
    if (job.payment.status === "paid"){
      if (!job.payment.paidAt) job.payment.paidAt = Date.now();
      // Marking paid with no figure entered means paid in full.
      if (!(Number(job.payment.amountPaid) > 0)) job.payment.amountPaid = this.jobTotal(job);
    }
    if (job.payment.status === "unbilled"){ job.payment.invoicedAt = null; job.payment.paidAt = null; }
    if (prev !== job.payment.status){
      this.addLog(job, `Payment: ${PAY_LABEL[prev]} → ${PAY_LABEL[job.payment.status]}`);
    }
    this.save();
  },

  /* Waivers — templates, and the frozen record of what someone actually signed. */
  nextWaiverNo(){
    this.data.counterWaiver = (this.data.counterWaiver || 5000) + 1;
    return this.data.counterWaiver;
  },
  waiverTemplate(id){ return this.data.waiverTemplates.find(w => w.id === id) || null; },
  templateByKey(key){ return this.data.waiverTemplates.find(w => w.key === key && !w.archived) || null; },
  activeTemplates(){ return this.data.waiverTemplates.filter(w => !w.archived); },
  signedWaiver(id){ return this.data.signedWaivers.find(w => w.id === id) || null; },
  signedForJob(jobId){ return this.data.signedWaivers.filter(w => w.jobId === jobId); },
  signedForCustomer(cid){
    return this.data.signedWaivers.filter(w => w.customerId === cid)
      .sort((a,b) => b.signedAt - a.signedAt);
  },

  /* Values a waiver body can merge in. */
  waiverContext(job){
    const st = this.data.settings;
    const c = job ? this.customer(job.customerId) : null;
    return {
      company: st.company,
      company_phone: st.phone,
      customer_name: c ? c.name : "",
      service_address: c ? [c.address, c.city].filter(Boolean).join(", ") : "",
      job_number: job ? "#" + job.no : "",
      job_type: job ? job.type : "",
      job_description: job ? job.description : "",
      tech_name: job && job.techId ? (this.tech(job.techId) || {}).name || "" : "",
      date: fmtDateLong(todayStr())
    };
  },
  applyMerge(text, ctx){
    return String(text || "").replace(/\{\{(\w+)\}\}/g, (m, k) =>
      ctx[k] != null && ctx[k] !== "" ? ctx[k] : m);
  },

  /* Which templates this job would normally want, and which are still missing. */
  recommendedFor(job){
    const keys = JOB_TYPE_WAIVERS[job.type] || [];
    return keys.map(k => this.templateByKey(k)).filter(Boolean);
  },
  missingFor(job){
    const have = new Set(this.signedForJob(job.id).map(w => w.templateKey));
    return this.recommendedFor(job).filter(t => !have.has(t.key));
  },

  /* A signed waiver freezes its own text — editing the template later must
     never change what someone already put their name to. */
  signWaiver(tpl, opts){
    const ctx = this.waiverContext(opts.job);
    const rec = {
      id: uid("sw"), no: this.nextWaiverNo(),
      templateId: tpl.id, templateKey: tpl.key || null, title: tpl.title,
      category: tpl.category,
      jobId: opts.job ? opts.job.id : null,
      customerId: opts.job ? opts.job.customerId : (opts.customerId || null),
      body: tpl.body.map(pp => this.applyMerge(pp, ctx)),
      acks: tpl.acks.map(a => this.applyMerge(a, ctx)),
      fillIns: opts.fillIns || "",
      signerName: opts.signerName,
      signerRole: opts.signerRole,
      signature: opts.signature || null,
      techId: opts.job ? opts.job.techId : null,
      contextSnapshot: ctx,
      signedAt: Date.now()
    };
    this.data.signedWaivers.push(rec);
    if (opts.job){
      this.addLog(opts.job, `Waiver signed: ${tpl.title} (by ${opts.signerName})`);
    }
    this.save();
    return rec;
  },
  deleteSignedWaiver(id){
    this.data.signedWaivers = this.data.signedWaivers.filter(w => w.id !== id);
    this.save();
  },

  /* Price book — the reusable list estimates are built from. */
  addPriceItem(item){
    const it = Object.assign({ id: uid("pb") }, item);
    this.data.priceBook.push(it);
    this.save();
    return it;
  },
  priceItem(id){ return this.data.priceBook.find(i => i.id === id) || null; },
  deletePriceItem(id){
    this.data.priceBook = this.data.priceBook.filter(i => i.id !== id);
    this.save();
  },

  /* --- mutations --- */
  addLog(job, text){
    job.log = job.log || [];
    job.log.push({ ts: Date.now(), text });
  },

  setStatus(job, status){
    if (job.status === status) return;
    const from = STATUS_LABEL[job.status] || job.status;
    job.status = status;
    if (status === "complete" && !job.completedAt) job.completedAt = Date.now();
    if (status !== "complete") job.completedAt = null;
    this.addLog(job, `Status: ${from} → ${STATUS_LABEL[status]}`);
    this.save();
  },

  assign(job, techId){
    const prev = job.techId;
    if (prev === techId) return;
    job.techId = techId || null;
    const name = techId ? (this.tech(techId)?.name || "Unknown") : null;
    this.addLog(job, name ? `Assigned to ${name}` : "Unassigned");
    // Assigning a brand-new job is what actually schedules it.
    if (techId && job.status === "new" && job.scheduledDate) job.status = "scheduled";
    if (!techId && job.status === "scheduled") job.status = "new";
    this.save();
  },

  deleteJob(id){
    this.data.jobs = this.data.jobs.filter(j => j.id !== id);
    this.save();
  },

  jobTotal(job){
    const parts = (job.parts || []).reduce((s,p) => s + (Number(p.qty)||0) * (Number(p.price)||0), 0);
    const labor = (Number(job.laborHours)||0) * (Number(job.laborRate)|| this.data.settings.laborRate || 0);
    return parts + labor;
  }
};

function render(){
  renderNav();

  $("#page-title").textContent = v.label;

    switch(App.view){
      case "schedule":  host.innerHTML = viewSchedule();  break;
      case "estimates": host.innerHTML = viewEstimates(); break;
      case "waivers":   host.innerHTML = viewWaivers();   break;
      case "pricebook": host.innerHTML = viewPriceBook(); break;
      case "jobs":      host.innerHTML = viewJobs();      break;
      case "customers": host.innerHTML = viewCustomers(); break;
      case "techs":     host.innerHTML = viewTechs();     break;
      case "data":      host.innerHTML = viewData();      break;
      default:          host.innerHTML = viewDashboard();
    }

function renderNav(){
  const jobs = Store.data.jobs;
  const t = todayStr();
  const counts = {
    schedule: jobs.filter(j => j.scheduledDate === t && j.status !== "cancelled").length,
    estimates: Store.openEstimates().length,
    jobs: jobs.filter(j => !["complete","cancelled"].includes(j.status)).length,
    customers: Store.data.customers.length,
    waivers: Store.data.signedWaivers.length,

    pricebook: Store.data.priceBook.length
  };

function wireBoard(){
  let draggedId = null;

  $$(".jobcard").forEach(card => {
    card.addEventListener("dragstart", e => {
      draggedId = card.dataset.job;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      // Some browsers need data set for the drag to start at all.
      try { e.dataTransfer.setData("text/plain", draggedId); } catch(_){}
    });
    card.addEventListener("dragend", () => {
      draggedId = null;
      card.classList.remove("dragging");
      $$(".col").forEach(c => c.classList.remove("dragover"));
    });
  });

  $$(".col").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect="move"; col.classList.add("dragover"); });
    col.addEventListener("dragleave", () => col.classList.remove("dragover"));
    col.addEventListener("drop", e => {
      e.preventDefault();
      col.classList.remove("dragover");
      const id = draggedId || (e.dataTransfer && e.dataTransfer.getData("text/plain"));
      const job = id && Store.job(id);
      if (!job) return;
      const techId = col.dataset.col || null;
      if ((job.techId||"") === (techId||"")) return;
      Store.assign(job, techId);
      render();
      toast(techId ? `#${job.no} → ${Store.tech(techId).name}` : `#${job.no} moved to Unassigned`, "ok");
    });
  });
}

   ============================================================ */
function viewJobs(){
  const f = App.filters;
  const t = todayStr();
  let list = Store.data.jobs.slice();

  if (f.when === "today")    list = list.filter(j => j.scheduledDate === t);
  if (f.when === "upcoming") list = list.filter(j => isOpen(j));
  if (f.when === "past")     list = list.filter(j => !isOpen(j));
  if (f.when === "tobill")   list = Store.toInvoice();
  if (f.when === "unpaid")   list = Store.outstanding();
  if (f.status) list = list.filter(j => j.status === f.status);
  if (f.techId) list = list.filter(j => (j.techId||"") === (f.techId === "none" ? "" : f.techId));
  if (f.type)   list = list.filter(j => j.type === f.type);

  list.sort((a,b) => {
    const A = a.scheduledDate || "9999-99-99", B = b.scheduledDate || "9999-99-99";
    if (A !== B) return f.when === "past" ? B.localeCompare(A) : A.localeCompare(B);
    return WINDOWS.indexOf(a.window) - WINDOWS.indexOf(b.window);
  });

  const opt = (v,label,cur) => `<option value="${esc(v)}"${cur===v?" selected":""}>${esc(label)}</option>`;

  return `
  <div class="toolbar">
    <select id="f-when">
      ${opt("upcoming","Open jobs",f.when)}${opt("today","Today only",f.when)}
      ${opt("past","Closed jobs",f.when)}${opt("all","All jobs",f.when)}
      ${opt("tobill","Ready to invoice",f.when)}${opt("unpaid","Awaiting payment",f.when)}
    </select>
    <select id="f-status">${opt("","Any status",f.status)}${STATUSES.map(s=>opt(s.id,s.label,f.status)).join("")}</select>
    <select id="f-tech">${opt("","Any technician",f.techId)}${opt("none","— Unassigned —",f.techId)}${Store.data.techs.map(x=>opt(x.id,x.name,f.techId)).join("")}</select>
    <select id="f-type">${opt("","Any job type",f.type)}${JOB_TYPES.map(x=>opt(x,x,f.type)).join("")}</select>
    <button class="btn sm ghost" data-action="clear-filters">Clear</button>
    <div style="flex:1"></div>
    <span class="filter-note">${list.length} job${list.length===1?"":"s"}${
      (f.when==="tobill"||f.when==="unpaid")
        ? ` · ${esc(money(list.reduce((sum,j) => sum + (f.when==="unpaid"?Store.balance(j):Store.jobTotal(j)), 0)))}`
        : ""}</span>
    <button class="btn sm accent" data-action="new-job">＋ New Job</button>
  </div>

  const q = App.search.trim().toLowerCase();
  const digits = q.replace(/\D/g,"");
  const custHit = c =>
    c.name.toLowerCase().includes(q) ||
    (c.address||"").toLowerCase().includes(q) ||
    (c.email||"").toLowerCase().includes(q) ||
    (digits.length >= 3 && String(c.phone||"").replace(/\D/g,"").includes(digits));

  const customers = Store.data.customers.filter(custHit);
  const custIds = new Set(customers.map(c => c.id));
  const jobs = Store.data.jobs.filter(j =>
    custIds.has(j.customerId) ||
    String(j.no).includes(q.replace("#","")) ||
    (j.type||"").toLowerCase().includes(q) ||

  ).sort((a,b) => (b.scheduledDate||"").localeCompare(a.scheduledDate||""));

  return `

/* ============================================================
   Modals
   ============================================================ */
function openModal(html, opts){
  opts = opts || {};
  const root = $("#modal-root");
  root.innerHTML = `<div class="overlay" data-overlay>
    <div class="modal ${opts.wide?"wide":""}" role="dialog" aria-modal="true">${html}</div>
  </div>`;
  const overlay = $("[data-overlay]", root);
  overlay.addEventListener("mousedown", e => { if (e.target === overlay) closeModal(); });
  const first = $(".modal input:not([type=hidden]), .modal select, .modal textarea", root);
  if (first && !opts.noFocus) setTimeout(() => first.focus(), 30);
  document.body.style.overflow = "hidden";
}
function closeModal(){
  $("#modal-root").innerHTML = "";
  document.body.style.overflow = "";
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modal-root").innerHTML) closeModal();
});

function saveJobFromForm(id){
  const custVal = $("#f-customer").value;
  const desc = $("#f-desc").value.trim();
  let ok = true;

  $("#e-customer").style.display = "none";
  $("#e-desc").style.display = "none";

  let customerId = custVal;
  if (custVal === "__new"){
    const name = $("#nc-name").value.trim();
    if (!name){ $("#nc-name").classList.add("invalid"); ok = false; }
    else {
      const c = {
        id: uid("cus"), name,
        phone: $("#nc-phone").value.trim(),
        email: "",
        address: $("#nc-address").value.trim(),
        city: $("#nc-city").value.trim() || "Park City",
        notes: "", createdAt: Date.now()
      };
      Store.data.customers.push(c);
      customerId = c.id;
    }
  } else if (!custVal){
    $("#e-customer").style.display = "block"; ok = false;
  }
  if (!desc){ $("#e-desc").style.display = "block"; ok = false; }
  if (!ok) return;

  const fields = {
    customerId,
    type: $("#f-type").value,
    priority: $("#f-priority").value,
    scheduledDate: $("#f-date").value || null,
    window: $("#f-window").value,
    description: desc
  };
  const techId = $("#f-tech").value || null;

  if (id){
    const j = Store.job(id);
    Object.assign(j, fields);
    if ((j.techId||"") !== (techId||"")) Store.assign(j, techId);
    Store.addLog(j, "Job details updated");
    Store.save();
    closeModal(); render(); openJob(j.id);
    toast("Job updated", "ok");
  } else {
    const j = Object.assign({
      id: uid("job"), no: Store.nextJobNo(), createdAt: Date.now(),
      status: "new", techId: null, completedAt: null,
      laborHours: 0, laborRate: Store.data.settings.laborRate,
      parts: [], payment: blankPayment(), log: [{ ts: Date.now(), text: "Job created" }]
    }, fields);
    Store.data.jobs.push(j);
    if (techId) Store.assign(j, techId);
    else if (j.scheduledDate) { j.status = "scheduled"; Store.addLog(j, "Scheduled, awaiting a technician"); }
    Store.save();
    closeModal(); render();
    toast(`Job #${j.no} created`, "ok");
  }
}

/* ---------- Signature pad ---------- */
let SigPad = null;
function initSigPad(){
  const cv = $("#sigpad");
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  cv.width  = Math.max(1, Math.round(rect.width  * dpr));
  cv.height = Math.max(1, Math.round(rect.height * dpr));
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#16222e";

  SigPad = {
    cv, ctx, dpr, drawing:false, dirty:false,
    cssW: rect.width, cssH: rect.height,
    bounds: { minX:Infinity, minY:Infinity, maxX:-Infinity, maxY:-Infinity }
  };

  const pos = ev => {
    const r = cv.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  };
  const mark = pt => {
    const b = SigPad.bounds;
    if (pt.x < b.minX) b.minX = pt.x;
    if (pt.y < b.minY) b.minY = pt.y;
    if (pt.x > b.maxX) b.maxX = pt.x;
    if (pt.y > b.maxY) b.maxY = pt.y;
  };
  const start = ev => {
    ev.preventDefault();
    SigPad.drawing = true;
    const pt = pos(ev);
    mark(pt);
    ctx.beginPath(); ctx.moveTo(pt.x, pt.y);
    try { cv.setPointerCapture(ev.pointerId); } catch(_){}
  };
  const move = ev => {
    if (!SigPad.drawing) return;
    ev.preventDefault();
    const pt = pos(ev);
    mark(pt);
    ctx.lineTo(pt.x, pt.y); ctx.stroke();
    if (!SigPad.dirty){
      SigPad.dirty = true;
      $("#sigwrap").classList.add("filled");
      const err = $("#wv-sig-err");
      if (err) err.style.display = "none";
    }
  };
  const end = () => { SigPad.drawing = false; };

  cv.addEventListener("pointerdown", start);
  cv.addEventListener("pointermove", move);
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);
  cv.addEventListener("pointerleave", end);
}
function clearSigPad(){
  if (!SigPad) return;
  SigPad.ctx.clearRect(0, 0, SigPad.cv.width, SigPad.cv.height);
  SigPad.dirty = false;
  SigPad.bounds = { minX:Infinity, minY:Infinity, maxX:-Infinity, maxY:-Infinity };
  $("#sigwrap").classList.remove("filled");
}

/* Export just the inked area. Storing the whole blank canvas costs ~50KB a
   signature, which fills the browser's storage after a couple of months of
   work; cropped to the ink it is a fraction of that. */
function exportSignature(){
  if (!SigPad || !SigPad.dirty) return null;
  const { cv, dpr, bounds: b, cssW, cssH } = SigPad;
  const pad = 8;
  const x = Math.max(0, b.minX - pad);
  const y = Math.max(0, b.minY - pad);
  const w = Math.min(cssW - x, (b.maxX - b.minX) + pad * 2);
  const h = Math.min(cssH - y, (b.maxY - b.minY) + pad * 2);
  if (!(w > 0 && h > 0)) return cv.toDataURL("image/png");

  // Enough resolution to stay crisp in print, capped so the file stays small.
  const scale = Math.min(dpr, 2, 900 / w);
  const out = document.createElement("canvas");
  out.width  = Math.max(1, Math.round(w * scale));
  out.height = Math.max(1, Math.round(h * scale));
  const octx = out.getContext("2d");
  octx.drawImage(cv, x * dpr, y * dpr, w * dpr, h * dpr, 0, 0, out.width, out.height);
  return out.toDataURL("image/png");
}

      e.type, c.name, fmtPhone(c.phone), [c.address,c.city].filter(Boolean).join(", "),

      Store.estimateTotal(e).toFixed(2), job ? "#" + job.no : "",
      (e.description||"").replace(/\s+/g," ")
    ];
  });
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  download(`pcp-estimates-${todayStr()}.csv`, [head, ...rows].map(r => r.map(q).join(",")).join("\r\n"), "text/csv");
}

  const head = ["Ref","Waiver","Category","Signed by","Signing as","Customer","Service address","Job","Signed at","Filled in"];
  const rows = Store.data.signedWaivers.map(w => {
    const job = w.jobId ? Store.job(w.jobId) : null;
    return ["W-"+w.no, w.title, w.category, w.signerName, w.signerRole||"",
            w.contextSnapshot.customer_name||"", w.contextSnapshot.service_address||"",
            job?"#"+job.no:"", new Date(w.signedAt).toISOString(), (w.fillIns||"").replace(/\s+/g," ")];
  });
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  download(`pcp-waivers-${todayStr()}.csv`, [head, ...rows].map(r => r.map(q).join(",")).join("\r\n"), "text/csv");
}

function printJobs(list, label){
  if (!list.length){ toast("Nothing to print for " + label, "err"); return; }
  $("#print-area").innerHTML = list.map(ticketHtml).join("");
  window.print();
}

/* ============================================================
   Import / export
   ============================================================ */
function download(filename, text, mime){
  const blob = new Blob([text], { type: mime || "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function exportJson(){
  download(`pcp-dispatch-${todayStr()}.json`, JSON.stringify(Store.data, null, 2));
  toast("Backup downloaded", "ok");
}

function exportCsv(){
  const head = ["Job","Date","Window","Status","Priority","Type","Customer","Phone","Address","Technician","Labor hrs","Total","Payment","Received","Balance","Method","Invoice ref","Description"];
  const rows = Store.data.jobs.map(j => {
    const c = Store.customer(j.customerId);
    return [
      j.no, j.scheduledDate||"", j.window||"", STATUS_LABEL[j.status]||j.status, j.priority, j.type,
      c?c.name:"", c?fmtPhone(c.phone):"", custAddr(j.customerId),
      Store.tech(j.techId)?.name || "", j.laborHours||0,
      (Store.jobTotal(j)).toFixed(2),
      PAY_LABEL[(j.payment||blankPayment()).status],
      (Number((j.payment||{}).amountPaid)||0).toFixed(2),
      Store.balance(j).toFixed(2),
      (j.payment||{}).method || "", (j.payment||{}).ref || "",
      (j.description||"").replace(/\s+/g," ")
    ];
  });
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  const csv = [head, ...rows].map(r => r.map(q).join(",")).join("\r\n");
  download(`pcp-jobs-${todayStr()}.csv`, csv, "text/csv");
  toast("Jobs exported", "ok");
}

function importJson(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.jobs)) throw new Error("Not a dispatch backup");
      if (!confirm(`Replace everything in this browser with the backup?\n\n${parsed.jobs.length} jobs · ${(parsed.customers||[]).length} customers`)) return;
      Store.data = parsed;
      Store.data.techs     = Store.data.techs     || [];
      Store.data.customers = Store.data.customers || [];
      Store.data.settings  = Store.data.settings  || { company:"Park City Plumbing", laborRate:145, phone:"" };
      Store.save(); render();
      toast("Backup restored", "ok");
    } catch(e){
      toast("That file isn't a dispatch backup.", "err");
    }
  };
  reader.readAsText(file);
}

/* ============================================================
   Event wiring
   ============================================================ */
document.addEventListener("click", e => {
  const hit = sel => e.target.closest(sel);

  if (hit("[data-close]")) return closeModal();

  /* --- navigation --- */
  const nav = hit("[data-nav]");
  if (nav){ App.search = ""; $("#global-search").value = ""; return go(nav.dataset.nav); }

  /* --- date navigation --- */
  const dn = hit("[data-date]");
  if (dn){
    const k = dn.dataset.date;
    App.date = k === "today" ? todayStr() : addDays(App.date, k === "next" ? 1 : -1);
    return render();
  }

  /* --- job detail actions (checked before the generic row handler) --- */
  const adv = hit("[data-advance]");
  if (adv){
    const j = Store.job(adv.dataset.advance);
    const n = NEXT_STATUS[j.status];
    if (n){ Store.setStatus(j, n); render(); openJob(j.id); toast(`#${j.no} → ${STATUS_LABEL[n]}`, "ok"); }
    return;
  }
  const editJob = hit("[data-edit-job]");
  if (editJob) return openJobForm(editJob.dataset.editJob);

  const printJob = hit("[data-print-job]");
  if (printJob) return printJobs([Store.job(printJob.dataset.printJob)], "this job");

  const addPart = hit("[data-add-part]");
  if (addPart){
    const j = Store.job(addPart.dataset.addPart);
    const desc = $("#part-desc").value.trim();
    if (!desc){ $("#part-desc").focus(); return; }
    j.parts = j.parts || [];
    j.parts.push({ desc, qty: Number($("#part-qty").value) || 1, price: Number($("#part-price").value) || 0 });
    Store.addLog(j, `Part added: ${desc}`);
    Store.save(); openJob(j.id);
    return;
  }
  const delPart = hit("[data-del-part]");
  if (delPart){
    const [jid, idx] = delPart.dataset.delPart.split(":");
    const j = Store.job(jid);
    j.parts.splice(Number(idx), 1);
    Store.save(); openJob(jid);
    return;
  }
  const savePay = hit("[data-save-pay]");
  if (savePay){
    const j = Store.job(savePay.dataset.savePay);
    Store.setPayment(j, {
      status: $("#pay-status").value,
      amountPaid: Number($("#pay-amount").value) || 0,
      method: $("#pay-method").value,
      ref: $("#pay-ref").value.trim(),
      url: $("#pay-url").value.trim()
    });
    render(); openJob(j.id);
    toast("Payment updated", "ok");
    return;
  }
  const money$ = hit("[data-money]");
  if (money$){
    App.filters = { status:"", techId:"", type:"", when: money$.dataset.money };
    return go("jobs");
  }
  const saveExt = hit("[data-save-ext]");
  if (saveExt){
    const w = Store.signedWaiver(saveExt.dataset.saveExt);
    w.externalUrl = $("#wv-ext").value.trim();
    Store.save(); openSignedWaiver(w.id);
    toast(w.externalUrl ? "External copy linked" : "Link cleared", "ok");
    return;
  }

  const saveLabor = hit("[data-save-labor]");
  if (saveLabor){
    const j = Store.job(saveLabor.dataset.saveLabor);
    j.laborHours = Number($("#labor-hours").value) || 0;
    Store.save(); openJob(j.id); toast("Labor saved", "ok");
    return;
  }
  const addNote = hit("[data-add-note]");
  if (addNote){
    const j = Store.job(addNote.dataset.addNote);
    const text = $("#note-text").value.trim();
    if (!text) return;
    Store.addLog(j, text); Store.save(); openJob(j.id);
    return;
  }
  const delJob = hit("[data-del-job]");
  if (delJob){
    const j = Store.job(delJob.dataset.delJob);
    if (!confirm(`Delete job #${j.no} for ${custName(j.customerId)}?\n\nThis cannot be undone.`)) return;
    Store.deleteJob(j.id); closeModal(); render(); toast("Job deleted");
    return;
  }

  /* --- estimate actions --- */
  const estF = hit("[data-est-filter]");
  if (estF){ App.estFilter = estF.dataset.estFilter; return render(); }

  const conv = hit("[data-convert]");
  if (conv) return openConvert(conv.dataset.convert);

  const doConv = hit("[data-do-convert]");
  if (doConv) return doConvert(doConv.dataset.doConvert);

  const estSt = hit("[data-est-status]");
  if (estSt){
    const [eid, st] = estSt.dataset.estStatus.split(":");
    const e = Store.estimate(eid);
    Store.setEstStatus(e, st);
    render(); openEstimate(eid);
    toast(`EST-${e.no} → ${EST_STATUS_LABEL[st]}`, "ok");
    return;
  }
  const editEst = hit("[data-edit-estimate]");
  if (editEst) return openEstimateForm(editEst.dataset.editEstimate);

  const printEst = hit("[data-print-estimate]");
  if (printEst) return printEstimate(Store.estimate(printEst.dataset.printEstimate));

  const addLine = hit("[data-add-line]");
  if (addLine){
    const e = Store.estimate(addLine.dataset.addLine);
    const desc = $("#line-desc").value.trim();
    if (!desc){ $("#line-desc").classList.add("invalid"); $("#line-desc").focus(); return; }
    const item = {
      desc,
      kind:  $("#line-kind").value,
      qty:   Number($("#line-qty").value) || 1,
      price: Number($("#line-price").value) || 0
    };
    e.items = e.items || [];
    e.items.push(item);
    Store.addEstLog(e, `Line added: ${desc}`);
    if ($("#line-save").checked){
      Store.addPriceItem({ desc: item.desc, price: item.price, kind: item.kind });
      toast("Added to the price book too", "ok");
    }
    Store.save(); openEstimate(e.id);
    return;
  }
  const delLine = hit("[data-del-line]");
  if (delLine){
    const [eid, idx] = delLine.dataset.delLine.split(":");
    const e = Store.estimate(eid);
    e.items.splice(Number(idx), 1);
    Store.save(); openEstimate(eid);
    return;
  }
  const estNote = hit("[data-est-note]");
  if (estNote){
    const e = Store.estimate(estNote.dataset.estNote);
    const text = $("#est-note").value.trim();
    if (!text) return;
    Store.addEstLog(e, text); Store.save(); openEstimate(e.id);
    return;
  }
  const delEst = hit("[data-del-estimate]");
  if (delEst){
    const e = Store.estimate(delEst.dataset.delEstimate);
    if (!confirm(`Delete estimate EST-${e.no} for ${Store.estContact(e).name}?\n\nThis cannot be undone.`)) return;
    Store.deleteEstimate(e.id); closeModal(); render(); toast("Estimate deleted");
    return;
  }

  /* --- waivers --- */
  const wvTab = hit("[data-waiver-tab]");
  if (wvTab){ App.waiverTab = wvTab.dataset.waiverTab; return render(); }

  const addWv = hit("[data-add-waiver]");
  if (addWv) return openWaiverPicker(addWv.dataset.addWaiver);

  const prevT = hit("[data-preview-template]");
  if (prevT) return previewTemplate(prevT.dataset.previewTemplate);

  const pickGo = hit("[data-pick-template-go]");
  if (pickGo) return openWaiverSign(pickGo.dataset.pickTemplateGo, null);

  const editT = hit("[data-edit-template]");
  if (editT) return openTemplateForm(editT.dataset.editTemplate);

  const archT = hit("[data-archive-template]");
  if (archT){
    const t = Store.waiverTemplate(archT.dataset.archiveTemplate);
    if (!confirm(`Delete the template "${t.title}"?\n\nWaivers already signed from it are kept.`)) return;
    t.archived = true; Store.save(); closeModal(); render(); toast("Template deleted");
    return;
  }
  const saveT = hit("[data-save-template]");
  if (saveT) return saveTemplateFromForm(saveT.dataset.saveTemplate || null);

  if (hit("[data-clear-sig]")) return clearSigPad();

  const signWv = hit("[data-sign-waiver]");
  if (signWv) return saveWaiverSignature(signWv.dataset.signWaiver);

  const printWv = hit("[data-print-waiver]");
  if (printWv) return printWaiver(Store.signedWaiver(printWv.dataset.printWaiver));

  const delSigned = hit("[data-del-signed]");
  if (delSigned){
    const w = Store.signedWaiver(delSigned.dataset.delSigned);
    if (!confirm(`Delete the signed record W-${w.no}?\n\nThis removes proof that ${w.signerName} signed. It cannot be undone.`)) return;
    Store.deleteSignedWaiver(w.id); closeModal(); render(); toast("Signed record deleted");
    return;
  }
  const signedEl = hit("[data-signed]");
  if (signedEl) return openSignedWaiver(signedEl.dataset.signed);

  /* --- price book --- */
  const editPrice = hit("[data-edit-price]");
  if (editPrice) return openPriceForm(editPrice.dataset.editPrice);
  const delPrice = hit("[data-del-price]");
  if (delPrice){
    const i = Store.priceItem(delPrice.dataset.delPrice);
    if (!confirm(`Remove "${i.desc}" from the price book?\n\nEstimates already using it keep their line.`)) return;
    Store.deletePriceItem(i.id); render(); toast("Removed from price book");
    return;
  }

  /* --- form saves --- */
  const sj = hit("[data-save-job]");      if (sj) return saveJobFromForm(sj.dataset.saveJob || null);
  const sc = hit("[data-save-customer]"); if (sc) return saveCustomerFromForm(sc.dataset.saveCustomer || null);
  const st = hit("[data-save-tech]");     if (st) return saveTechFromForm(st.dataset.saveTech || null);
  const se = hit("[data-save-estimate]"); if (se) return saveEstimateFromForm(se.dataset.saveEstimate || null);
  const sp = hit("[data-save-price]");    if (sp) return savePriceFromForm(sp.dataset.savePrice || null);

  /* --- customers / techs --- */
  const ec = hit("[data-edit-customer]"); if (ec) return openCustomerForm(ec.dataset.editCustomer);
  const et = hit("[data-edit-tech]");     if (et) return openTechForm(et.dataset.editTech);
  const tt = hit("[data-toggle-tech]");
  if (tt){
    const t = Store.tech(tt.dataset.toggleTech);
    const open = Store.data.jobs.filter(j => j.techId === t.id && isOpen(j)).length;
    if (t.active && open && !confirm(`${t.name} still has ${open} open job${open===1?"":"s"}.\n\nDeactivate anyway? Their jobs stay assigned but the column leaves the board.`)) return;
    t.active = !t.active; Store.save(); render();
    return;
  }
  const nef = hit("[data-new-est-for]");
  if (nef){
    const cid = nef.dataset.newEstFor;
    openEstimateForm(null);
    $("[data-who='existing']").click();
    $("#e-customer").value = cid;
    return;
  }
  const njf = hit("[data-new-job-for]");
  if (njf){
    const cid = njf.dataset.newJobFor;
    openJobForm(null);
    $("#f-customer").value = cid;
    return;
  }

  /* --- generic row / card open (last) --- */
  const estEl = hit("[data-estimate]"); if (estEl) return openEstimate(estEl.dataset.estimate);
  const jobEl = hit("[data-job]");   if (jobEl) return openJob(jobEl.dataset.job);
  const cusEl = hit("[data-customer]"); if (cusEl) return openCustomer(cusEl.dataset.customer);

  /* --- toolbar actions --- */
  const act = hit("[data-action]");
  if (!act) return;
  switch(act.dataset.action){
    case "new-job":      openJobForm(null); break;
    case "new-estimate": openEstimateForm(null); break;
    case "new-price":    openPriceForm(null); break;
    case "export-est-csv": exportEstimatesCsv(); break;
    case "new-template":  openTemplateForm(null); break;
    case "export-waivers": exportWaiversCsv(); break;
    case "new-customer": openCustomerForm(null); break;
    case "new-tech":     openTechForm(null); break;
    case "clear-filters":
      App.filters = { status:"", techId:"", type:"", when:"upcoming" }; render(); break;
    case "clear-search":
      App.search = ""; $("#global-search").value = ""; render(); break;
    case "print-day":
      printJobs(Store.data.jobs.filter(j => j.scheduledDate === todayStr() && isOpen(j)), "today"); break;
    case "print-board":
      printJobs(Store.data.jobs.filter(j => j.scheduledDate === App.date && isOpen(j)), "this day"); break;
    case "export":     exportJson(); break;
    case "export-csv": exportCsv(); break;
    case "import":     $("#import-file").click(); break;
    case "save-settings": {
      const s = Store.data.settings;
      s.company = $("#set-company").value.trim() || "Park City Plumbing";
      s.phone   = $("#set-phone").value.trim();
      s.laborRate = Number($("#set-rate").value) || 0;
      Store.save(); render(); toast("Settings saved", "ok");
      break;
    }
    case "reset":
      if (confirm("Wipe all data in this browser and reload the sample day?")){
        Store.reset(); App.date = todayStr(); render(); toast("Reset to sample data");
      }
      break;
  }
});

document.addEventListener("change", e => {
  const t = e.target;

  if (t.id === "import-file" && t.files && t.files[0]){ importJson(t.files[0]); t.value = ""; return; }
  if (t.id === "board-date"){ App.date = t.value || todayStr(); return render(); }

  if (t.id === "f-when")  { App.filters.when   = t.value; return render(); }
  if (t.id === "f-status"){ App.filters.status = t.value; return render(); }
  if (t.id === "f-tech")  { App.filters.techId = t.value; return render(); }
  if (t.id === "f-type")  { App.filters.type   = t.value; return render(); }

  if (t.classList && t.classList.contains("wv-ack")){ refreshAckError(); return; }

  if (t.id === "pb-pick"){
    const i = Store.priceItem(t.value);
    if (i){
      $("#line-desc").value  = i.desc;
      $("#line-price").value = i.price;
      $("#line-kind").value  = i.kind;
      $("#line-qty").focus();
      $("#line-qty").select();
    }
    return;
  }

  if (t.dataset.setstatus){
    const j = Store.job(t.dataset.setstatus);
    Store.setStatus(j, t.value); render(); openJob(j.id);
    return;
  }
  if (t.dataset.settech){
    const j = Store.job(t.dataset.settech);
    Store.assign(j, t.value || null); render(); openJob(j.id);
    return;
  }
});

/* Enter-to-submit inside modals, so the office can key a job fast. */
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const modal = $("#modal-root .modal");
  if (!modal || e.target.tagName === "TEXTAREA") return;
  if (e.target.id === "part-desc" || e.target.id === "part-price" || e.target.id === "part-qty"){
    $("[data-add-part]", modal)?.click(); e.preventDefault(); return;
  }
  if (e.target.id === "note-text"){ $("[data-add-note]", modal)?.click(); e.preventDefault(); return; }
  if (e.target.id === "est-note"){ $("[data-est-note]", modal)?.click(); e.preventDefault(); return; }
  if (["line-desc","line-qty","line-price"].includes(e.target.id)){
    $("[data-add-line]", modal)?.click(); e.preventDefault(); return;
  }
  const save = $("[data-save-job],[data-save-customer],[data-save-tech],[data-save-estimate],[data-save-price],[data-save-template]", modal);
  if (save && e.target.closest(".modal-body")){ save.click(); e.preventDefault(); }
});

let searchTimer = null;
$("#global-search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => { App.search = v; render(); }, 160);
});

$("#btn-new-job").addEventListener("click", () => openJobForm(null));
$("#btn-new-estimate").addEventListener("click", () => openEstimateForm(null));

/* ============================================================
   Boot
   ============================================================ */
Store.load();
App.date = todayStr();
render();
$("#storage-note").textContent = `${Store.data.jobs.length} jobs · saved on this device`;
</script>
