/* ---------- Materials, shared by jobs and estimates ----------
   Typing is the whole point: one box, Enter adds and the box stays focused
   so a list goes in as fast as it can be said out loud. Nothing here ever
   reaches a printed estimate — it is what to put in the van, not what the
   customer is charged. */
function materialsPanel(kind, rec){
  const list = Store.materialsOf(rec);
  const left = Store.stillNeeded(rec);
  const cost = Store.materialsCost(rec);
  const sorted = list.slice().sort((a,b) => (a.got === b.got) ? a.addedAt - b.addedAt : (a.got ? 1 : -1));

  return `
  <div class="mat">
    <div class="mat-add">
      <input class="input" id="mat-text-${kind}" placeholder="Add a part — expansion tank, 3/4 sharkbite…"
             autocomplete="off" enterkeyhint="done"
             data-mat-add="${kind}:${rec.id}">
      <input class="input num" id="mat-qty-${kind}" type="number" min="1" step="1" value="1"
             aria-label="Quantity">
      <button class="btn accent" data-mat-go="${kind}:${rec.id}">Add</button>
    </div>

    ${list.length ? `
      <div class="mat-sum">
        ${left
          ? `<span class="mat-left">${left} still to pick up</span>`
          : `<span class="mat-done">✓ everything's in the van</span>`}
        ${cost ? `<span class="mat-cost">${esc(money(cost))} of parts
            ${kind === "job" ? `<button class="btn sm ghost" data-mat-usecost="${rec.id}"
              title="Put this in the job's parts-cost box">use as parts cost</button>` : ""}</span>` : ""}
      </div>

      <ul class="mat-list">
        ${sorted.map(m => `
          <li class="${m.got ? "got" : ""}">
            <button class="mat-tick" data-mat-tick="${kind}:${rec.id}:${m.id}"
                    aria-pressed="${m.got}" aria-label="${m.got ? "Put back on the list" : "Mark as picked up"}">
              ${m.got ? "✓" : ""}
            </button>
            <span class="mat-q">${m.qty > 1 ? esc(m.qty) + "&times;" : ""}</span>
            <span class="mat-t">${esc(m.text)}</span>
            ${m.from === "estimate" && kind === "job"
              ? `<span class="mat-src" title="Listed when you quoted it">quoted</span>` : ""}
            <input class="input mat-c" type="number" min="0" step="0.01" placeholder="cost"
                   value="${m.cost == null ? "" : esc(m.cost)}"
                   data-mat-cost="${kind}:${rec.id}:${m.id}" aria-label="What it cost">
            <button class="btn sm ghost" data-mat-del="${kind}:${rec.id}:${m.id}" title="Remove">&times;</button>
          </li>`).join("")}
      </ul>`
    : `<p class="t-sub" style="margin:10px 0 0">
         Nothing listed yet. Put down what you think you'll need while you're
         standing in front of the job — the trip you don't make is the one this saves.
       </p>`}
  </div>`;
}

/* Re-render just this panel, so adding ten things in a row doesn't rebuild
   the record ten times and lose the cursor. */
function refreshMaterials(kind, id){
  const rec = Store.recordOf(kind, id);
  const host = $(".mat");
  if (!rec || !host) return;
  const wrap = document.createElement("div");
  wrap.innerHTML = materialsPanel(kind, rec);
  host.replaceWith(wrap.firstElementChild);
  const box = $("#mat-text-" + kind);
  if (box) box.focus();
}

function addMaterialFromForm(kind, id){
  const box = $("#mat-text-" + kind), qty = $("#mat-qty-" + kind);
  if (!box) return;
  const text = box.value.trim();
  if (!text){ box.focus(); return; }
  Store.addMaterial(kind, id, text, qty ? qty.value : 1);
  box.value = "";
  if (qty) qty.value = "1";
  refreshMaterials(kind, id);
}

/* ---------- Time on site, shared by jobs and estimates ---------- */
function timePanel(kind, rec){
  const entries = Store.entriesOf(rec).slice().sort((a,b) => a.startedAt - b.startedAt);
  const live = entries.find(e => !e.endedAt);
  const total = Store.totalMs(rec);
  const linked = kind === "job" && rec.estimateId ? Store.estimate(rec.estimateId) : null;
  const quoteMs = linked ? Store.totalMs(linked) : 0;

  return `
    <div style="margin-bottom:12px">
      ${live
        ? `<button class="btn clock-btn clock-on" data-clock="out:${kind}:${rec.id}">⏹ Clock out — on site ${esc(fmtDur(Date.now() - live.startedAt))}</button>`
        : `<button class="btn accent clock-btn" data-clock="in:${kind}:${rec.id}">▶ Clock in</button>`}
    </div>

    ${entries.length ? `<div>
      ${entries.map(e => `
        <div class="time-row ${e.endedAt ? "" : "live"}">
          <span class="when">${esc(fmtStamp(e.startedAt))}${e.endedAt ? ` → ${esc(new Date(e.endedAt).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}))}` : " → running"}</span>
          ${e.note ? `<span class="t-sub">${esc(e.note)}</span>` : ""}
          <span class="dur">${esc(fmtDur((e.endedAt || Date.now()) - e.startedAt))}</span>
          <button class="btn sm ghost" data-edit-time="${kind}:${rec.id}:${e.id}" title="Correct this">✎</button>
          <button class="btn sm ghost" data-del-time="${kind}:${rec.id}:${e.id}" title="Remove">×</button>
        </div>`).join("")}
      <div class="time-sum">
        <span>${kind === "estimate" ? "Time quoting" : "Time on this job"}</span>
        <span class="n">${esc(fmtDur(total))}</span>
      </div>
      ${quoteMs ? `
        <div class="time-row"><span class="when">Plus quoting it (EST-${linked.no})</span>
          <span class="dur">${esc(fmtDur(quoteMs))}</span></div>
        <div class="time-sum"><span>All in</span>
          <span class="n">${esc(fmtDur(total + quoteMs))}</span></div>` : ""}
    </div>` : `<p class="t-sub" style="margin:0">No time logged yet. Hit Clock in when you get there.</p>`}

    <div style="margin-top:10px">
      <button class="btn sm" data-add-time="${kind}:${rec.id}">＋ Add time by hand</button>
    </div>`;
}

/* Correcting a forgotten clock-out, or adding a trip after the fact. */
function openTimeEdit(kind, recId, entryId){
  const rec = Store.recordOf(kind, recId);
  const e = entryId ? Store.entriesOf(rec).find(x => x.id === entryId) : null;
  const start = e ? e.startedAt : Date.now() - 3600000;
  const end = e ? (e.endedAt || Date.now()) : Date.now();

  openModal(`
    <div class="modal-head"><h2>${e ? "Correct this time" : "Add time"}</h2>
      <div class="spacer"></div><button class="x" data-close>×</button></div>
    <div class="modal-body">
      ${e && !e.endedAt ? `<div class="legal-note" style="border-color:#f0c9a8;background:#fdf3ea">
        This one is still running. Setting an end time stops it.</div>` : ""}
      <div class="row2">
        <div class="field"><label>Arrived</label>
          <input class="input" id="te-start" type="datetime-local" value="${esc(toLocalInput(start))}"></div>
        <div class="field"><label>Left</label>
          <input class="input" id="te-end" type="datetime-local" value="${esc(toLocalInput(end))}"></div>
      </div>
      <div class="err" id="te-err" style="display:none">The leaving time has to be after the arriving time.</div>
    </div>
    <div class="modal-foot"><div class="spacer"></div>
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" data-save-time="${kind}:${recId}:${entryId || ""}">Save</button>
    </div>`);
}

function saveTimeEdit(payload){
  const [kind, recId, entryId] = payload.split(":");
  const start = fromLocalInput($("#te-start").value);
  const end = fromLocalInput($("#te-end").value);
  if (!start || !end || end <= start){ $("#te-err").style.display = "block"; return; }
  if (entryId) Store.updateEntry(kind, recId, entryId, start, end);
  else Store.addEntry(kind, recId, start, end, "");
  closeModal(); render();
  if (kind === "estimate") openEstimate(recId); else openJob(recId);
  toast("Time saved", "ok");
}

/* ---------- Message the customer ---------- */
let MsgState = { tplId:"onway", bump:0, jobId:null };

function openMessage(jobId, tplId){
  const job = Store.job(jobId);
  if (!job) return;
  const c = Store.customer(job.customerId);
  if (!c){ toast("No customer on this job.", "err"); return; }
  MsgState = { tplId: tplId || "onway", bump: 0, jobId };
  renderMessageSheet();
}

function renderMessageSheet(){
  const job = Store.job(MsgState.jobId);
  const c = Store.customer(job.customerId);
  const z = Store.zone(c.zone);
  const body = Store.renderMessage(MsgState.tplId, job, MsgState.bump);
  const tel = String(c.phone || "").replace(/\D/g, "");
  const needsEta = MsgState.tplId === "onway" || MsgState.tplId === "late";
  const bumpBtn = (m, label) =>
    `<button class="${MsgState.bump===m?"on":""}" data-msg-bump="${m}">${esc(label)}</button>`;

  openModal(`
    <div class="modal-head">
      <div><div class="t-sub">${esc(c.name)} · job #${job.no}</div>
        <h2>Message the customer</h2></div>
      <div class="spacer"></div><button class="x" data-close>×</button>
    </div>
    <div class="modal-body">
      <div class="msg-tabs">
        ${Store.messages().map(m =>
          `<button class="${MsgState.tplId===m.id?"on":""}" data-msg-tpl="${esc(m.id)}">${esc(m.label)}</button>`).join("")}
      </div>

      ${needsEta ? `
        <div class="msg-eta">
          <span class="lab">Travel</span>
          <span class="zone-chip">${esc(z.label)} · ${esc(z.eta)}</span>
          <div style="flex:1"></div>
          <span class="lab">Running behind?</span>
          ${bumpBtn(0,"On time")}${bumpBtn(15,"+15")}${bumpBtn(30,"+30")}
        </div>` : ""}

      <textarea class="msg-prev" id="msg-body">${esc(body)}</textarea>
      <div class="msg-meta">
        <span>Edit it before you send — this is just a starting point.</span>
        <span id="msg-count">${body.length} characters</span>
      </div>

      <div class="section-title" style="margin-top:18px">Send it</div>
      <div class="msg-send">
        ${tel ? `<a class="btn accent" id="msg-sms" href="#" data-msg-send="text">💬 Text ${esc(fmtPhone(c.phone))}</a>`
              : `<span class="t-sub">No mobile number on file for ${esc(c.name)}.</span>`}
        ${c.email ? `<a class="btn" id="msg-mail" href="#" data-msg-send="email">✉ Email</a>` : ""}
        <button class="btn" data-msg-send="copy">⧉ Copy</button>
      </div>
      <p class="t-sub" style="margin:12px 0 0">
        Your phone sends it, from your own number — so if they reply, it comes to you.
        On a computer, use Copy.
      </p>
    </div>
    <div class="modal-foot">
      <button class="btn sm ghost" data-action="edit-messages">Edit templates &amp; zones</button>
      <div class="spacer"></div>
      <button class="btn" data-close>Close</button>
    </div>`, { wide:true, noFocus:true });

  // Keep the href live as the text is edited, so the phone gets what's on screen.
  const ta = $("#msg-body");
  const sync = () => {
    const txt = ta.value;
    $("#msg-count").textContent = txt.length + " characters";
    const sms = $("#msg-sms"), mail = $("#msg-mail");
    // "?&body=" keeps both iOS and Android happy.
    if (sms) sms.href = `sms:${tel}?&body=${encodeURIComponent(txt)}`;
    if (mail) mail.href = `mailto:${encodeURIComponent(c.email)}` +
      `?subject=${encodeURIComponent(Store.data.settings.company + " — job #" + job.no)}` +
      `&body=${encodeURIComponent(txt)}`;
  };
  ta.addEventListener("input", sync);
  sync();
}

function logMessageSent(how){
  const job = Store.job(MsgState.jobId);
  if (!job) return;
  const label = Store.message(MsgState.tplId).label;
  Store.addLog(job, `${how} customer: ${label}${MsgState.bump ? ` (+${MsgState.bump} min)` : ""}`);
  Store.save();
}

function doGoLive(){
  const company = $("#gl-company").value.trim();
  const techName = $("#gl-tech").value.trim();
  if (!company || !techName){
    $("#gl-err").style.display = "block";
    if (!company) $("#gl-company").classList.add("invalid");
    if (!techName) $("#gl-tech").classList.add("invalid");
    return;
  }
  if (!confirm("Delete the sample customers, jobs, estimates and signed waivers?\n\nThis cannot be undone. Your price book and waiver templates are kept.")) return;

  Store.goLive({
    company,
    phone: $("#gl-phone").value.trim(),
    laborRate: $("#gl-rate").value,
    startJobNo: $("#gl-jobno").value,
    techName,
    techPhone: $("#gl-techphone").value.trim(),
    techSkill: $("#gl-skill").value.trim()
  });
  closeModal();
  App.view = "today";
  render();
  toast("You're live. Take the first call.", "ok");
}

  const desc = $("#pb-desc").value.trim();

  if (id){ Object.assign(Store.priceItem(id), fields); toast("Price updated", "ok"); }
  else { Store.addPriceItem(fields); toast("Added to price book", "ok"); }
  Store.save(); closeModal(); render();
}

/* The invoice. Everything the customer should see about the job in one
   document: what was wrong, what was done, what it cost, the before and
   after, and what they signed. Photo sources are resolved before it is
   built, because an <img> that is still loading prints as a blank box. */
async function invoiceDocHtml(j){
  const st = Store.data.settings;
  const c = Store.customer(j.customerId);
  const parts = j.parts || [];
  const partsTotal = parts.reduce((s,p) => s + (Number(p.qty)||0)*(Number(p.price)||0), 0);
  const laborTotal = (Number(j.laborHours)||0) * (Number(j.laborRate)||0);
  const sub = Store.jobTotal(j);
  const tax = Store.taxOn(j);
  const total = Store.invoiceTotal(j);
  const paid = Number(j.payment && j.payment.amountPaid) || 0;
  const due = Math.max(0, total - paid);
  const no = Store.invoiceNoFor(j);
  const dueDate = Store.invoiceDue(j);

  // only the labelled ones — a photo of a model plate is for him, not them
  const shots = Store.photosOf(j).filter(p => p.tag);
  const withUrls = [];
  for (const p of shots){
    let url = await Photos.localUrl(p.id);
    if (!url && p.up && Cloud.configured() && Cloud.cfg.refreshToken){
      try { url = await Cloud.signPhoto(p.path, 3600); } catch(e){ url = null; }
    }
    if (url) withUrls.push({ p, url });
  }
  const signed = Store.signedForJob(j.id);

  return `
  <div class="invdoc">
    <div class="inv-head">
      <div class="doc-logo" aria-hidden="true"></div>
      <div style="flex:1">
        <h1>${esc(st.company)}</h1>
        ${letterhead(st)}
      </div>
      <div style="text-align:right">
        <div style="font-size:24px;font-weight:700;letter-spacing:-.01em">INVOICE</div>
        <div>INV-${esc(no)}</div>
        <div>${esc(fmtDate(j.invoicedOn, { month:"long", day:"numeric", year:"numeric" }))}</div>
      </div>
    </div>

    <table class="inv-meta">
      <tr>
        <td style="width:50%" valign="top">
          <strong>Billed to</strong><br>
          ${esc(c ? c.name : "—")}<br>
          ${c && c.address ? esc(c.address) + "<br>" : ""}
          ${c && c.city ? esc(c.city) + "<br>" : ""}
          ${c && c.phone ? esc(fmtPhone(c.phone)) : ""}
        </td>
        <td valign="top">
          <strong>Work done</strong><br>
          ${esc(j.type)} &middot; Job #${esc(j.no)}<br>
          ${j.scheduledDate ? esc(fmtDateLong(j.scheduledDate)) : ""}<br>
          ${(() => { const t = Store.termsLine(j); return t ? `<strong>${esc(t)}</strong>` : ""; })()}
        </td>
      </tr>
    </table>

    ${j.description ? `<p class="inv-desc"><strong>What was wrong:</strong> ${esc(j.description)}</p>` : ""}

    <table class="inv-lines">
      <thead><tr>
        <th>Description</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Amount</th>
      </tr></thead>
      <tbody>
        ${parts.map(pt => `<tr>
          <td>${esc(pt.desc)}</td>
          <td class="num">${esc(pt.qty)}</td>
          <td class="num">${esc(money(pt.price))}</td>
          <td class="num">${esc(money((Number(pt.qty)||0)*(Number(pt.price)||0)))}</td>
        </tr>`).join("")}
        ${laborTotal ? `<tr>
          <td>Labour</td>
          <td class="num">${esc(j.laborHours)} hr</td>
          <td class="num">${esc(money(j.laborRate))}</td>
          <td class="num">${esc(money(laborTotal))}</td>
        </tr>` : ""}
      </tbody>
      <tfoot>
        <tr><td colspan="3" class="num">Subtotal</td><td class="num">${esc(money(sub))}</td></tr>
        ${tax ? `<tr><td colspan="3" class="num">GST ${esc(Number(st.gstRate))}%</td>
                     <td class="num">${esc(money(tax))}</td></tr>` : ""}
        <tr class="tot"><td colspan="3" class="num">Total</td><td class="num">${esc(money(total))}</td></tr>
        ${paid ? `<tr><td colspan="3" class="num">Received</td><td class="num">−${esc(money(paid))}</td></tr>
                  <tr class="tot"><td colspan="3" class="num">Balance due</td>
                      <td class="num">${esc(money(due))}</td></tr>` : ""}
      </tfoot>
    </table>

    ${j.payment && j.payment.url ? `
      <p class="inv-pay"><strong>To pay:</strong> ${esc(j.payment.url)}</p>` : ""}

    ${withUrls.length ? `
      <div class="inv-shots">
        <div class="inv-sec">The work</div>
        <div class="inv-grid">
          ${withUrls.map(({p,url}) => `
            <figure>
              <img src="${esc(url)}" alt="${esc(p.tag)}">
              <figcaption>${esc(p.tag)}</figcaption>
            </figure>`).join("")}
        </div>
      </div>` : ""}

    ${signed.length ? `
      <div class="inv-sec">Signed on this job</div>
      <table class="inv-meta">
        ${signed.map(w => `<tr>
          <td>${esc(w.title)}</td>
          <td style="width:42%">
            ${esc(w.signerName)} &middot; ${esc(fmtStamp(w.signedAt))}
            ${w.signature ? `<div class="inv-sig"><img src="${esc(w.signature)}"
                 alt="Signature of ${esc(w.signerName)}"></div>` : ""}
          </td>
        </tr>`).join("")}
      </table>` : ""}

    ${st.invoiceNote ? `<p class="inv-note">${esc(st.invoiceNote)}</p>` : ""}
    ${st.gst ? "" : `<!-- no GST number on file, so no tax has been charged -->`}
  </div>`;
}

/* Thumbnails arrive after the view is drawn: each one is a separate signed
   URL and the list should not wait on the network to appear. Same approach as
   the job photos. */
function fillLeadShots(){
  $$("[data-lead-shots]").forEach(async box => {
    const lead = Store.leads().find(l => l.id === box.dataset.leadShots);
    if (!lead) return;
    lead.photos.forEach(async (path, i) => {
      const cell = box.querySelector(`.ls[data-i="${i}"]`);
      if (!cell || cell.dataset.done) return;
      cell.dataset.done = "1";
      try {
        const url = await Cloud.signInquiryPhoto(path);
        cell.style.backgroundImage = `url("${url}")`;
        cell.classList.add("on");
        cell.setAttribute("role", "button");
        cell.setAttribute("aria-label", "View photo " + (i + 1));
        cell.addEventListener("click", () => openInquiryPhoto(path, lead));
      } catch(e){ cell.classList.add("bad"); cell.textContent = "✕"; }
    });
  });
}

function invoiceLinkUrl(token){
  const st = Store.data.settings || {};
  const custom = String(st.signBase || "").trim();
  // The invoice page sits beside the signing page, wherever that is.
  const base = custom ? custom.replace(/\/+$/, "").replace(/\/sign$/, "") + "/invoice"
    : location.origin + location.pathname.replace(/[^/]*$/, "") + "invoice.html";
  if (custom && st.signShort) return `${base}#t=${encodeURIComponent(token)}`;
  return `${base}#t=${encodeURIComponent(token)}` +
         `&u=${encodeURIComponent(Cloud.base())}&k=${encodeURIComponent(Cloud.cfg.key)}`;
}

/* Send the invoice as a link rather than an attachment.
   A browser cannot put a file into a text or an email, so the PDF route was
   always save, find, attach. This is one tap — and it puts the pay button on
   the page they are already reading, which is the shortest road there is
   between finishing a job and the money arriving. */
async function sendInvoiceLink(id){
  const j = Store.job(id);
  if (!j) return;
  const c = Store.customer(j.customerId);
  if (!Store.jobTotal(j)){ toast("There's no money on this job yet", "warn"); return; }
  if (!c){ toast("Attach it to a customer first", "warn"); return; }
  if (!Cloud.configured() || !Cloud.cfg.refreshToken){
    toast("Connect this device first — More → Data & Setup", "warn"); return;
  }

  openModal(`<div class="modal-head"><div><div class="t-sub">${esc(c.name)}</div>
      <h2>Making the invoice…</h2></div><div class="spacer"></div></div>
    <div class="modal-body"><p class="t-sub">One moment.</p></div>`, { noFocus:true });

  let token;
  try {
    token = await Cloud.publishInvoiceLink(j);
  } catch(err){
    closeModal();
    toast(err.offline ? "No connection — try again when you've got a bar."
      : /relation|does not exist|schema cache/i.test(err.message || "")
        ? "The invoice table isn't set up yet. Run supabase-invoice-links.sql."
        : (err.message || "It didn't go up."), "warn");
    return;
  }

  const url = invoiceLinkUrl(token);
  const first = String(c.name).trim().split(/\s+/)[0] || "there";
  const owed = Store.balance(j);
  const work = String(j.type).toLowerCase();
  const settled = Store.payState(j) === "paid" || owed <= 0.005;
  const note = settled
    ? `Hi ${first} — receipt for the ${work}, ${money(Store.invoiceTotal(j))}, paid in ` +
      `full. Everything's on here including the photos. Need a copy for your records? ` +
      `There's a Save a copy button at the bottom.\n\n${url}`
    : `Hi ${first} — invoice for the ${work}, ${money(owed)}. Everything's on here ` +
      `including the photos, and you can pay from the same page. Need a copy for your ` +
      `records? There's a Save a copy button at the bottom.\n\n${url}`;

  const fresh = !j.payment || j.payment.status === "unbilled";
  Store.markInvoiced(j);
  Store.addLog(j, "Sent the invoice as a link");
  Store.save();
  await Cloud.pullInvoiceLinks();

  openModal(`
    <div class="modal-head">
      <div><div class="t-sub">INV-${esc(j.invoiceNo)} · ${esc(c.name)}</div>
        <h2>${settled ? "Send the receipt" : "Send the invoice"}</h2></div>
      <div class="spacer"></div><button class="x" data-close>&times;</button>
    </div>
    <div class="modal-body">
      <p class="t-sub" style="margin:0 0 12px">
        They open it on their phone and see the lot &mdash; letterhead, the work,
        before and after, what they signed, the total${settled
          ? ". It already says paid in full."
          : " &mdash; and pay from the same page."}
      </p>
      <div class="field"><label>The message</label>
        <textarea class="msg-prev" id="iv-note" style="min-height:130px">${esc(note)}</textarea></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
        ${c.phone ? `<a class="btn primary" id="iv-sms" href="#">💬 Text ${esc(fmtPhone(c.phone))}</a>` : ""}
        ${c.email ? `<a class="btn" id="iv-mail" href="#">✉ Email ${esc(c.email)}</a>` : ""}
        <button class="btn" data-copy-invoice="${esc(token)}">📋 Copy the link</button>
      </div>
      ${(() => {
        if (settled) return "";
        const st = Store.data.settings;
        const ways = [];
        if ((j.payment && j.payment.url) || st.payStripeUrl) ways.push("card");
        if (st.payEtransfer) ways.push("e-transfer");
        if (st.payCash) ways.push("cash");
        return ways.length
          ? `<p class="t-sub" style="margin:14px 0 0">They can pay by
             <strong>${esc(ways.join(", "))}</strong> from that page.</p>`
          : `<div class="stop-flag" style="margin:14px -16px -16px;border-radius:0">
             <strong>No way to pay on it.</strong> Add a card link, an e-transfer address
             or tick cash under <strong>Data &amp; Setup → How they can pay</strong>.</div>`;
      })()}

/* The signing link, for the ones he can't stand in the room for.
   Everything the page needs rides in the hash — the part after the # that
   browsers never send to a server — so the key stays out of access logs on
   the way, and out of this repo. */
function signLinkUrl(token){
  // Default is whatever address the app itself is served from. Once the
  // signing page is hosted on his own domain, that goes in Data & Setup and
  // customers stop seeing a github.io address on his paperwork.
  const st = Store.data.settings || {};
  const custom = String(st.signBase || "").trim();
  const base = custom ? custom.replace(/\/+$/, "")
    : location.origin + location.pathname.replace(/[^/]*$/, "") + "sign.html";

  // A page hosted on his own domain can hold the project details itself, and
  // then the link is the token and nothing else — about 66 characters instead
  // of 210. A generic copy can't know whose project it is, so that one still
  // carries them.
  if (custom && st.signShort) return `${base}#t=${encodeURIComponent(token)}`;

  return `${base}#t=${encodeURIComponent(token)}` +
         `&u=${encodeURIComponent(Cloud.base())}&k=${encodeURIComponent(Cloud.cfg.key)}`;
}

/* He tapped Text, Email or Copy — so it really went. Until this runs, the
   estimate says nothing about having been sent, because it hasn't been. */
function markLinkSent(id, how){
  const e = Store.estimate(id);
  if (!e) return;
  const first = e.status === "draft";
  if (first) Store.setEstStatus(e, "sent");   // logs the move itself
  e.linkSentAt = Date.now();
  Store.addEstLog(e, `${how} the signing link to the customer`);
  Store.save(); renderQuiet();
  toast(first ? `EST-${e.no} — link sent` : `Link sent again — EST-${e.no}`, "ok");
}

function download(filename, text, mime){
  const blob = new Blob([text], { type: mime || "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function importJson(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.jobs)) throw new Error("Not a dispatch backup");
      if (!confirm(`Replace everything in this browser with the backup?\n\n${parsed.jobs.length} jobs · ${(parsed.customers||[]).length} customers`)) return;
      Store.data = parsed;
      Store.data.techs     = Store.data.techs     || [];
      Store.data.customers = Store.data.customers || [];
      Store.data.settings  = Store.data.settings  || { company:"Poseidon Plumbing & Gasfitting Ltd.", laborRate:145, phone:"" };
      Store.save(); render();
      toast("Backup restored", "ok");
    } catch(e){
      toast("That file isn't a dispatch backup.", "err");
    }
  };
  reader.readAsText(file);
}

/* ============================================================
   Event wiring
   ============================================================ */
document.addEventListener("click", e => {
  const hit = sel => e.target.closest(sel);

  if (hit("[data-close]")) return closeModal();

  /* --- navigation --- */
  if (hit("[data-navsheet]")) return openNavSheet();
  if (e.target.id === "nav-sheet") return closeNavSheet();

  const nav = hit("[data-nav]");
  if (nav){
    App.search = ""; $("#global-search").value = "";
    closeNavSheet();
    return go(nav.dataset.nav);
  }

  /* --- schedule mode --- */
  const sm = hit("[data-smode]");
  if (sm){ App.scheduleMode = sm.dataset.smode; return render(); }

  /* --- date navigation, stepped by whichever view is showing --- */
  const dn = hit("[data-date]");
  if (dn){
    const k = dn.dataset.date;
    if (k === "today"){ App.date = todayStr(); }
    else {
      const dir = k === "next" ? 1 : -1;
      App.date = App.scheduleMode === "month" ? addMonths(App.date, dir)
               : App.scheduleMode === "week"  ? addDays(App.date, dir * 7)
               : addDays(App.date, dir);
    }
    return render();
  }

  /* --- job detail actions (checked before the generic row handler) --- */
  const adv = hit("[data-advance]");
  if (adv){
    const j = Store.job(adv.dataset.advance);
    const n = NEXT_STATUS[j.status];
    if (!n) return;
    Store.setStatus(j, n);
    const inField = App.view === "today";
    render();
    if (!inField) openJob(j.id);          // on the field list, stay on the list
    toast(`#${j.no} → ${STATUS_LABEL[n]}`, "ok");
    return;
  }
  const editJob = hit("[data-edit-job]");
  if (editJob) return openJobForm(editJob.dataset.editJob);

  const printJob = hit("[data-print-job]");
  if (printJob) return printJobs([Store.job(printJob.dataset.printJob)], "this job");

  const addPart = hit("[data-add-part]");
  if (addPart){
    const j = Store.job(addPart.dataset.addPart);
    const desc = $("#part-desc").value.trim();
    if (!desc){ $("#part-desc").focus(); return; }
    j.parts = j.parts || [];
    j.parts.push({ desc, qty: Number($("#part-qty").value) || 1, price: Number($("#part-price").value) || 0 });
    Store.addLog(j, `Part added: ${desc}`);
    Store.save(); openJob(j.id);
    return;
  }
  const delPart = hit("[data-del-part]");
  if (delPart){
    const [jid, idx] = delPart.dataset.delPart.split(":");
    const j = Store.job(jid);
    j.parts.splice(Number(idx), 1);
    Store.save(); openJob(jid);
    return;
  }
  /* --- the clock --- */
  const clock = hit("[data-clock]");
  if (clock){
    const [dir, kind, id] = clock.dataset.clock.split(":");
    const rec = Store.recordOf(kind, id);
    if (dir === "in"){
      const was = Store.running();
      Store.clockIn(kind, id);
      if (was && was.rec.id !== id)
        toast(`Clocked out of ${was.kind === "estimate" ? "EST-" + was.rec.no : "#" + was.rec.no} first`, "ok");
      else toast("Clock running", "ok");
    } else {
      Store.clockOut(kind, id);
      toast(`Clocked out — ${fmtDur(Store.totalMs(rec))} on this one`, "ok");
    }
    render();
    if ($("#modal-root").innerHTML){ kind === "estimate" ? openEstimate(id) : openJob(id); }
    return;
  }
  if (hit("[data-add-lead]")) return openManualLead();
  if (hit("[data-save-manual-lead]")) return saveManualLead();

  const leadForget = hit("[data-lead-forget]");
  if (leadForget){
    Store.forgetManualLead(leadForget.dataset.leadForget);
    Cloud.markDirty(); render();
    toast("Removed", "ok");
    return;
  }

  const leadJob = hit("[data-lead-job]");
  if (leadJob){
    const l = Store.leadsOpen().find(x => x.id === leadJob.dataset.leadJob);
    if (!l) return;
    const j = Store.jobFromLead(l);
    Store.save(); render(); openJob(j.id);
    toast(`Job #${j.no} from ${l.name} — pick a day`, "ok");
    return;
  }
  const leadEst = hit("[data-lead-est]");
  if (leadEst){
    const l = Store.leadsOpen().find(x => x.id === leadEst.dataset.leadEst);
    if (!l) return;
    const e = Store.estimateFromLead(l);
    Store.save(); render(); openEstimate(e.id);
    toast(`EST-${e.no} started from ${l.name}`, "ok");
    return;
  }
  const leadDrop = hit("[data-lead-drop]");
  if (leadDrop){
    Store.leadDone(leadDrop.dataset.leadDrop, "dropped", null);
    render();
    toast("Moved to dealt with", "ok");
    return;
  }
  const leadBack = hit("[data-lead-back]");
  if (leadBack){
    Store.leadReopen(leadBack.dataset.leadBack);
    render();
    toast("Back in the list", "ok");
    return;
  }

  const invGo = hit("[data-inv-go]");
  if (invGo){ App.invTab = invGo.dataset.invGo; return go("invoices"); }

  const invTab = hit("[data-inv-tab]");
  if (invTab){ App.invTab = invTab.dataset.invTab; return render(); }

  /* The whole point of the Invoices screen: one tap, money's in. */
  const invGot = hit("[data-inv-got]");
  if (invGot){
    const j = Store.job(invGot.dataset.invGot);
    if (!j) return;
    const amt = Store.invoiceTotal(j);
    Store.setPayment(j, { status:"paid", amountPaid: amt });
    render();
    toast(`${(j.payment.ref || "#" + j.no)} paid in full — ${money(amt)} in`, "ok");
    return;
  }
  const invPay = hit("[data-inv-pay]");
  if (invPay) return openInvPayment(invPay.dataset.invPay);

  const ipaySave = hit("[data-ipay-save]");
  if (ipaySave){
    const j = Store.job(ipaySave.dataset.ipaySave);
    if (!j) return;
    const came  = Math.max(0, Number($("#ipay-amt").value) || 0);
    const had   = Number((j.payment || {}).amountPaid) || 0;
    const total = Store.invoiceTotal(j);
    const now   = Math.round((had + came) * 100) / 100;
    // Within half a cent of the total is paid. Anything less is still out,
    // with the part payment recorded against it.
    Store.setPayment(j, {
      status: now >= total - 0.005 ? "paid" : "invoiced",
      amountPaid: now,
      method: $("#ipay-method").value
    });
    closeModal(); render();
    toast(now >= total - 0.005
      ? `Paid in full — ${money(now)} in`
      : `${money(came)} in, ${money(Store.balance(j))} still owed`, "ok");
    return;
  }
  const ipayClear = hit("[data-ipay-clear]");
  if (ipayClear){
    const j = Store.job(ipayClear.dataset.ipayClear);
    if (!j) return;
    Store.setPayment(j, { status:"invoiced", amountPaid: 0 });
    closeModal(); render();
    toast("Put back to waiting on payment", "ok");
    return;
  }

  const inv = hit("[data-invoice]");
  if (inv) return previewInvoice(inv.dataset.invoice);

  const invPrint = hit("[data-inv-print]");
  if (invPrint) return printInvoice(invPrint.dataset.invPrint);

  const phOpen = hit("[data-ph-open]");
  if (phOpen) return openPhoto(phOpen.dataset.phOpen);

  const phTag = hit("[data-ph-tag]");
  if (phTag){
    const [k,id,pid,tag] = phTag.dataset.phTag.split(":");
    Store.setPhoto(k, id, pid, { tag: tag || "" });
    closeModal();
    refreshPhotos(k, id);
    return;
  }

  const phTagSave = hit("[data-ph-tagsave]");
  if (phTagSave){
    const [k,id,pid] = phTagSave.dataset.phTagsave.split(":");
    const box = $("#ph-tag-text");
    Store.setPhoto(k, id, pid, { tag: box ? box.value.trim() : "" });
    closeModal();
    refreshPhotos(k, id);
    return;
  }

  const phDel = hit("[data-ph-del]");
  if (phDel){
    const [k,id,pid] = phDel.dataset.phDel.split(":");
    if (!confirm("Delete this photo? It goes from this device and from the cloud.")) return;
    const p = Store.removePhoto(k, id, pid);
    Photos.del(pid);
    if (p && p.up && Cloud.configured() && Cloud.cfg.refreshToken){
      Cloud.deletePhoto(p.path).catch(() => {});
    }
    closeModal();
    refreshPhotos(k, id);
    return;
  }

  const mGo = hit("[data-mat-go]");
  if (mGo){ const [k,id] = mGo.dataset.matGo.split(":"); return addMaterialFromForm(k, id); }

  const mTick = hit("[data-mat-tick]");
  if (mTick){
    const [k,id,mid] = mTick.dataset.matTick.split(":");
    const rec = Store.recordOf(k, id);
    const cur = Store.materialsOf(rec).find(x => x.id === mid);
    Store.setMaterial(k, id, mid, { got: !(cur && cur.got) });
    if (App.view === "pickup") return render();
    return refreshMaterials(k, id);
  }

  const mDel = hit("[data-mat-del]");
  if (mDel){
    const [k,id,mid] = mDel.dataset.matDel.split(":");
    Store.removeMaterial(k, id, mid);
    return refreshMaterials(k, id);
  }

  const mUse = hit("[data-mat-usecost]");
  if (mUse){
    const j = Store.job(mUse.dataset.matUsecost);
    if (!j) return;
    j.materialCost = Math.round(Store.materialsCost(j) * 100) / 100;
    Store.save(); openJob(j.id);
    return toast("Parts cost set to " + money(j.materialCost), "ok");
  }

  const conf = hit("[data-conflict]");
  if (conf) return resolveConflict(conf.dataset.conflict);

  const tEdit = hit("[data-edit-time]");
  if (tEdit){ const [k,r,e] = tEdit.dataset.editTime.split(":"); return openTimeEdit(k, r, e); }
  const tAdd = hit("[data-add-time]");
  if (tAdd){ const [k,r] = tAdd.dataset.addTime.split(":"); return openTimeEdit(k, r, null); }
  const tSave = hit("[data-save-time]");
  if (tSave) return saveTimeEdit(tSave.dataset.saveTime);
  const tDel = hit("[data-del-time]");
  if (tDel){
    const [k, r, e] = tDel.dataset.delTime.split(":");
    if (!confirm("Remove this time entry?")) return;
    Store.removeEntry(k, r, e);
    render();
    k === "estimate" ? openEstimate(r) : openJob(r);
    return;
  }

  /* --- customer messages --- */
  const mTpl = hit("[data-msg-tpl]");
  if (mTpl){ MsgState.tplId = mTpl.dataset.msgTpl; MsgState.bump = 0; return renderMessageSheet(); }

  const mBump = hit("[data-msg-bump]");
  if (mBump){ MsgState.bump = Number(mBump.dataset.msgBump) || 0; return renderMessageSheet(); }

  const mSend = hit("[data-msg-send]");
  if (mSend){
    const how = mSend.dataset.msgSend;
    if (how === "copy"){
      const ta = $("#msg-body");
      ta.select();
      const done = () => { logMessageSent("Copied message for"); toast("Copied — paste it wherever", "ok"); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(done, () => {
          try { document.execCommand("copy"); done(); } catch(_){ toast("Press Ctrl/Cmd+C to copy", "err"); }
        });
      } else {
        try { document.execCommand("copy"); done(); } catch(_){ toast("Press Ctrl/Cmd+C to copy", "err"); }
      }
      return;
    }
    // The anchor's own href does the opening; just record that it happened.
    logMessageSent(how === "text" ? "Texted" : "Emailed");
    return;
  }

  const msgBtn = hit("[data-message]");
  if (msgBtn){
    const [jid, tpl] = msgBtn.dataset.message.split(":");
    return openMessage(jid, tpl || null);
  }
  if (hit("[data-save-messages]")) return saveMessageSetup();

  const savePay = hit("[data-save-pay]");
  if (savePay){
    const j = Store.job(savePay.dataset.savePay);
    Store.setPayment(j, {
      status: $("#pay-status").value,
      amountPaid: Number($("#pay-amount").value) || 0,
      method: $("#pay-method").value,
      ref: $("#pay-ref").value.trim(),
      url: $("#pay-url").value.trim()
    });
    render(); openJob(j.id);
    toast("Payment updated", "ok");
    return;
  }
  const saveExt = hit("[data-save-ext]");
  if (saveExt){
    const w = Store.signedWaiver(saveExt.dataset.saveExt);
    w.externalUrl = $("#wv-ext").value.trim();
    Store.save(); openSignedWaiver(w.id);
    toast(w.externalUrl ? "External copy linked" : "Link cleared", "ok");
    return;
  }

  const saveLabor = hit("[data-save-labor]");
  if (saveLabor){
    const j = Store.job(saveLabor.dataset.saveLabor);
    j.laborHours = Number($("#labor-hours").value) || 0;
    Store.save(); openJob(j.id); toast("Labor saved", "ok");
    return;
  }
  const saveMat = hit("[data-save-matcost]");
  if (saveMat){
    const j = Store.job(saveMat.dataset.saveMatcost);
    j.materialCost = Number($("#mat-cost").value) || 0;
    Store.save(); openJob(j.id); toast("Parts cost saved", "ok");
    return;
  }

  const addNote = hit("[data-add-note]");
  if (addNote){
    const j = Store.job(addNote.dataset.addNote);
    const text = $("#note-text").value.trim();
    if (!text) return;
    Store.addLog(j, text); Store.save(); openJob(j.id);
    return;
  }
  const delJob = hit("[data-del-job]");
  if (delJob){
    const j = Store.job(delJob.dataset.delJob);
    if (!confirm(`Delete job #${j.no} for ${custName(j.customerId)}?\n\nThis cannot be undone.`)) return;
    Store.deleteJob(j.id); closeModal(); render(); toast("Job deleted");
    return;
  }

  /* --- estimate actions --- */
  const mRange = hit("[data-money-range]");
  if (mRange){ App.moneyRange = Number(mRange.dataset.moneyRange); return render(); }

  const estF = hit("[data-est-filter]");
  if (estF){ App.estFilter = estF.dataset.estFilter; return render(); }

  const conv = hit("[data-convert]");
  if (conv) return openConvert(conv.dataset.convert);

  const doConv = hit("[data-do-convert]");
  if (doConv) return doConvert(doConv.dataset.doConvert);

  const checkSigned = hit("[data-check-signed]");
  if (checkSigned){
    const id = checkSigned.dataset.checkSigned;
    checkSigned.textContent = "Checking…"; checkSigned.disabled = true;
    Cloud.pullSignLinks().then(() => {
      const e = Store.estimate(id);
      render();
      if (e && e.approval) openEstimate(id);
      else { openEstimate(id); toast("Not signed yet", "ok"); }
    });
    return;
  }

  const sendInv = hit("[data-send-invoice]");
  if (sendInv) return sendInvoiceLink(sendInv.dataset.sendInvoice);

  const copyInv = hit("[data-copy-invoice]");
  if (copyInv){
    const url = invoiceLinkUrl(copyInv.dataset.copyInvoice);
    const done = () => toast("Link copied", "ok");
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(url).then(done, () => prompt("Copy this link:", url));
    else prompt("Copy this link:", url);
    return;
  }

  const linkEst = hit("[data-link-estimate]");
  if (linkEst) return sendForSignature(linkEst.dataset.linkEstimate);

  const copyLink = hit("[data-copy-link]");
  if (copyLink){
    const url = signLinkUrl(copyLink.dataset.copyLink);
    const done = () => toast("Link copied", "ok");
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(url).then(done, () => prompt("Copy this link:", url));
    else prompt("Copy this link:", url);
    if (copyLink.dataset.sentId) markLinkSent(copyLink.dataset.sentId, "Copied");
    return;
  }

  /* The anchor's own href opens Messages or the mail app; this only records
     that he really did send it. */
  const lkSent = hit("[data-link-sent]");
  if (lkSent){
    const [eid, how] = lkSent.dataset.linkSent.split(":");
    markLinkSent(eid, how);
    return;
  }

  const signEst = hit("[data-sign-estimate]");
  if (signEst) return openEstimateSign(signEst.dataset.signEstimate);

  const saveEstSign = hit("[data-save-est-sign]");
  if (saveEstSign) return saveEstimateSignature(saveEstSign.dataset.saveEstSign);

  const sendEst = hit("[data-send-estimate]");
  if (sendEst) return sendEstimate(sendEst.dataset.sendEstimate);

  /* The anchor's own href opens the mail app or Messages; this just records
     that it happened and moves the estimate off Draft. */
  const estSent = hit("[data-est-sent]");
  if (estSent){
    const [eid, how] = estSent.dataset.estSent.split(":");
    const e = Store.estimate(eid);
    if (e){
      const first = e.status === "draft";
      if (first) Store.setEstStatus(e, "sent");   // logs the move itself
      Store.addEstLog(e, `${how} the estimate to the customer`);
      Store.save(); renderQuiet();
      toast(first ? `EST-${e.no} marked as sent` : `${how} again — EST-${e.no}`, "ok");
    }
    return;
  }

  const estSt = hit("[data-est-status]");
  if (estSt){
    const [eid, st] = estSt.dataset.estStatus.split(":");
    const e = Store.estimate(eid);
    Store.setEstStatus(e, st);
    const made = st === "approved" && e.jobId ? Store.job(e.jobId) : null;
    render(); openEstimate(eid);
    toast(made ? `Approved — job #${made.no} is on the board, waiting for a day`
               : `EST-${e.no} → ${EST_STATUS_LABEL[st]}`, "ok");
    return;
  }
  const editEst = hit("[data-edit-estimate]");
  if (editEst) return openEstimateForm(editEst.dataset.editEstimate);

  const printEst = hit("[data-print-estimate]");
  if (printEst) return printEstimate(Store.estimate(printEst.dataset.printEstimate));

  const addLine = hit("[data-add-line]");
  if (addLine){
    const e = Store.estimate(addLine.dataset.addLine);
    const desc = $("#line-desc").value.trim();
    if (!desc){ $("#line-desc").classList.add("invalid"); $("#line-desc").focus(); return; }
    const item = {
      desc,
      kind:  $("#line-kind").value,
      qty:   Number($("#line-qty").value) || 1,
      price: Number($("#line-price").value) || 0
    };
    e.items = e.items || [];
    e.items.push(item);
    Store.addEstLog(e, `Line added: ${desc}`);
    if ($("#line-save").checked){
      Store.addPriceItem({ desc: item.desc, price: item.price, kind: item.kind });
      toast("Added to the price book too", "ok");
    }
    Store.save(); openEstimate(e.id);
    return;
  }
  const delLine = hit("[data-del-line]");
  if (delLine){
    const [eid, idx] = delLine.dataset.delLine.split(":");
    const e = Store.estimate(eid);
    e.items.splice(Number(idx), 1);
    Store.save(); openEstimate(eid);
    return;
  }
  const estNote = hit("[data-est-note]");
  if (estNote){
    const e = Store.estimate(estNote.dataset.estNote);
    const text = $("#est-note").value.trim();
    if (!text) return;
    Store.addEstLog(e, text); Store.save(); openEstimate(e.id);
    return;
  }
  const delEst = hit("[data-del-estimate]");
  if (delEst){
    const e = Store.estimate(delEst.dataset.delEstimate);
    if (!confirm(`Delete estimate EST-${e.no} for ${Store.estContact(e).name}?\n\nThis cannot be undone.`)) return;
    Store.deleteEstimate(e.id); closeModal(); render(); toast("Estimate deleted");
    return;
  }

  /* --- waivers --- */
  const wvTab = hit("[data-waiver-tab]");
  if (wvTab){ App.waiverTab = wvTab.dataset.waiverTab; return render(); }

  const addWv = hit("[data-add-waiver]");
  if (addWv) return openWaiverPicker(addWv.dataset.addWaiver);

  const prevT = hit("[data-preview-template]");
  if (prevT) return previewTemplate(prevT.dataset.previewTemplate);

  const pickGo = hit("[data-pick-template-go]");
  if (pickGo) return openWaiverSign(pickGo.dataset.pickTemplateGo, null);

  const editT = hit("[data-edit-template]");
  if (editT) return openTemplateForm(editT.dataset.editTemplate);

  const archT = hit("[data-archive-template]");
  if (archT){
    const t = Store.waiverTemplate(archT.dataset.archiveTemplate);
    if (!confirm(`Delete the template "${t.title}"?\n\nWaivers already signed from it are kept.`)) return;
    t.archived = true; Store.save(); closeModal(); render(); toast("Template deleted");
    return;
  }
  if (hit("[data-do-golive]")) return doGoLive();

  const saveT = hit("[data-save-template]");
  if (saveT) return saveTemplateFromForm(saveT.dataset.saveTemplate || null);

  if (hit("[data-clear-sig]")) return clearSigPad();

  const signWv = hit("[data-sign-waiver]");
  if (signWv) return saveWaiverSignature(signWv.dataset.signWaiver);

  const printWv = hit("[data-print-waiver]");
  if (printWv) return printWaiver(Store.signedWaiver(printWv.dataset.printWaiver));

  const delSigned = hit("[data-del-signed]");
  if (delSigned){
    const w = Store.signedWaiver(delSigned.dataset.delSigned);
    if (!confirm(`Delete the signed record W-${w.no}?\n\nThis removes proof that ${w.signerName} signed. It cannot be undone.`)) return;
    Store.deleteSignedWaiver(w.id); closeModal(); render(); toast("Signed record deleted");
    return;
  }
  const signedEl = hit("[data-signed]");
  if (signedEl) return openSignedWaiver(signedEl.dataset.signed);

  /* --- price book --- */
  const editPrice = hit("[data-edit-price]");
  if (editPrice) return openPriceForm(editPrice.dataset.editPrice);
  const delPrice = hit("[data-del-price]");
  if (delPrice){
    const i = Store.priceItem(delPrice.dataset.delPrice);
    if (!confirm(`Remove "${i.desc}" from the price book?\n\nEstimates already using it keep their line.`)) return;
    Store.deletePriceItem(i.id); render(); toast("Removed from price book");
    return;
  }

  /* --- form saves --- */
  const sj = hit("[data-save-job]");      if (sj) return saveJobFromForm(sj.dataset.saveJob || null);
  const sc = hit("[data-save-customer]"); if (sc) return saveCustomerFromForm(sc.dataset.saveCustomer || null);
  const st = hit("[data-save-tech]");     if (st) return saveTechFromForm(st.dataset.saveTech || null);
  const se = hit("[data-save-estimate]"); if (se) return saveEstimateFromForm(se.dataset.saveEstimate || null);
  const sp = hit("[data-save-price]");    if (sp) return savePriceFromForm(sp.dataset.savePrice || null);

  /* --- customers / techs --- */
  const ec = hit("[data-edit-customer]"); if (ec) return openCustomerForm(ec.dataset.editCustomer);
  const et = hit("[data-edit-tech]");     if (et) return openTechForm(et.dataset.editTech);
  const tt = hit("[data-toggle-tech]");
  if (tt){
    const t = Store.tech(tt.dataset.toggleTech);
    const open = Store.data.jobs.filter(j => j.techId === t.id && isOpen(j)).length;
    if (t.active && open && !confirm(`${t.name} still has ${open} open job${open===1?"":"s"}.\n\nDeactivate anyway? Their jobs stay assigned but the column leaves the board.`)) return;
    t.active = !t.active; Store.save(); render();
    return;
  }
  const nef = hit("[data-new-est-for]");
  if (nef){
    const cid = nef.dataset.newEstFor;
    openEstimateForm(null);
    $("[data-who='existing']").click();
    $("#e-customer").value = cid;
    return;
  }
  const njf = hit("[data-new-job-for]");
  if (njf){
    const cid = njf.dataset.newJobFor;
    openJobForm(null);
    $("#f-customer").value = cid;
    return;
  }

  /* --- generic row / card open (last) --- */
  const estEl = hit("[data-estimate]"); if (estEl) return openEstimate(estEl.dataset.estimate);

  const jobEl = hit("[data-job]");   if (jobEl) return openJob(jobEl.dataset.job);
  const cusEl = hit("[data-customer]"); if (cusEl) return openCustomer(cusEl.dataset.customer);
  /* Opening a day from the month grid — after the card handlers above, so
     clicking a job opens the job rather than the day underneath it. */
  const gd = hit("[data-goday]");
  if (gd){
    App.date = gd.dataset.goday;
    App.scheduleMode = "day";
    return render();
  }

  /* --- toolbar actions --- */
  const act = hit("[data-action]");
  if (!act) return;
  switch(act.dataset.action){
    case "new-job":      openJobForm(null); break;
    case "new-estimate": openEstimateForm(null); break;
    case "new-price":    openPriceForm(null); break;
    case "export-est-csv": exportEstimatesCsv(); break;
    case "new-template":  openTemplateForm(null); break;
    case "golive":        openGoLive(); break;
    case "resync-demo": {
      const from = Store.data.seededOn || Store.inferredSampleDay();
      Store.shiftDemoDates(daysBetween(from, todayStr()));
      Store.data.demo = true;          // so it re-anchors by itself from now on
      Store.save(); render();
      toast("Sample moved to today", "ok");
      break;
    }
    case "edit-messages": openMessageSetup(); break;
    case "export-waivers": exportWaiversCsv(); break;
    case "new-customer": openCustomerForm(null); break;
    case "new-tech":     openTechForm(null); break;
    case "clear-filters":
      App.filters = { status:"", techId:"", type:"", when:"upcoming" }; render(); break;
    case "clear-search":
      App.search = ""; $("#global-search").value = ""; render(); break;
    case "print-day":
      printJobs(Store.data.jobs.filter(j => j.scheduledDate === todayStr() && isOpen(j)), "today"); break;
    case "print-board":
      printJobs(Store.data.jobs.filter(j => j.scheduledDate === App.date && isOpen(j)), "this day"); break;
    case "cloud-save": {
      const url = $("#cl-url").value.trim().replace(/\/+$/, "");
      const key = $("#cl-key").value.trim();
      const err = $("#cl-err");
      const fail = m => { err.textContent = m; err.style.display = "block"; };
      if (!/^https:\/\/[^\s/]+\.[^\s/]+/.test(url)) return fail("That doesn't look like a project URL. It should start https:// and end .supabase.co");
      if (!key) return fail("Paste the publishable key too.");
      if (/^sb_secret_/.test(key) || /service_role/.test(key))
        return fail("That's the secret key — it must never go in a browser. Use the publishable one.");
      Cloud.cfg = { url, key, email:"", deviceId: Cloud.newDeviceId() };
      Cloud.saveCfg();
      Cloud.set("signed-out", "now sign in");
      render();
      break;
    }
    case "cloud-signin": {
      const email = $("#cl-email").value.trim();
      const pass  = $("#cl-pass").value;
      const err = $("#cl-err");
      err.style.display = "none";
      if (!email || !pass){ err.textContent = "Email and password, please."; err.style.display = "block"; break; }
      const btn = hit("[data-action]");
      if (btn){ btn.disabled = true; btn.textContent = "Signing in…"; }
      Cloud.signingIn = true;
      Cloud.cfg.email = email; Cloud.saveCfg();   // so a later render keeps it
      Cloud.set("syncing", "signing in…");

      Cloud.signIn(email, pass)
        .then(() => Cloud.syncNow())
        .then(() => {
          Cloud.signingIn = false;
          render();
          toast("Signed in — this shop is syncing", "ok");
        })
        .catch(e => {
          // Leave the form exactly as typed; only the message changes.
          Cloud.signingIn = false;
          Cloud.state = "signed-out"; Cloud.detail = "";
          if (btn){ btn.disabled = false; btn.textContent = "Sign in"; }
          const el = $("#cl-err");
          if (el){
            el.textContent =
              e.offline && e.framed
                ? "This copy of the app can't reach the internet. A preview link runs in a "
                  + "sandbox that blocks outside connections — open the app from its own web "
                  + "address and sign in there."
              : e.offline
                ? "Couldn't reach the project — check the URL and your connection."
              : /invalid/i.test(e.message || "")
                ? "Email or password not accepted. If you just created this user, check "
                  + "\"Auto Confirm User\" was ticked in Supabase."
              : (e.message || "Sign in failed.");
            el.style.display = "block";
          }
        });
      break;
    }
    case "cloud-sync": Cloud.syncNow().then(render); break;
    case "cloud-signout":
      if (confirm("Sign out on this device? The shop stays here, it just stops syncing.")){
        Cloud.signOut(); render();
      }
      break;
    case "cloud-forget":
      if (confirm("Disconnect from this project? Nothing on the server is deleted and this device keeps its copy.")){
        Cloud.disconnect(); render();
      }
      break;
    case "close-sheet": closeNavSheet(); break;
    case "sync-now": Cloud.syncNow().then(() => render()); break;
    case "pick-clear": {
      const n = Store.pickupList().reduce((s,g) => s + g.items.length, 0);
      if (!n) break;
      if (!confirm(`Tick off all ${n} outstanding item${n===1?"":"s"} as picked up?`)) break;
      Store.pickupList().forEach(g =>
        g.items.forEach(m => Store.setMaterial(g.kind, g.rec.id, m.id, { got:true })));
      render();
      toast("All picked up", "ok");
      break;
    }
    case "export":     exportJson(); break;
    case "export-csv": exportCsv(); break;
    case "import":     $("#import-file").click(); break;
    case "save-settings": {
      const s = Store.data.settings;
      s.company = $("#set-company").value.trim() || "Poseidon Plumbing & Gasfitting Ltd.";
      s.phone   = $("#set-phone").value.trim();
      s.email   = $("#set-email").value.trim();
      s.website = $("#set-website").value.trim().replace(/^https?:\/\//, "");
      s.address = $("#set-address").value.trim();
      s.gst     = $("#set-gst").value.trim();
      s.gstRate = Number($("#set-gstrate").value) || 0;
      s.invoiceTermsMode = $("#set-terms-mode").value === "completion" ? "completion" : "days";
      s.invoiceTerms = Math.max(0, Number($("#set-terms").value) || 0);
      s.invoiceNote  = $("#set-invnote").value.trim();
      // Trailing slash or not, it's the same address; store it one way.
      s.signBase     = $("#set-signbase").value.trim().replace(/\/+$/, "");
      s.signShort    = !!($("#set-signshort") || {}).checked;
      s.payStripeUrl = ($("#set-pay-stripe") || {}).value ? $("#set-pay-stripe").value.trim() : s.payStripeUrl;
      s.payEtransfer = ($("#set-pay-etransfer") || {}).value != null
        ? $("#set-pay-etransfer").value.trim() : s.payEtransfer;
      s.payCash      = !!($("#set-pay-cash") || {}).checked;
      s.laborRate = Number($("#set-rate").value) || 0;
      Store.save(); render(); toast("Settings saved", "ok");
      break;
    }
    case "reset":
      if (confirm("Wipe all data in this browser and reload the sample day?")){
        Store.reset(); App.date = todayStr(); render(); toast("Reset to sample data");
      }
      break;
  }
});

document.addEventListener("change", e => {
  const t = e.target;

  // Show the day count only when days are what he's chosen. Done here rather
  // than by re-rendering, because a rebuild would throw away everything else
  // he has half-typed into that settings card.
  if (t.id === "set-terms-mode"){
    const n = $("#set-terms");
    if (n) n.style.display = t.value === "days" ? "block" : "none";
    return;
  }

  if (t.id === "import-file" && t.files && t.files[0]){ importJson(t.files[0]); t.value = ""; return; }
  if (t.id === "board-date"){ App.date = t.value || todayStr(); return render(); }

  if (t.id === "f-when")  { App.filters.when   = t.value; return render(); }
  if (t.id === "f-status"){ App.filters.status = t.value; return render(); }
  if (t.id === "f-tech")  { App.filters.techId = t.value; return render(); }
  if (t.id === "f-type")  { App.filters.type   = t.value; return render(); }

  if (t.classList && t.classList.contains("wv-ack")){ refreshAckError(); return; }

  if (t.id === "pb-pick"){
    const i = Store.priceItem(t.value);
    if (i){
      $("#line-desc").value  = i.desc;
      $("#line-price").value = i.price;
      $("#line-kind").value  = i.kind;
      $("#line-qty").focus();
      $("#line-qty").select();
    }
    return;
  }

  if (t.dataset.setstatus){
    const j = Store.job(t.dataset.setstatus);
    Store.setStatus(j, t.value); render(); openJob(j.id);
    return;
  }
  if (t.dataset.settech){
    const j = Store.job(t.dataset.settech);
    Store.assign(j, t.value || null); render(); openJob(j.id);
    return;
  }
});

/* Enter-to-submit inside modals, so the office can key a job fast. */
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const modal = $("#modal-root .modal");
  if (!modal || e.target.tagName === "TEXTAREA") return;
  if (e.target.id === "part-desc" || e.target.id === "part-price" || e.target.id === "part-qty"){
    $("[data-add-part]", modal)?.click(); e.preventDefault(); return;
  }
  if (e.target.id === "note-text"){ $("[data-add-note]", modal)?.click(); e.preventDefault(); return; }
  if (e.target.id === "est-note"){ $("[data-est-note]", modal)?.click(); e.preventDefault(); return; }
  if (["line-desc","line-qty","line-price"].includes(e.target.id)){
    $("[data-add-line]", modal)?.click(); e.preventDefault(); return;
  }
  const save = $("[data-save-job],[data-save-customer],[data-save-tech],[data-save-estimate],[data-save-price],[data-save-template]", modal);
  if (save && e.target.closest(".modal-body")){ save.click(); e.preventDefault(); }
});

/* Enter adds and stays put, so a list goes in as fast as it can be said. */
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  // anywhere in the add row, including the quantity box — typing "12" then
  // Enter is the obvious thing to do and used to do nothing at all
  const row = e.target.closest(".mat-add");
  if (!row) return;
  const box = row.querySelector("[data-mat-add]");
  if (!box) return;
  e.preventDefault();
  const [k,id] = box.dataset.matAdd.split(":");
  addMaterialFromForm(k, id);
});

document.addEventListener("change", e => {
  const f = e.target.closest("[data-ph-file]");
  if (f){
    const [k,id] = f.dataset.phFile.split(":");
    // Copy first. f.files is a live list, and clearing value — which is what
    // lets the same photo be chosen twice — empties the very list we hold.
    const files = Array.from(f.files || []);
    f.value = "";
    takePhotos(k, id, files);
    return;
  }

  const c = e.target.closest("[data-mat-cost]");
  if (!c) return;
  const [k,id,mid] = c.dataset.matCost.split(":");
  const v = c.value.trim();
  Store.setMaterial(k, id, mid, { cost: v === "" ? null : Number(v) });
  if (App.view === "pickup") return;
  const sum = $(".mat-sum");
  if (sum) refreshMaterials(k, id);
});

let searchTimer = null;
$("#global-search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => { App.search = v; render(); }, 160);
});

$("#btn-new-job").addEventListener("click", () => openJobForm(null));
$("#btn-new-estimate").addEventListener("click", () => openEstimateForm(null));

/* ============================================================
   Boot
   ============================================================ */
Store.load();
App.date = todayStr();
Cloud.loadCfg();
if (!restorePlace()) render();
renderSync();
function renderStorageNote(){
  const n = Store.data.jobs.length;
  const synced = Cloud.configured() && Cloud.cfg.refreshToken;
  $("#storage-note").textContent = `${n} job${n===1?"":"s"} · ${synced ? "synced" : "saved on this device"}`;
}
renderStorageNote();
Cloud.onChange(renderStorageNote);

Cloud.boot();

/* Coming back to the app is the moment another device's work should land. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") Cloud.syncNow({ quiet:true });
});
window.addEventListener("online", () => Cloud.syncNow({ quiet:true }));
</script>
