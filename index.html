/* ============================================================
   Photos

   Local first, always. A photo is written to this device the instant it is
   taken and shown from there; uploading happens afterwards when there is a
   signal to do it with. A basement, a dead zone or a mistake in the upload
   code costs you sync — never the photograph.

   The blobs live in IndexedDB, not localStorage, which tops out around five
   megabytes and would be full after two pictures. The shop record keeps
   only names and sizes, so the thing that syncs stays small.
   ============================================================ */
const PHOTO_DB = "pcp.photos", PHOTO_STORE = "blobs";

const Photos = {
  _db: null,
  _urls: new Map(),      // id -> object URL, so we don't leak one per render

  open(){
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      let rq;
      try { rq = indexedDB.open(PHOTO_DB, 1); }
      catch(e){ return rej(e); }
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE);
      };
      rq.onsuccess = () => { this._db = rq.result; res(this._db); };
      rq.onerror = () => rej(rq.error);
    });
  },

  async _tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(PHOTO_STORE, mode);
      const rq = fn(tx.objectStore(PHOTO_STORE));
      tx.oncomplete = () => res(rq ? rq.result : undefined);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  },

  put(id, blob){ return this._tx("readwrite", st => st.put(blob, id)); },
  get(id){ return this._tx("readonly", st => st.get(id)); },
  del(id){
    const u = this._urls.get(id);
    if (u){ URL.revokeObjectURL(u); this._urls.delete(id); }
    return this._tx("readwrite", st => st.delete(id));
  },
  keys(){ return this._tx("readonly", st => st.getAllKeys()); },

  /* A stable object URL per photo, so re-rendering a panel doesn't mint a
     new one each time and quietly eat memory all afternoon. */
  async localUrl(id){
    if (this._urls.has(id)) return this._urls.get(id);
    let blob = null;
    try { blob = await this.get(id); } catch(e){ return null; }
    if (!blob) return null;
    const u = URL.createObjectURL(blob);
    this._urls.set(id, u);
    return u;
  },

  /* Phone photos run 3-5 MB. At the size anyone actually looks at one on a
     job record, 1600px of JPEG is indistinguishable and a tenth the weight,
     which is the difference between 3,000 photos on the free tier and 300. */
  async shrink(file, max, quality){
    max = max || 1600; quality = quality || 0.72;
    let bmp = null;
    try {
      // from-image keeps a portrait photo the right way up
      bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    } catch(e){
      try { bmp = await createImageBitmap(file); } catch(e2){ bmp = null; }
    }
    if (!bmp) return { blob: file, w: 0, h: 0 };

    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * scale));
    const h = Math.max(1, Math.round(bmp.height * scale));
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(bmp, 0, 0, w, h);
    bmp.close && bmp.close();

    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", quality));
    return { blob: blob || file, w, h };
  }
};

/* ============================================================
   Cloud — optional Supabase sync

   Talks to Supabase's plain REST endpoints with fetch. No SDK, so the app
   keeps its "no dependencies, nothing to rot" property. The whole shop is
   one JSON row: at ~50 KB it isn't worth shredding into tables, and a blob
   means adding a feature never needs a migration.

   Two devices editing at once is the one way a blob can bite you, so every
   write is guarded by the revision it claims to replace. A stale write is
   refused by the server rather than silently winning, and the copy that
   loses a conflict is always written to a file before anything is replaced.
   ============================================================ */
const CLOUD_KEY = "pcp.cloud.v1";

const Cloud = {
  cfg: null,         // { url, key, email, deviceId, refreshToken }
  token: null,       // short-lived access token, memory only
  tokenExp: 0,
  uid: null,
  baseRev: 0,        // the rev we last agreed with the server on
  state: "off",      // off | signed-out | syncing | synced | conflict | error
  detail: "",
  dirty: false,
  /* True from raising the "which copy is right" question until he answers it.
     Everything that writes to the shop holds off while it is set. */
  conflictOpen: false,
  signingIn: false,
  pushTimer: null,
  _listeners: [],

  onChange(fn){ this._listeners.push(fn); },
  emit(){ this._listeners.forEach(fn => { try { fn(); } catch(e){} }); },
  set(state, detail){ this.state = state; this.detail = detail || ""; this.emit(); },

  loadCfg(){
    try { this.cfg = JSON.parse(localStorage.getItem(CLOUD_KEY) || "null"); }
    catch(e){ this.cfg = null; }
    if (this.cfg && !this.cfg.deviceId) this.cfg.deviceId = this.newDeviceId();
    // Changes this device made but never managed to send, carried across a
    // restart. Without it, closing the app seconds after an edit meant the
    // next open pulled the server's older copy over the top of that edit.
    this.dirty = !!(this.cfg && this.cfg.unsent);
    if (this.cfg && this.cfg.baseRev) this.baseRev = this.cfg.baseRev;
    this.state = this.cfg ? "signed-out" : "off";
  },

  /* Both halves of "what this device owes the server" are written down. */
  noteUnsent(v){
    this.dirty = v;
    if (!this.cfg) return;
    this.cfg.unsent = v;
    this.cfg.baseRev = this.baseRev;
    this.saveCfg();
  },
  saveCfg(){
    try { localStorage.setItem(CLOUD_KEY, JSON.stringify(this.cfg)); } catch(e){}
  },
  newDeviceId(){
    const n = (navigator.userAgent.match(/iPhone|iPad|Android|Macintosh|Windows/) || ["device"])[0];
    return n + "-" + Math.random().toString(36).slice(2,7);
  },
  configured(){ return !!(this.cfg && this.cfg.url && this.cfg.key); },

  /* --- plumbing --- */
  base(){ return String(this.cfg.url).replace(/\/+$/, ""); },

  async call(path, opts){
    const o = opts || {};
    const headers = Object.assign({
      "apikey": this.cfg.key,                 // key goes here and nowhere else
      "Content-Type": "application/json"
    }, o.headers || {});
    if (o.auth !== false && this.token) headers["Authorization"] = "Bearer " + this.token;

    let res;
    try {
      res = await fetch(this.base() + path, {
        method: o.method || "GET", headers,
        body: o.body === undefined ? undefined : JSON.stringify(o.body)
      });
    } catch(err){
      const e = new Error("offline");
      e.offline = true;
      e.framed = window.self !== window.top;
      throw e;
    }
    const text = await res.text();
    let json = null;
    try { json = text ? JSON.parse(text) : null; } catch(e){}
    if (!res.ok){
      const msg = (json && (json.error_description || json.msg || json.message || json.error))
        || ("HTTP " + res.status);
      const e = new Error(msg); e.status = res.status; e.body = json; throw e;
    }
    return json;
  },

  /* --- auth --- */
  async signIn(email, password){
    const r = await this.call("/auth/v1/token?grant_type=password", {
      method:"POST", auth:false, body:{ email, password }
    });
    this.applySession(r);
    this.cfg.email = email;
    this.saveCfg();
    return r;
  },

  applySession(r){
    this.token = r.access_token;
    this.tokenExp = Date.now() + ((Number(r.expires_in) || 3600) - 60) * 1000;
    this.uid = r.user && r.user.id;
    if (r.refresh_token){ this.cfg.refreshToken = r.refresh_token; this.saveCfg(); }
  },

  async refresh(){
    if (!this.cfg.refreshToken) throw new Error("signed out");
    const r = await this.call("/auth/v1/token?grant_type=refresh_token", {
      method:"POST", auth:false, body:{ refresh_token: this.cfg.refreshToken }
    });
    this.applySession(r);
    return r;
  },

  async ensureToken(){
    if (this.token && Date.now() < this.tokenExp) return;
    await this.refresh();
  },

  signOut(){
    this.token = null; this.tokenExp = 0; this.uid = null; this.baseRev = 0; this.dirty = false;
    this.conflictOpen = false;
    if (this.cfg){ delete this.cfg.refreshToken; this.saveCfg(); }
    this.set("signed-out");
  },

  disconnect(){
    this.cfg = null; this.token = null; this.uid = null; this.baseRev = 0;
    try { localStorage.removeItem(CLOUD_KEY); } catch(e){}
    this.set("off");
  },

  /* --- the row --- */
  async fetchRow(){
    const rows = await this.call("/rest/v1/shops?select=data,rev,device,updated_at&limit=1");
    return (rows && rows[0]) || null;
  },

  /* First write for a brand-new account. */
  async createRow(){
    const row = { owner: this.uid, data: Store.data, rev: 1, device: this.cfg.deviceId };
    const r = await this.call("/rest/v1/shops", {
      method:"POST", headers:{ "Prefer":"return=representation" }, body: row
    });
    this.baseRev = (r && r[0] && r[0].rev) || 1;
    return this.baseRev;
  },

  /* Guarded by rev: the server only accepts the write if nobody moved since
     we last pulled. An empty result means somebody did. */
  async pushGuarded(){
    const next = this.baseRev + 1;
    const r = await this.call(
      `/rest/v1/shops?owner=eq.${encodeURIComponent(this.uid)}&rev=eq.${this.baseRev}`, {
        method:"PATCH", headers:{ "Prefer":"return=representation" },
        body:{ data: Store.data, rev: next, device: this.cfg.deviceId,
               updated_at: new Date().toISOString() }
      });
    if (!r || !r.length) return false;      // somebody else got there first
    this.baseRev = r[0].rev;
    return true;
  },

  /* --- photo storage ---
     A separate API from the database, and a separate failure mode: a photo
     that will not upload is still safe on the device, so this is allowed to
     fail quietly and try again later. */
  PHOTO_BUCKET: "job-photos",

  async uploadPhoto(path, blob){
    await this.ensureToken();
    let res;
    try {
      res = await fetch(
        `${this.base()}/storage/v1/object/${this.PHOTO_BUCKET}/${path}`, {
          method: "POST",
          headers: {
            "apikey": this.cfg.key,
            "Authorization": "Bearer " + this.token,
            "Content-Type": blob.type || "image/jpeg",
            "x-upsert": "true"
          },
          body: blob
        });
    } catch(e){
      const err = new Error("offline"); err.offline = true; throw err;
    }
    if (!res.ok){
      let msg = "HTTP " + res.status;
      try { const j = await res.json(); msg = j.message || j.error || msg; } catch(e){}
      const err = new Error(msg); err.status = res.status; throw err;
    }
    return true;
  },

  /* Short-lived link, for looking at a photo taken on the other device. */
  async signPhoto(path, seconds){
    await this.ensureToken();
    const r = await this.call(
      `/storage/v1/object/sign/${this.PHOTO_BUCKET}/${path}`,
      { method:"POST", body:{ expiresIn: seconds || 600 } });
    const signed = r && (r.signedURL || r.signedUrl);
    if (!signed) throw new Error("no signed url returned");
    return this.base() + "/storage/v1" + (signed.startsWith("/") ? signed : "/" + signed);
  },

  /* A photo somebody attached to the website form. Different bucket from the
     job photos: that one only he can write to, this one the public can post
     into and nobody but him can read. */
  INQUIRY_BUCKET: "inquiry-photos",
  async signInquiryPhoto(path, seconds){
    await this.ensureToken();
    const r = await this.call(
      `/storage/v1/object/sign/${this.INQUIRY_BUCKET}/${String(path).replace(/^\/+/, "")}`,
      { method:"POST", body:{ expiresIn: seconds || 600 } });
    const signed = r && (r.signedURL || r.signedUrl);
    if (!signed) throw new Error("no signed url returned");
    return this.base() + "/storage/v1" + (signed.startsWith("/") ? signed : "/" + signed);
  },

  async deletePhoto(path){
    await this.ensureToken();
    return this.call(`/storage/v1/object/${this.PHOTO_BUCKET}/${path}`, { method:"DELETE" });
  },

  /* Works through what this device still owes, one at a time so a slow
     connection doesn't fire twenty uploads at once. Stops at the first sign
     the network is gone and leaves the rest for next time. */
  photoBusy: false,
  async flushPhotos(){
    if (this.photoBusy) return 0;
    if (!this.configured() || !this.cfg.refreshToken) return 0;
    const queue = Store.pendingPhotos();
    if (!queue.length) return 0;

    this.photoBusy = true;
    let sent = 0;
    try {
      for (const { kind, rec, photo } of queue){
        let blob = null;
        try { blob = await Photos.get(photo.id); } catch(e){}
        if (!blob){
          // nothing on this device to send — it came from the other one
          Store.setPhoto(kind, rec.id, photo.id, { up: true });
          continue;
        }
        try {
          await this.uploadPhoto(photo.path, blob);
          Store.setPhoto(kind, rec.id, photo.id, { up: true, lastError: null });
          sent++;
        } catch(err){
          if (err.offline || err.status === 401) break;   // try again later
          Store.setPhoto(kind, rec.id, photo.id, { lastError: err.message || "upload failed" });
        }
      }
    } finally {
      this.photoBusy = false;
    }
    if (sent){
      this.emit();
      // the waiting marker should disappear while he's looking at it, not
      // the next time the record happens to be reopened
      const host = $("[data-ph-host]");
      if (host){
        const [k, id] = host.dataset.phHost.split(":");
        if (typeof refreshPhotos === "function") refreshPhotos(k, id);
      }
    }
    return sent;
  },

  async pull(opts){
    const force = opts && opts.force;
    await this.ensureToken();
    const row = await this.fetchRow();
    if (!row){ await this.createRow(); return { created:true }; }

    if (this.dirty && !force && row.rev !== this.baseRev)
      return { conflict:true, remote:row };

    Store.adopt(row.data);
    this.baseRev = row.rev;
    this.noteUnsent(false);
    return { pulled:true, rev: row.rev };
  },

  async push(opts){
    const force = opts && opts.force;
    await this.ensureToken();

    if (!this.baseRev){
      const row = await this.fetchRow();
      if (!row){ await this.createRow(); this.noteUnsent(false); return { created:true }; }
      this.baseRev = row.rev;
    }
    if (force){
      const row = await this.fetchRow();
      if (row) this.baseRev = row.rev;
    }

    const ok = await this.pushGuarded();
    if (!ok){
      const row = await this.fetchRow();
      return { conflict:true, remote:row };
    }
    this.noteUnsent(false);
    return { pushed:true, rev: this.baseRev };
  },

  /* Called from Store.save(). Batches a burst of edits into one write. */
  markDirty(){
    if (!this.configured() || !this.cfg.refreshToken) return;
    this.noteUnsent(true);
    clearTimeout(this.pushTimer);
    // An unresolved conflict means baseRev is stale, so a push can only fail
    // the guard and raise the same dialog again. The edit is safe on the
    // device; it goes up the moment he says which copy wins.
    if (this.conflictOpen) return;
    this.pushTimer = setTimeout(() => this.syncNow({ quiet:true }), 2500);
    if (this.state === "synced") this.set("syncing", "saving…");
  },

  async syncNow(opts){
    const quiet = opts && opts.quiet;
    if (!this.configured()) return;
    if (!this.cfg.refreshToken){ this.set("signed-out"); return; }
    if (this.state === "conflict") return;      // wait for the person to choose

    this.set("syncing", quiet ? "saving…" : "syncing…");
    try {
      const r = this.dirty ? await this.push() : await this.pull();
      if (r.conflict){
        this.set("conflict", "changed on another device");
        if (!this.conflictOpen){
          this.conflictOpen = true;
          this.conflictCount = (this.conflictCount || 0) + 1;
          onCloudConflict(r.remote);
        }
        return;
      }
      this.set("synced", "just now");
      // photographs go up behind the record, never in front of it
      this.flushPhotos().then(n => { if (n) this.markDirty(); });
    } catch(err){
      if (err.offline){ this.set("error", "no connection — saved on this device"); return; }
      if (err.status === 401 || /refresh|jwt|token/i.test(err.message || "")){
        this.signOut(); this.set("signed-out", "sign in again"); return;
      }
      this.set("error", err.message || "sync failed");
    } finally {
      /* These read Victor's table and our own link tables, not the shop row.
         They used to sit inside the success branch, so any hiccup on the shop
         — a dropped bar, a failed write — took the website's leads off the
         screen with no word of explanation.

         pullInquiries only ever assigns Cloud.inquiries, so it cannot reach
         the shop and runs either way: the Leads screen stays honest even
         while the conflict question is on screen. The other two are not
         reads — pullSignLinks writes approvals, pullInvoiceLinks writes
         payments, both ending in markDirty. Running either mid-conflict
         would edit one of the two copies he is being asked to choose
         between, and queue a push certain to raise that same question
         again. They wait until he has answered. */
      this.pullInquiries();
      if (!this.conflictOpen){
        this.pullSignLinks();
        this.pullInvoiceLinks();
      }
    }
  },

  /* --- the invoice the customer opens ---
     A web page cannot attach a file to a text or an email, so attaching a
     PDF was always going to mean save, find, attach. This publishes the
     invoice under a token instead and sends a link, which is one tap, and
     puts the pay button on the same page they are reading. */
  async publishInvoiceLink(job){
    await this.ensureToken();
    const st = Store.data.settings;
    const c  = Store.customer(job.customerId) || {};
    const bytes = new Uint8Array(16);
    (window.crypto || window.msCrypto).getRandomValues(bytes);
    const token = Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");

    const days = 90;
    const ttl  = days * 86400;

    /* Photos live in a private bucket the customer has no way into, so mint
       a signed link for each that lasts as long as the invoice link does.
       Nothing in the bucket becomes public; these sit inside a payload that
       needs the token to reach. */
    const labelled = Store.photosOf(job).filter(p => p.tag);
    const shots = [];
    for (const ph of labelled){
      if (!ph.path) continue;
      try { shots.push({ tag: ph.tag, url: await this.signPhoto(ph.path, ttl) }); }
      catch(e){ /* a photo that won't sign is left off rather than failing the invoice */ }
    }

    const signed = Store.signedForJob(job.id).map(w => ({
      title: w.title, who: w.signerName, at: fmtStamp(w.signedAt), signature: w.signature || ""
    }));

    const payload = {
      no: "INV-" + Store.invoiceNoFor(job),
      date: fmtDate(job.invoicedOn || todayStr(), { month:"long", day:"numeric", year:"numeric" }),
      customer: c.name || "", address: c.address || "", city: c.city || "", phone: c.phone ? fmtPhone(c.phone) : "",
      type: job.type, jobNo: job.no,
      when: job.scheduledDate ? fmtDateLong(job.scheduledDate) : "",
      terms: Store.termsLine(job),
      description: job.description || "",
      lines: Store.invoiceLines(job),
      taxLabel: Store.taxRate() ? `GST ${Math.round(Store.taxRate() * 1000) / 10}%` : "",
      tax: Store.taxOn(job),
      total: Store.invoiceTotal(job),
      paid: Number((job.payment || {}).amountPaid) || 0,
      balance: Store.balance(job),
      note: st.invoiceNote || "",
      photos: shots, signed,
      pay: {
        /* Stripe hands back whatever is in client_reference_id when it fires
           its webhook, which is the only way a plain payment link can say
           which invoice was just paid. The token, not the invoice number:
           one is unguessable and the other is INV-1004. */
        stripe: (() => {
          const base = (job.payment && job.payment.url) || st.payStripeUrl || "";
          if (!base) return "";
          return base + (base.includes("?") ? "&" : "?") + "client_reference_id=" + token;
        })(),
        etransfer: st.payEtransfer || "",
        cash: !!st.payCash
      },
      company: {
        name: st.company, phone: st.phone ? fmtPhone(st.phone) : "",
        email: st.email || "", website: st.website || "", address: st.address || "",
        logo: logoDataUrl()
      }
    };

    await this.call("/rest/v1/invoice_links", {
      method:"POST", headers:{ "Prefer":"return=minimal" },
      body: { token, owner: this.uid, job_id: job.id, payload,
              expires_at: new Date(Date.now() + days * 86400000).toISOString() }
    });
    return token;
  },

  invoiceLinks: [],
  async pullInvoiceLinks(){
    if (!this.configured() || !this.cfg.refreshToken) return;
    try {
      const rows = await this.call(
        "/rest/v1/invoice_links?select=token,job_id,viewed_at,view_count," +
        "paid_at,paid_amount,paid_ref,created_at,expires_at");
      this.invoiceLinks = Array.isArray(rows) ? rows : [];

      /* Stripe cannot tell the app anything. A webhook on Supabase can, by
         writing paid_at onto the row — so the same trip that fetches the
         links brings the money news back with it. */
      let landed = 0;
      this.invoiceLinks.forEach(l => {
        if (!l.paid_at) return;
        const j = Store.job(l.job_id);
        if (!j || Store.payState(j) === "paid") return;
        const amount = Number(l.paid_amount) > 0 ? Number(l.paid_amount) : Store.invoiceTotal(j);
        Store.setPayment(j, { status:"paid", amountPaid: amount, method: "Card",
                              ref: l.paid_ref || (j.payment && j.payment.ref) || "" });
        Store.addLog(j, `Paid ${money(amount)} by card — Stripe told us`);
        landed++;
      });
      if (landed){
        this.markDirty();
        toast(landed === 1 ? "An invoice just got paid" : landed + " invoices just got paid", "ok");
        renderQuiet();
      }
    } catch(err){ this.invoiceLinks = []; }
  },

  /* --- estimates signed from a link ---
     One estimate, frozen, published under a long random token. The customer
     opens sign.html with that token and signs. The app never gives them a
     login and they never reach anything else: anon has no rights on the
     table at all, only permission to call two functions that each demand
     the token. */
  async publishSignLink(e){
    await this.ensureToken();
    const st = Store.data.settings;
    const c = Store.estContact(e);
    const bytes = new Uint8Array(16);
    (window.crypto || window.msCrypto).getRandomValues(bytes);
    const token = Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");

    const days = Math.max(7, Number(e.validDays) || 30);
    const sub = Store.estimateTotal(e);
    const tax = Store.estimateTax(e);

    const row = {
      token, owner: this.uid, estimate_id: e.id,
      expires_at: new Date(Date.now() + days * 86400000).toISOString(),
      payload: {
        no: e.no,
        created: fmtStamp(e.createdAt).split(" · ")[0],
        customer: c.name,
        address: [c.address, c.city].filter(Boolean).join(", "),
        description: e.description || "",
        items: (e.items || []).map(i => ({ desc:i.desc, qty:i.qty, price:i.price })),
        taxLabel: Store.taxLabel(),
        tax, total: Store.estimateGross(e),
        validDays: days,
        company: {
          name: st.company, phone: st.phone ? fmtPhone(st.phone) : "",
          email: st.email || "", website: st.website || "", address: st.address || ""
        }
      }
    };
    await this.call("/rest/v1/estimate_links", {
      method:"POST", headers:{ "Prefer":"return=minimal" }, body: row
    });
    return token;
  },

  /* Everything he has out for signature, so the estimate can say where it
     stands and a signature can be brought back in. */
  async fetchSignLinks(){
    await this.ensureToken();
    const rows = await this.call(
      "/rest/v1/estimate_links?select=token,estimate_id,signer_name,signer_role,signature,signed_at,expires_at,created_at");
    return Array.isArray(rows) ? rows : [];
  },

  signLinks: [],
  linkError: "",

  async pullSignLinks(){
    if (!this.configured() || !this.cfg.refreshToken) return;
    try {
      this.signLinks = await this.fetchSignLinks();
      this.linkError = "";
      // Anything signed since last time becomes a real approval on the estimate.
      let landed = 0;
      this.signLinks.forEach(l => {
        if (!l.signed_at || !l.signature) return;
        const e = Store.estimate(l.estimate_id);
        if (!e || e.approval) return;
        Store.signEstimate(e, {
          name: l.signer_name, role: l.signer_role || "",
          signature: l.signature, how: "signed from the link"
        });
        landed++;
      });
      if (landed){
        this.markDirty();
        toast(landed === 1
          ? "An estimate came back signed — the job's on the board"
          : landed + " estimates came back signed — the jobs are on the board", "ok");
        renderQuiet();
      }
    } catch(err){
      this.signLinks = [];
      this.linkError = err.offline ? "offline"
        : (err.status === 404 || /relation|does not exist|schema cache/i.test(err.message || ""))
          ? "no-table" : (err.message || "could not read");
    }
  },

  /* An estimate out for signature is the one thing the app has to notice
     without being touched. Everything else here is driven by something he
     does — a tap, a tab switch, coming back online — but a signature arrives
     from somebody else's phone while he is looking at a screen that has no
     reason to refresh. So a signed estimate sat in the database, correct and
     invisible, until something unrelated happened to trigger a sync.

     While anything is out, look every minute. Once nothing is, stop: there is
     no sense asking a question whose answer cannot have changed. */
  _sigTimer: null,
  watchSignatures(){
    clearInterval(this._sigTimer);
    this._sigTimer = setInterval(() => {
      if (document.visibilityState !== "visible") return;
      if (!this.configured() || !this.cfg.refreshToken) return;
      if (!(this.signLinks || []).some(l => !l.signed_at)) return;
      this.pullSignLinks();
    }, 60000);
  },

  /* --- the website's inquiries ---
     The website writes what people type into public.inquiries, in this same
     Supabase project. So there is no pipe to build: the app is already
     signed in to the database the leads are sitting in.

     The app only ever READS that table. It belongs to the website, and a bug
     in dispatch must not be able to break the thing that takes the calls.
     Which lead has been dealt with is kept in the shop instead, so it syncs
     across his devices without touching a row of Victor's. */
  inquiries: [],
  inqError: "",
  inqLoaded: false,   // false until the first attempt finishes, win or lose

  async pullInquiries(){
    if (!this.configured() || !this.cfg.refreshToken) return;
    try {
      await this.ensureToken();
      // No order parameter: the column names are the website's, not ours, and
      // PostgREST rejects an order on a column that isn't there. Sort locally.
      const rows = await this.call("/rest/v1/inquiries?select=*&limit=500");
      this.inquiries = Array.isArray(rows) ? rows : [];
      this.inqError = "";
      this.inqLoaded = true;
    } catch(err){
      // A missing table or a refused read is not a sync failure — the shop is
      // fine. It gets said on the Leads screen and nowhere else.
      this.inquiries = [];
      this.inqLoaded = true;
      this.inqError = err.offline ? "offline"
        : (err.status === 404 || /relation|does not exist|schema cache/i.test(err.message || ""))
          ? "no-table" : (err.message || "could not read the table");
    }
    this.emit();
  },

  /* Resume a session on open, then catch up. */
  async boot(){
    this.loadCfg();
    if (!this.configured() || !this.cfg.refreshToken) return;
    this.set("syncing", "connecting…");
    try {
      await this.refresh();
      await this.syncNow();
      this.watchSignatures();
    } catch(err){
      if (err.offline) this.set("error", "no connection — saved on this device");
      else { this.signOut(); this.set("signed-out", "sign in again"); }
    }
  }
};

/* ============================================================
   Store — everything lives in one object, saved to localStorage
   ============================================================ */
const Store = {
  data: null,

  load(){
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); }
    catch(e){ console.warn("localStorage unavailable, running in-memory", e); }

    if (raw){
      try {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.jobs)){
          this.data = parsed;
          this.backfill();
          return;
        }
      } catch(e){ console.warn("Saved data was unreadable; starting fresh.", e); }
    }
    this.data = seedData();
    this.backfill();        // a new shop needs the same defaults an old one gets
    this.save();
  },

  /* Everything a shop needs to have, whatever version it was written by and
     wherever it came from — this device, a backup file, or another device.
     Called for a fresh seed too: anything added here after seedData() was
     written would otherwise never exist on a new device. */
  backfill(){
    this.data.techs     = this.data.techs     || [];
    this.data.customers = this.data.customers || [];
    this.data.counter   = this.data.counter   || 1000;
    // Added with estimates — older saved data won't have these.
    this.data.estimates  = this.data.estimates  || [];
    this.data.priceBook  = this.data.priceBook  || seedPriceBook();
    this.data.counterEst = this.data.counterEst || 2000;
    // Added with waivers.
    this.data.waiverTemplates = this.data.waiverTemplates || seedWaiverTemplates();
    this.data.signedWaivers   = this.data.signedWaivers   || [];
    this.data.counterWaiver   = this.data.counterWaiver   || 5000;
    // Added with customer messaging.
    // Added once the business had its own domain and mailbox.
    ["email","website","address","gst"].forEach(k => {
      if (this.data.settings[k] == null) this.data.settings[k] = "";
    });
    // Added with invoicing. GST only ever applies when a number is on file.
    if (this.data.settings.gstRate == null) this.data.settings.gstRate = 5;
    if (this.data.settings.invoiceTerms == null) this.data.settings.invoiceTerms = 15;
    if (this.data.settings.invoiceTermsMode == null)
      this.data.settings.invoiceTermsMode = "days";
    if (this.data.settings.signBase == null) this.data.settings.signBase = "";
    if (this.data.settings.payStripeUrl == null) this.data.settings.payStripeUrl = "";
    if (this.data.settings.payEtransfer == null) this.data.settings.payEtransfer = "";
    if (this.data.settings.payCash == null) this.data.settings.payCash = true;
    if (this.data.settings.signShort == null) this.data.settings.signShort = false;
    if (this.data.settings.invoiceNote == null)
      this.data.settings.invoiceNote = "Thanks very much for the work.";
    this.data.counterInv = this.data.counterInv || 1000;
    this.data.settings.zones    = this.data.settings.zones    || defaultZones();
    this.data.settings.messages = this.data.settings.messages || defaultMessages();
    this.data.customers.forEach(c => { if (!c.zone) c.zone = "city"; });
    // Added with time tracking.
    this.data.jobs.forEach(j => { if (!j.timeEntries) j.timeEntries = []; });
    this.data.jobs.forEach(j => { if (j.materialCost == null) j.materialCost = 0; });
    this.data.estimates.forEach(e => { if (!e.timeEntries) e.timeEntries = []; });
    // Added after a Home Depot run: what to bring, kept off the customer's copy.
    this.data.jobs.forEach(j => { if (!j.materials) j.materials = []; });
    this.data.estimates.forEach(e => { if (!e.materials) e.materials = []; });
    this.data.jobs.forEach(j => { if (!j.photos) j.photos = []; });
    this.data.estimates.forEach(e => { if (!e.photos) e.photos = []; });
    // A demo should always demo. Real work is never moved.
    if (this.data.demo && !this.data.liveSince && this.data.seededOn
        && this.data.seededOn !== todayStr()){
      this.shiftDemoDates(daysBetween(this.data.seededOn, todayStr()));
    }
    // Which website inquiries have been dealt with. Kept here rather than
    // written back to the website's own table, so his devices agree without
    // the app ever writing a row it doesn't own.
    if (!this.data.leadsDone) this.data.leadsDone = {};
    // Leads he took down himself — a phone call, a referral, or a website
    // form that didn't make it. They live here, never in the website's table.
    if (!this.data.manualLeads) this.data.manualLeads = [];

    // Added with payment tracking — older jobs have no payment block.
    this.data.jobs.forEach(j => { if (!j.payment) j.payment = blankPayment(); });
    // Renamed on rebrand. Only a name this app shipped as a default is
    // carried forward — anything the office typed is left alone.
    const SHIPPED_DEFAULTS = ["Park City Plumbing", "Park City Plumbing Inc.",
                              "Poseidon Plumbing and Heating Ltd."];
    if (this.data.settings && SHIPPED_DEFAULTS.includes(this.data.settings.company)){
      this.data.settings.company = "Poseidon Plumbing & Gasfitting Ltd.";
    }
  },

  /* Take a shop handed to us by the cloud. Writes straight through to disk
     without marking the result dirty — it already matches the server. */
  adopt(data){
    if (!data || !Array.isArray(data.jobs)) throw new Error("that doesn't look like a shop");
    this.data = data;
    this.backfill();
    this.saveLocal();
    if (typeof renderQuiet === "function") renderQuiet();
  },

  saveLocal(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); }
    catch(e){
      // Quota or private-mode failure: keep working in memory, but say so once.
      if (!this._warned){ this._warned = true; toast("Couldn't save to this browser — changes are in memory only.", "err"); }
    }
  },

  save(){
    this.saveLocal();
    if (typeof Cloud !== "undefined") Cloud.markDirty();
  },

  reset(){
    this.data = seedData();
    this.save();
  },

  /* Sample data is stamped with the day it was created, so a demo opened a
     month later shows an empty board. Slide the whole sample forward, keeping
     yesterday yesterday and tomorrow tomorrow. Never runs on a live shop. */
  shiftDemoDates(days){
    if (!days) return;
    const ms = days * 86400000;
    const ts = v => (typeof v === "number" && v > 0) ? v + ms : v;
    const stamps = o => { (o.log || []).forEach(l => l.ts = ts(l.ts)); };

    (this.data.jobs || []).forEach(j => {
      if (j.scheduledDate) j.scheduledDate = addDays(j.scheduledDate, days);
      j.createdAt = ts(j.createdAt);
      j.completedAt = ts(j.completedAt);
      if (j.payment){
        j.payment.invoicedAt = ts(j.payment.invoicedAt);
        j.payment.paidAt = ts(j.payment.paidAt);
      }
      stamps(j);
    });
    (this.data.estimates || []).forEach(e => {
      e.createdAt = ts(e.createdAt); e.sentAt = ts(e.sentAt); e.decidedAt = ts(e.decidedAt);
      stamps(e);
    });
    (this.data.signedWaivers || []).forEach(w => { w.signedAt = ts(w.signedAt); });

    this.data.seededOn = todayStr();
    this.save();
  },

  /* For sample data saved before it carried its own date: the day with the
     most jobs on it was "today" when the sample was made. */
  inferredSampleDay(){
    const tally = {};
    (this.data.jobs || []).forEach(j => {
      if (j.scheduledDate) tally[j.scheduledDate] = (tally[j.scheduledDate] || 0) + 1;
    });
    let best = null, n = 0;
    Object.keys(tally).forEach(d => { if (tally[d] > n){ n = tally[d]; best = d; } });
    return best;
  },

  /* Still on the sample, and the sample has drifted into the past. */
  sampleIsStale(){
    if (this.data.liveSince) return false;
    const day = this.data.seededOn || this.inferredSampleDay();
    return !!day && daysBetween(day, todayStr()) > 0;
  },

  /* Going live. Clears the sample shop but keeps the things worth keeping:
     the price book and the waiver templates, both of which are edited, not
     re-typed. Company settings come from the form. */
  goLive(opts){
    const book = this.data.priceBook;
    const templates = this.data.waiverTemplates;
    this.data = {
      version: 3,
      counter: Number(opts.startJobNo) || 1000,
      counterEst: 2000,
      counterWaiver: 5000,
      settings: (() => {
        const keep = Object.assign({}, this.data.settings);
        keep.company   = opts.company;
        keep.phone     = opts.phone;
        keep.laborRate = Number(opts.laborRate) || 0;
        ["email","website","address","gst"].forEach(k => {
          if (opts[k] != null) keep[k] = opts[k];
        });
        keep.zones    = keep.zones    || defaultZones();
        keep.messages = keep.messages || defaultMessages();
        return keep;
      })(),
      techs: opts.techName
        ? [{ id: uid("tech"), name: opts.techName, phone: opts.techPhone || opts.phone,
             color: TECH_COLORS[0], skill: opts.techSkill || "", active: true }]
        : [],
      demo: false,
      customers: [], jobs: [], estimates: [], signedWaivers: [],
      priceBook: book,
      waiverTemplates: templates,
      liveSince: Date.now()
    };
    this.backfill();
    this.save();
  },

  nextJobNo(){
    this.data.counter = (this.data.counter || 1000) + 1;
    return this.data.counter;
  },

  nextEstNo(){
    this.data.counterEst = (this.data.counterEst || 2000) + 1;
    return this.data.counterEst;
  },

  /* --- lookups --- */
  tech(id){ return this.data.techs.find(t => t.id === id) || null; },
  customer(id){ return this.data.customers.find(c => c.id === id) || null; },
  job(id){ return this.data.jobs.find(j => j.id === id) || null; },
  activeTechs(){ return this.data.techs.filter(t => t.active); },
  jobsForCustomer(cid){
    return this.data.jobs.filter(j => j.customerId === cid)
      .sort((a,b) => (b.scheduledDate||"").localeCompare(a.scheduledDate||""));
  },
  estimate(id){ return this.data.estimates.find(e => e.id === id) || null; },
  estimatesForCustomer(cid){
    return this.data.estimates.filter(e => e.customerId === cid)
      .sort((a,b) => b.createdAt - a.createdAt);
  },
  openEstimates(){ return this.data.estimates.filter(e => e.status === "draft" || e.status === "sent"); },

  /* An estimate is quoted either to a saved customer or to a loose contact
     ("lead") that only becomes a customer if the work is approved. */
  estContact(e){
    const c = e.customerId ? this.customer(e.customerId) : null;
    return c || e.lead || { name:"(no contact)", phone:"", email:"", address:"", city:"" };
  },
  estimateTotal(e){
    return (e.items || []).reduce((s,i) => s + (Number(i.qty)||0) * (Number(i.price)||0), 0);
  },

  /* An estimate's tax, worked out the same way an invoice's is. estimateTotal
     stays pre-tax — it is what he earns — and this is what they'll be asked
     for. Three places quote an estimate and they all have to agree. */
  estimateTax(e){
    return Math.round(this.estimateTotal(e) * this.taxRate() * 100) / 100;
  },
  estimateGross(e){
    return Math.round((this.estimateTotal(e) + this.estimateTax(e)) * 100) / 100;
  },
  taxLabel(){
    const r = this.taxRate();
    return r ? `GST ${Math.round(r * 1000) / 10}%` : "";
  },

  addEstLog(e, text){
    e.log = e.log || [];
    e.log.push({ ts: Date.now(), text });
  },

  setEstStatus(e, status){
    if (e.status === status) return;
    const from = EST_STATUS_LABEL[e.status] || e.status;
    e.status = status;
    if (status === "sent" && !e.sentAt) e.sentAt = Date.now();
    if (status === "approved" || status === "declined") e.decidedAt = Date.now();
    this.addEstLog(e, `Status: ${from} → ${EST_STATUS_LABEL[status]}`);
    this.save();
    if (status === "approved") this.jobFromApproved(e);
  },

  /* The customer on an estimate, whether they were already one or are still
     only a name on a lead. Matched on the last ten digits of the phone, the
     same as everything else here. */
  customerFromEstimate(e){
    if (e.customerId) return this.customer(e.customerId);
    const l = e.lead;
    if (!l || !String(l.name || "").trim()) return null;
    const found = this.customerForLead({ phone: l.phone, name: l.name });
    if (found) return found;
    const c = {
      id: uid("cus"), name: l.name, phone: l.phone || "", email: l.email || "",
      address: l.address || "", city: l.city || "Edmonton", zone: "city",
      notes: "", createdAt: Date.now()
    };
    this.data.customers.push(c);
    return c;
  },

  /* Approving is the decision. Scheduling is a different one, made looking
     at the week rather than from memory — so the job turns up unscheduled
     above the board, where he can drop it on a day he can actually see. */
  jobFromApproved(e){
    if (e.jobId) return this.job(e.jobId);
    if (!(e.items || []).length) return null;
    const c = this.customerFromEstimate(e);
    if (!c) return null;
    return this.convertEstimate(e, {
      customerId: c.id, scheduledDate: null, window: "Anytime",
      techId: null, priority: "Normal"
    });
  },

  /* Approved work becomes a real job. Line items and the agreed price carry
     over, so the board shows what was quoted, not a blank job. */
  convertEstimate(e, opts){
    const total = this.estimateTotal(e);
    const job = {
      id: uid("job"), no: this.nextJobNo(), createdAt: Date.now(),
      customerId: opts.customerId,
      type: e.type, priority: opts.priority || "Normal",
      description: e.description,
      scheduledDate: opts.scheduledDate || null,
      window: opts.window || "Anytime",
      techId: null, status: "new", completedAt: null,
      laborHours: 0, laborRate: this.data.settings.laborRate,
      payment: blankPayment(), timeEntries: [],
      parts: (e.items || []).map(i => ({ desc: i.desc, qty: i.qty, price: i.price })),
      // the van list comes with it, unticked items and all
      materials: (e.materials || []).map(m => Object.assign({}, m, { id: uid("mat") })),
      estimateId: e.id, quotedTotal: total,
      log: [{ ts: Date.now(), text: `Created from estimate EST-${e.no} · quoted ${money(total)}` }]
    };
    this.data.jobs.push(job);
    if (opts.techId) this.assign(job, opts.techId);
    else if (job.scheduledDate){ job.status = "scheduled"; this.addLog(job, "Scheduled, awaiting a technician"); }

    e.customerId = opts.customerId;
    e.lead = null;
    e.jobId = job.id;
    if (e.status !== "approved"){
      e.status = "approved";
      e.decidedAt = Date.now();
    }
    this.addEstLog(e, `Job #${job.no} created — waiting to be scheduled`);
    this.save();
    return job;
  },

  deleteEstimate(id){
    this.data.estimates = this.data.estimates.filter(e => e.id !== id);
    this.save();
  },

  /* ----- Time on the job -------------------------------------------------
     Each visit is one entry. A job can have several — quote trip, rough-in,
     come back for the part. An entry with no end is still running. */
  entriesOf(rec){ return (rec && rec.timeEntries) || []; },

  totalMs(rec, now){
    const t = now || Date.now();
    return this.entriesOf(rec).reduce((sum, e) =>
      sum + Math.max(0, (e.endedAt || t) - e.startedAt), 0);
  },

  /* Quote time belongs to the job it turned into, for a true cost. */
  /* What's left after the parts bill — blank means he hasn't told us, so we
     can't deduct anything and the hourly figure reads high. */
  jobNet(job){ return this.jobTotal(job) - (Number(job.materialCost) || 0); },

  /* ---------- Photos ----------
     The record keeps names and sizes only. The picture itself is on the
     device and, once there's a signal, in the project's storage bucket. */
  photosOf(rec){ return (rec && rec.photos) || []; },

  addPhoto(kind, id, meta){
    const rec = this.recordOf(kind, id);
    if (!rec) return null;
    rec.photos = rec.photos || [];
    const p = Object.assign({
      id: uid("ph"), tag: "", caption: "", takenAt: Date.now(),
      up: false, from: kind
    }, meta || {});
    p.path = `${kind}/${rec.id}/${p.id}.jpg`;
    rec.photos.push(p);
    this.logOn(kind, rec, "Photo added");
    this.save();
    return p;
  },

  setPhoto(kind, id, pid, patch){
    const rec = this.recordOf(kind, id);
    if (!rec) return;
    const p = (rec.photos || []).find(x => x.id === pid);
    if (!p) return;
    const hadTag = p.tag || "";
    Object.assign(p, patch);
    if (patch && "tag" in patch && patch.tag !== hadTag){
      this.logOn(kind, rec, patch.tag ? `Photo labelled "${patch.tag}"` : "Photo label removed");
    }
    this.save();
  },

  removePhoto(kind, id, pid){
    const rec = this.recordOf(kind, id);
    if (!rec) return null;
    const p = (rec.photos || []).find(x => x.id === pid);
    rec.photos = (rec.photos || []).filter(x => x.id !== pid);
    this.logOn(kind, rec, "Photo deleted" + (p && p.tag ? ` (${p.tag})` : ""));
    this.save();
    return p;
  },

  findPhoto(pid){
    for (const kind of ["job","estimate"]){
      const list = kind === "job" ? this.data.jobs : this.data.estimates;
      for (const rec of list){
        const p = (rec.photos || []).find(x => x.id === pid);
        if (p) return { kind, rec, photo: p };
      }
    }
    return null;
  },

  /* Everything this device has taken but not yet managed to send. */
  pendingPhotos(){
    const out = [];
    const scan = (kind, list) => list.forEach(rec =>
      (rec.photos || []).forEach(p => { if (!p.up) out.push({ kind, rec, photo: p }); }));
    scan("job", this.data.jobs);
    scan("estimate", this.data.estimates);
    return out;
  },

  /* ---------- Materials ----------
     A running list of what the job needs, private to the shop. Not line
     items: these are what you have to physically have in the van, which is
     a different question from what the customer is charged. The one that
     matters is how many are still needed, because that is what a second
     trip to the supplier costs.

     Named stillNeeded, not outstanding: Store.outstanding() already means
     jobs with money owed, and the two quietly collided. */
  materialsOf(rec){ return (rec && rec.materials) || []; },

  stillNeeded(rec){ return this.materialsOf(rec).filter(m => !m.got).length; },

  addMaterial(kind, id, text, qty){
    const rec = this.recordOf(kind, id);
    if (!rec || !String(text || "").trim()) return null;
    rec.materials = rec.materials || [];
    const m = {
      id: uid("mat"), text: String(text).trim(), qty: Number(qty) || 1,
      got: false, cost: null, from: kind, addedAt: Date.now()
    };
    rec.materials.push(m);
    this.save();
    return m;
  },

  setMaterial(kind, id, mid, patch){
    const rec = this.recordOf(kind, id);
    if (!rec) return;
    const m = (rec.materials || []).find(x => x.id === mid);
    if (!m) return;
    Object.assign(m, patch);
    if (patch.got === true && !m.gotAt) m.gotAt = Date.now();
    if (patch.got === false) m.gotAt = null;
    this.save();
  },

  removeMaterial(kind, id, mid){
    const rec = this.recordOf(kind, id);
    if (!rec) return;
    rec.materials = (rec.materials || []).filter(x => x.id !== mid);
    this.save();
  },

  /* What the list says the parts came to, for anyone who bothered to enter
     costs. Offered to the job's parts-cost box rather than forced into it —
     the supplier's invoice is the real number. */
  materialsCost(rec){
    return this.materialsOf(rec)
      .reduce((s,m) => s + (Number(m.cost) || 0) * (Number(m.qty) || 1), 0);
  },

  /* Everything still to be picked up, across every open job and estimate.
     Standing in the aisle you want one list, not eleven records. */
  pickupList(){
    const out = [];
    const add = (kind, rec, label, sub, when) => {
      const items = this.materialsOf(rec).filter(m => !m.got);
      if (items.length) out.push({ kind, rec, label, sub, when, items });
    };
    this.data.jobs
      .filter(j => isOpen(j))
      .sort((a,b) => (a.scheduledDate || "9999").localeCompare(b.scheduledDate || "9999"))
      .forEach(j => add("job", j, `#${j.no} · ${custName(j.customerId)}`,
                        j.type, j.scheduledDate));
    this.data.estimates
      .filter(e => e.status !== "declined" && !e.jobId)
      .forEach(e => add("estimate", e, `EST-${e.no} · ${this.estContact(e).name}`,
                        e.type, null));
    return out;
  },

  jobTotalMs(job, now){
    let ms = this.totalMs(job, now);
    if (job.estimateId){
      const e = this.estimate(job.estimateId);
      if (e) ms += this.totalMs(e, now);
    }
    return ms;
  },

  /* You can only be in one place, so starting one stops the other. */
  running(){
    for (const j of this.data.jobs){
      const e = this.entriesOf(j).find(x => !x.endedAt);
      if (e) return { kind:"job", rec:j, entry:e };
    }
    for (const q of this.data.estimates){
      const e = this.entriesOf(q).find(x => !x.endedAt);
      if (e) return { kind:"estimate", rec:q, entry:e };
    }
    return null;
  },

  recordOf(kind, id){ return kind === "estimate" ? this.estimate(id) : this.job(id); },

  clockIn(kind, id){
    const rec = this.recordOf(kind, id);
    if (!rec) return null;
    const open = this.running();
    if (open){
      if (open.rec.id === rec.id) return open.entry;      // already running here
      this.clockOut(open.kind, open.rec.id, "Stopped automatically — clocked in elsewhere");
    }
    rec.timeEntries = rec.timeEntries || [];
    const entry = { id: uid("te"), startedAt: Date.now(), endedAt: null, note: "" };
    rec.timeEntries.push(entry);
    this.logOn(kind, rec, "Clocked in on site");
    this.save();
    return entry;
  },

  clockOut(kind, id, why){
    const rec = this.recordOf(kind, id);
    if (!rec) return;
    const entry = this.entriesOf(rec).find(e => !e.endedAt);
    if (!entry) return;
    entry.endedAt = Date.now();
    if (why) entry.note = why;
    this.logOn(kind, rec, `Clocked out — ${fmtDur(entry.endedAt - entry.startedAt)} on site`);
    this.save();
  },

  addEntry(kind, id, startedAt, endedAt, note){
    const rec = this.recordOf(kind, id);
    if (!rec) return;
    rec.timeEntries = rec.timeEntries || [];
    rec.timeEntries.push({ id: uid("te"), startedAt, endedAt, note: note || "" });
    rec.timeEntries.sort((a,b) => a.startedAt - b.startedAt);
    this.logOn(kind, rec, `Time added by hand — ${fmtDur(endedAt - startedAt)}`);
    this.save();
  },

  updateEntry(kind, id, entryId, startedAt, endedAt){
    const rec = this.recordOf(kind, id);
    const e = this.entriesOf(rec).find(x => x.id === entryId);
    if (!e) return;
    e.startedAt = startedAt;
    e.endedAt = endedAt;
    this.logOn(kind, rec, "Time corrected");
    this.save();
  },

  removeEntry(kind, id, entryId){
    const rec = this.recordOf(kind, id);
    if (!rec) return;
    rec.timeEntries = this.entriesOf(rec).filter(x => x.id !== entryId);
    this.logOn(kind, rec, "Time entry removed");
    this.save();
  },

  logOn(kind, rec, text){
    if (kind === "estimate") this.addEstLog(rec, text); else this.addLog(rec, text);
  },

  /* A clock left running overnight is a forgotten clock-out, not a long day. */
  staleRunning(){
    const r = this.running();
    if (!r) return null;
    return (Date.now() - r.entry.startedAt) > 8 * 3600000 ? r : null;
  },

  /* Customer messaging. The app writes the message; the phone sends it, from
     your own number, so a reply comes back to you. */
  /* Texts should sound like a person, not a registry entry. Waivers, tickets
     and estimates keep the full legal name; messages use the trading name. */
  tradeName(){
    const st = this.data.settings;
    if (st.shortName && st.shortName.trim()) return st.shortName.trim();
    return String(st.company || "").replace(/[,\s]+(Ltd|Inc|Corp|Co|LLC|ULC)\.?$/i, "").trim()
        || st.company || "";
  },

  zones(){ return this.data.settings.zones || defaultZones(); },
  zone(id){ return this.zones().find(z => z.id === id) || this.zones()[0]; },
  messages(){ return this.data.settings.messages || defaultMessages(); },
  message(id){ return this.messages().find(m => m.id === id) || this.messages()[0]; },

  /* "today" and "tomorrow" read better in a text than a date does. */
  dayWord(dateStr){
    if (!dateStr) return "your appointment";
    const t = todayStr();
    if (dateStr === t) return "today";
    if (dateStr === addDays(t, 1)) return "tomorrow";
    const d = parseYmd(dateStr);
    return d.toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });
  },

  /* "about 30 minutes" + 30 => "about an hour". The result has to read as a
     time, because the template drops it mid-sentence: "... {{eta}} out." */
  bumpEta(phrase, mins){
    if (!mins) return phrase;
    if (!/\d/.test(phrase)) return `${phrase}, plus about ${mins} minutes`;
    // A range ("20-25 min") needs both ends moved, not just the first.
    const nums = phrase.match(/\d+/g);
    if (nums.length > 1) return phrase.replace(/\d+/g, n => String(Number(n) + mins));
    const total = Number(nums[0]) + mins;
    const friendly = { 60:"an hour", 90:"an hour and a half", 120:"two hours" }[total];
    if (!friendly) return phrase.replace(/\d+/, String(total));
    // Swap the whole "30 minutes" chunk, or just the number if there's no unit.
    const withUnit = /\d+\s*(?:minutes?|mins?)/i;
    return withUnit.test(phrase) ? phrase.replace(withUnit, friendly)
                                 : phrase.replace(/\d+/, friendly);
  },

  messageContext(job, bumpMins){
    const st = this.data.settings;
    const c = job ? this.customer(job.customerId) : null;
    const z = this.zone(c ? c.zone : "city");
    const tech = job && job.techId ? (this.tech(job.techId) || {}).name
               : (this.activeTechs()[0] || {}).name || "";
    const pay = (job && job.payment) || {};
    return {
      first_name: c ? String(c.name).trim().split(/\s+/)[0] : "there",
      tech: tech || st.company,
      company: this.tradeName(),
      phone: st.phone,
      eta: this.bumpEta(z.eta, bumpMins),
      day: this.dayWord(job && job.scheduledDate),
      window: job ? fieldWindow(job.window) : "",
      work: job ? String(job.type).toLowerCase() : "the work",
      pay_link: pay.url ? ` Pay here: ${pay.url}` : ""
    };
  },

  renderMessage(tplId, job, bumpMins){
    const tpl = this.message(tplId);
    const ctx = this.messageContext(job, bumpMins);
    return String(tpl.body)
      .replace(/\{\{(\w+)\}\}/g, (m, k) => (k in ctx ? ctx[k] : m))
      // A value ending in a full stop, butted against the template's own.
      .replace(/([A-Za-z])\.\.(\s|$)/g, "$1.$2")
      .replace(/[ \t]{2,}/g, " ")
      .trim();
  },

  /* Payment tracking. Deliberately manual: Stripe (or whoever) stays the system
     of record, this just indexes it so the office can see what's outstanding. */
  balance(job){
    const left = this.invoiceTotal(job) - (Number(job.payment && job.payment.amountPaid) || 0);
    // To the cent: floating point left $236.16000000000003 sitting in the
    // amount box when he went to take the rest of a part payment.
    return Math.max(0, Math.round(left * 100) / 100);
  },
  payState(job){
    const pay = job.payment || blankPayment();
    if (pay.status === "paid") return "paid";
    if (pay.status === "invoiced" && (Number(pay.amountPaid) || 0) > 0) return "partial";
    return pay.status;
  },
  /* Finished work nobody has billed yet. */
  toInvoice(){
    return this.data.jobs.filter(j => j.status === "complete" &&
      (!j.payment || j.payment.status === "unbilled"));
  },
  /* Billed and still waiting on the money. */
  outstanding(){
    return this.data.jobs.filter(j => j.payment && j.payment.status === "invoiced");
  },
  setPayment(job, fields){
    const prev = job.payment ? job.payment.status : "unbilled";
    job.payment = Object.assign(blankPayment(), job.payment, fields);
    if (job.payment.status === "invoiced" && !job.payment.invoicedAt) job.payment.invoicedAt = Date.now();
    if (job.payment.status === "paid"){
      if (!job.payment.paidAt) job.payment.paidAt = Date.now();
      // Marking paid with no figure entered means paid in full — and in
      // full means the invoice total, tax and all, not the pre-tax figure.
      if (!(Number(job.payment.amountPaid) > 0)) job.payment.amountPaid = this.invoiceTotal(job);
    }
    if (job.payment.status === "unbilled"){ job.payment.invoicedAt = null; job.payment.paidAt = null; }
    if (prev !== job.payment.status){
      this.addLog(job, `Payment: ${PAY_LABEL[prev]} → ${PAY_LABEL[job.payment.status]}`);
    }
    this.save();
  },

  /* Waivers — templates, and the frozen record of what someone actually signed. */
  /* An invoice number is assigned once and then never moves, because it has
     been sent to somebody and may be sitting in their books. */
  invoiceNoFor(job){
    if (!job.invoiceNo){
      this.data.counterInv = (this.data.counterInv || 1000) + 1;
      job.invoiceNo = this.data.counterInv;
      job.invoicedOn = job.invoicedOn || todayStr();
      this.save();
    }
    return job.invoiceNo;
  },

  /* Tax appears only once there is a registration number to print beside it.
     Charging GST without being registered is not a formatting mistake. */
  taxRate(){
    const st = this.data.settings;
    return st.gst ? (Number(st.gstRate) || 0) / 100 : 0;
  },
  taxOn(job){ return Math.round(this.jobTotal(job) * this.taxRate() * 100) / 100; },

  /* What he earns is jobTotal and stays pre-tax, because GST is not revenue
     and Time & Money would lie if it counted. What the customer owes is this. */
  invoiceTotal(job){ return Math.round((this.jobTotal(job) + this.taxOn(job)) * 100) / 100; },

  /* Terms are not always a number of days. For a one-man shop collecting on
     the spot, "due in 15 days" is an invitation to pay in 15 days, which is
     the opposite of what he wants the invoice to say. */
  termsOnCompletion(){
    return (this.data.settings.invoiceTermsMode || "days") === "completion";
  },
  invoiceDue(job){
    if (this.termsOnCompletion()) return null;
    const days = Number(this.data.settings.invoiceTerms);
    if (!days || !job.invoicedOn) return null;
    return addDays(job.invoicedOn, days);
  },
  /* What the invoice says where a due date would go. */
  termsLine(job){
    if (this.termsOnCompletion()) return "Payment due on completion of work";
    const due = this.invoiceDue(job);
    return due ? "Payment due " + fmtDate(due, { month:"long", day:"numeric" }) : "";
  },

  /* Parts and labour as one list. The printed invoice builds this inline;
     the page the customer opens needs the same thing as data. */
  invoiceLines(job){
    const lines = (job.parts || []).map(p => ({
      desc: p.desc || p.name || "", qty: Number(p.qty) || 0, price: Number(p.price) || 0
    })).filter(l => l.desc);
    const hrs = Number(job.laborHours) || 0;
    if (hrs) lines.push({ desc: "Labour", qty: hrs, price: Number(job.laborRate) || 0 });
    return lines;
  },

  /* ---- The invoice list.
     Three states, and he moves work between them: finished work nobody has
     billed, invoices out waiting on money, and invoices paid. Nothing out
     there tells us when the money lands — Stripe takes the payment and
     never reports back — so "paid" is a tap he makes, and the app says so
     rather than pretending to know. */

  /* Finished, worth money, no invoice sent. The money filter matters: a
     completed no-charge callback shouldn't sit in the list forever. */
  invToSend(){
    return this.data.jobs.filter(j => j.status === "complete" &&
      (!j.payment || j.payment.status === "unbilled") && this.jobTotal(j) > 0);
  },
  invPaid(){
    return this.data.jobs.filter(j => j.payment && j.payment.status === "paid");
  },
  /* How long it's been out. Falls back to the timestamp for anything
     invoiced before invoice numbers existed. */
  invDaysOut(job){
    const on = job.invoicedOn ||
      (job.payment && job.payment.invoicedAt ? ymd(new Date(job.payment.invoicedAt)) : null);
    return on ? daysBetween(on, todayStr()) : null;
  },
  invOverdueBy(job){
    const due = this.invoiceDue(job);
    return due ? Math.max(0, daysBetween(due, todayStr())) : 0;
  },
  invOwed(){
    return this.outstanding().reduce((s,j) => s + this.balance(j), 0);
  },
  /* What the badge counts: things waiting on him, not things waiting on a
     customer. An invoice sent last week that isn't due yet needs nothing. */
  invNeedsYou(){
    return this.invToSend().length +
           this.outstanding().filter(j => this.invOverdueBy(j) > 0).length;
  },
  /* The invoice has left his hands. Assigns the number if it hasn't got one,
     stamps the reference so it matches what the customer is looking at, and
     moves it into the waiting-on-money list. */
  markInvoiced(job){
    this.invoiceNoFor(job);
    const pay = job.payment || blankPayment();
    const ref = pay.ref || ("INV-" + job.invoiceNo);
    if (pay.status === "unbilled") this.setPayment(job, { status:"invoiced", ref });
    else if (!pay.ref)             this.setPayment(job, { ref });
  },

  /* An estimate approved on screen, in front of him.
     What they agreed to is frozen onto the approval — the lines and the
     total as they stood at that moment — so editing the estimate afterwards
     can never quietly change what somebody put their name to. Same principle
     as a signed waiver freezing its own wording. */
  signEstimate(e, opts){
    e.approval = {
      name: opts.name,
      role: opts.role || "",
      signature: opts.signature,
      at: Date.now(),
      how: opts.how || "in person",
      total: this.estimateTotal(e),
      gross: this.estimateGross(e),
      items: (e.items || []).map(i => ({ desc:i.desc, qty:i.qty, price:i.price })),
      validDays: e.validDays || 30
    };
    if (e.status !== "approved"){ e.status = "approved"; e.decidedAt = Date.now(); }
    this.addEstLog(e, `Approved on screen by ${opts.name}${opts.how && opts.how !== "in person" ? " (" + opts.how + ")" : ""}`);
    this.save();
    this.jobFromApproved(e);
    return e.approval;
  },
  /* Has it been edited since they signed? A changed total means the paper
     they approved and the estimate on screen no longer agree, and he needs
     to know before he bills it. */
  approvalDrift(e){
    if (!e.approval) return 0;
    return Math.round((this.estimateTotal(e) - e.approval.total) * 100) / 100;
  },

  /* ---- Leads from the website.
     Live rows, not shop data: they are read fresh from the website's table
     each sync and never saved into the shop. Only the fact that one has been
     dealt with is ours to keep. */
  leads(){
    const web = (Cloud.inquiries || []).map(readInquiry).filter(l => l.id);
    const mine = (this.data.manualLeads || []).map(m => Object.assign({
      phone:"", email:"", service:"", what:"", timing:"", address:"",
      photos:[], raw:null
    }, m));
    return web.concat(mine);
  },
  addManualLead(f){
    const lead = {
      id: "man_" + uid("ld"),
      name: f.name, phone: f.phone || "", email: f.email || "",
      service: f.service || "", what: f.what || "", timing: f.timing || "",
      address: f.address || "", source: f.source || "phone call",
      at: new Date().toISOString(), photos: [], raw: null
    };
    this.data.manualLeads.push(lead);
    this.save();
    return lead;
  },
  forgetManualLead(id){
    this.data.manualLeads = (this.data.manualLeads || []).filter(l => l.id !== id);
    delete this.data.leadsDone[String(id)];
    this.save();
  },
  leadsOpen(){
    const done = this.data.leadsDone || {};
    return this.leads().filter(l => !done[l.id]).sort((a,b) => {
      if (a.at && b.at) return String(b.at).localeCompare(String(a.at));
      return (Number(b.id) || 0) - (Number(a.id) || 0);
    });
  },
  leadDone(id, how, recId){
    this.data.leadsDone[String(id)] = { at: Date.now(), how, recId: recId || null };
    this.save();
  },
  leadReopen(id){
    delete this.data.leadsDone[String(id)];
    this.save();
  },
  /* An inquiry is from somebody who may already be a customer. Match on the
     digits of the phone — people type their own number three different ways
     and none of them match a string compare. */
  /* The same number is usually the same person, and matching on it is what
     stops a regular turning into four customer records. But it is not always
     the same person: a couple, an office line, a landlord and their tenant
     all share a number. Two people sharing a line is commoner than one
     customer changing their name, so a number that matches while the name
     plainly disagrees is somebody new — not a rename. Filing their job under
     the other person's name is how work ends up on the wrong customer. */
  customerForLead(lead){
    const tenDigits = v => String(v || "").replace(/\D/g, "").slice(-10);
    const norm = v => String(v || "").trim().toLowerCase().replace(/\s+/g, " ");
    const d = tenDigits(lead.phone), n = norm(lead.name);

    // "Bob" and "Bob Down" are one man; "Bob Down" and "Daryl" are two.
    const agrees = a => !a || !n || a === n ||
                        a.startsWith(n + " ") || n.startsWith(a + " ");

    if (d.length === 10){
      const sameNumber = this.data.customers.filter(c => tenDigits(c.phone) === d);
      const both = sameNumber.find(c => agrees(norm(c.name)));
      if (both) return both;
      if (sameNumber.length && !n) return sameNumber[0];   // no name to go on
    }
    return n ? this.data.customers.find(c => norm(c.name) === n) || null : null;
  },
  customerFromLead(lead){
    const found = this.customerForLead(lead);
    if (found) return found;
    const c = {
      id: uid("cus"), name: lead.name, phone: lead.phone, email: lead.email,
      address: lead.address, city: "Edmonton", zone: "city",
      notes: lead.timing ? `Said they're free: ${lead.timing}` : "",
      createdAt: Date.now()
    };
    this.data.customers.push(c);
    return c;
  },
  /* Unscheduled on purpose. The lead said roughly when they're free; he
     picks the actual slot, which is the whole point of not automating it. */
  jobFromLead(lead){
    const c = this.customerFromLead(lead);
    const j = {
      id: uid("job"), no: this.nextJobNo(), createdAt: Date.now(),
      customerId: c.id,
      type: this.leadJobType(lead),
      priority: "Normal",
      description: this.leadStory(lead),
      scheduledDate: null, window: "Anytime",
      techId: null, status: "new", completedAt: null,
      laborHours: 0, laborRate: this.data.settings.laborRate,
      parts: [], payment: blankPayment(), timeEntries: [],
      fromLead: lead.id,
      log: [{ ts: Date.now(), text: `From a ${lead.source} inquiry`
              + (lead.photos.length ? ` · ${lead.photos.length} photo${lead.photos.length===1?"":"s"} they sent` : "") }]
    };
    this.data.jobs.push(j);
    this.leadDone(lead.id, "job", j.id);
    return j;
  },
  estimateFromLead(lead){
    const found = this.customerForLead(lead);
    const e = {
      id: uid("est"), no: this.nextEstNo(),
      customerId: found ? found.id : null,
      lead: found ? null : { name: lead.name, phone: lead.phone, email: lead.email,
                             address: lead.address, city: "Edmonton" },
      type: this.leadJobType(lead), status: "draft",
      description: this.leadStory(lead),
      validDays: 30, createdAt: Date.now(), sentAt: null, decidedAt: null, jobId: null,
      items: [], materials: [], fromLead: lead.id,
      log: [{ ts: Date.now(), text: `From a ${lead.source} inquiry`
              + (lead.photos.length ? ` · ${lead.photos.length} photo${lead.photos.length===1?"":"s"} they sent` : "") }]
    };
    this.data.estimates.push(e);
    this.leadDone(lead.id, "estimate", e.id);
    return e;
  },
  /* Their words first, then what the form called it. He reads this on the
     doorstep, so it keeps what they actually said. */
  leadStory(lead){
    const bits = [];
    if (lead.what) bits.push(lead.what);
    if (lead.timing) bits.push(`They said they're free: ${lead.timing}.`);
    if (!bits.length) bits.push(lead.service || "Website inquiry — no detail given.");
    return bits.join("\n\n");
  },
  /* The form's own service wording rarely matches a job type exactly. Take
     the closest one we have and leave it editable rather than guessing hard. */
  leadJobType(lead){
    const want = String(lead.service || "").toLowerCase();
    if (!want) return JOB_TYPES[0];
    const exact = JOB_TYPES.find(t => t.toLowerCase() === want);
    if (exact) return exact;
    const near = JOB_TYPES.find(t => want.includes(t.toLowerCase()) || t.toLowerCase().includes(want));
    return near || JOB_TYPES[0];
  },

  nextWaiverNo(){
    this.data.counterWaiver = (this.data.counterWaiver || 5000) + 1;
    return this.data.counterWaiver;
  },
  waiverTemplate(id){ return this.data.waiverTemplates.find(w => w.id === id) || null; },
  templateByKey(key){ return this.data.waiverTemplates.find(w => w.key === key && !w.archived) || null; },
  activeTemplates(){ return this.data.waiverTemplates.filter(w => !w.archived); },
  signedWaiver(id){ return this.data.signedWaivers.find(w => w.id === id) || null; },
  signedForJob(jobId){ return this.data.signedWaivers.filter(w => w.jobId === jobId); },
  signedForCustomer(cid){
    return this.data.signedWaivers.filter(w => w.customerId === cid)
      .sort((a,b) => b.signedAt - a.signedAt);
  },

  /* Values a waiver body can merge in. */
  waiverContext(job){
    const st = this.data.settings;
    const c = job ? this.customer(job.customerId) : null;
    return {
      company: st.company,
      company_phone: st.phone,
      company_email: st.email || "",
      customer_name: c ? c.name : "",
      service_address: c ? [c.address, c.city].filter(Boolean).join(", ") : "",
      job_number: job ? "#" + job.no : "",
      job_type: job ? job.type : "",
      job_description: job ? job.description : "",
      tech_name: job && job.techId ? (this.tech(job.techId) || {}).name || "" : "",
      date: fmtDateLong(todayStr())
    };
  },
  applyMerge(text, ctx){
    return String(text || "").replace(/\{\{(\w+)\}\}/g, (m, k) =>
      ctx[k] != null && ctx[k] !== "" ? ctx[k] : m);
  },

  /* Which templates this job would normally want, and which are still missing. */
  recommendedFor(job){
    const keys = JOB_TYPE_WAIVERS[job.type] || [];
    return keys.map(k => this.templateByKey(k)).filter(Boolean);
  },
  missingFor(job){
    const have = new Set(this.signedForJob(job.id).map(w => w.templateKey));
    return this.recommendedFor(job).filter(t => !have.has(t.key));
  },

  /* A signed waiver freezes its own text — editing the template later must
     never change what someone already put their name to. */
  signWaiver(tpl, opts){
    const ctx = this.waiverContext(opts.job);
    const rec = {
      id: uid("sw"), no: this.nextWaiverNo(),
      templateId: tpl.id, templateKey: tpl.key || null, title: tpl.title,
      category: tpl.category,
      jobId: opts.job ? opts.job.id : null,
      customerId: opts.job ? opts.job.customerId : (opts.customerId || null),
      body: tpl.body.map(pp => this.applyMerge(pp, ctx)),
      acks: tpl.acks.map(a => this.applyMerge(a, ctx)),
      fillIns: opts.fillIns || "",
      signerName: opts.signerName,
      signerRole: opts.signerRole,
      signature: opts.signature || null,
      techId: opts.job ? opts.job.techId : null,
      contextSnapshot: ctx,
      signedAt: Date.now()
    };
    this.data.signedWaivers.push(rec);
    if (opts.job){
      this.addLog(opts.job, `Waiver signed: ${tpl.title} (by ${opts.signerName})`);
    }
    this.save();
    return rec;
  },
  deleteSignedWaiver(id){
    this.data.signedWaivers = this.data.signedWaivers.filter(w => w.id !== id);
    this.save();
  },

  /* Price book — the reusable list estimates are built from. */
  addPriceItem(item){
    const it = Object.assign({ id: uid("pb") }, item);
    this.data.priceBook.push(it);
    this.save();
    return it;
  },
  priceItem(id){ return this.data.priceBook.find(i => i.id === id) || null; },
  deletePriceItem(id){
    this.data.priceBook = this.data.priceBook.filter(i => i.id !== id);
    this.save();
  },

  /* --- mutations --- */
  addLog(job, text){
    job.log = job.log || [];
    job.log.push({ ts: Date.now(), text });
  },

  setStatus(job, status){
    if (job.status === status) return;
    const from = STATUS_LABEL[job.status] || job.status;
    job.status = status;
    if (status === "complete" && !job.completedAt) job.completedAt = Date.now();
    if (status !== "complete") job.completedAt = null;
    this.addLog(job, `Status: ${from} → ${STATUS_LABEL[status]}`);
    this.save();
  },

  assign(job, techId){
    const prev = job.techId;
    if (prev === techId) return;
    job.techId = techId || null;
    const name = techId ? (this.tech(techId)?.name || "Unknown") : null;
    this.addLog(job, name ? `Assigned to ${name}` : "Unassigned");
    // Assigning a brand-new job is what actually schedules it.
    if (techId && job.status === "new" && job.scheduledDate) job.status = "scheduled";
    if (!techId && job.status === "scheduled") job.status = "new";
    this.save();
  },

  setDate(job, dateStr){
    const prev = job.scheduledDate;
    if (prev === dateStr) return;
    job.scheduledDate = dateStr || null;
    this.addLog(job, dateStr
      ? `Moved to ${fmtDate(dateStr, { weekday:"long", month:"long", day:"numeric" })}`
      : "Taken off the schedule");
    if (dateStr && job.status === "new" && job.techId) job.status = "scheduled";
    if (!dateStr && job.status === "scheduled") job.status = "new";
    this.save();
  },

  deleteJob(id){
    this.data.jobs = this.data.jobs.filter(j => j.id !== id);
    this.save();
  },

  jobTotal(job){
    const parts = (job.parts || []).reduce((s,p) => s + (Number(p.qty)||0) * (Number(p.price)||0), 0);
    const labor = (Number(job.laborHours)||0) * (Number(job.laborRate)|| this.data.settings.laborRate || 0);
    return parts + labor;
  }
};

/* Drag the handle down to dismiss. The handle looked draggable long before
   it was, which is worse than not having one. */
function wireSheetDrag(sheet){
  const inner = sheet.querySelector(".sheet");
  const grab = sheet.querySelector(".grabzone");
  if (!inner || !grab) return;
  let startY = null, dy = 0;

  const move = e => {
    if (startY === null) return;
    dy = Math.max(0, e.clientY - startY);
    inner.style.transform = `translateY(${dy}px)`;
  };
  const end = () => {
    if (startY === null) return;
    startY = null;
    inner.classList.add("settling");
    // a drag that ends also fires a click; the handle is a close button, so
    // without this a short drag would spring back and then close anyway
    if (dy > 4){
      grab.addEventListener("click", ev => {
        ev.stopPropagation(); ev.preventDefault();
      }, { capture:true, once:true });
    }
    if (dy > 70){ closeNavSheet(); }
    else { inner.style.transform = "translateY(0)"; }
    setTimeout(() => inner.classList.remove("settling"), 220);
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", end);
    window.removeEventListener("pointercancel", end);
  };

  grab.addEventListener("pointerdown", e => {
    startY = e.clientY; dy = 0;
    inner.classList.remove("settling");
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", end);
    window.addEventListener("pointercancel", end);
    e.preventDefault();
  });
}

/* Where you were, kept across a restart.

   iOS will throw a home-screen web app out of memory while the camera is
   open and reload it when you come back, which dumped you on Today with
   the job you were working on closed. Nothing can stop the reload; this
   makes it land you back where you were instead. */
const PLACE_KEY = "pcp.place.v1";

function rememberPlace(modal){
  try {
    localStorage.setItem(PLACE_KEY, JSON.stringify({
      view: App.view, date: App.date, modal: modal || null, at: Date.now()
    }));
  } catch(e){}
}

function forgetPlaceModal(){
  try {
    const p = JSON.parse(localStorage.getItem(PLACE_KEY) || "null");
    if (p){ p.modal = null; localStorage.setItem(PLACE_KEY, JSON.stringify(p)); }
  } catch(e){}
}

function restorePlace(){
  let p = null;
  try { p = JSON.parse(localStorage.getItem(PLACE_KEY) || "null"); } catch(e){}
  if (!p) return false;
  // half an hour is long enough to cover a camera trip, short enough that
  // opening the app tomorrow starts on Today like it should
  if (!p.at || Date.now() - p.at > 30*60*1000) return false;

  if (p.view && VIEWS.some(v => v.id === p.view)) App.view = p.view;
  if (p.date) App.date = p.date;
  render();

  if (p.modal && p.modal.id){
    const open = p.modal.kind === "estimate" ? openEstimate : openJob;
    if (Store.recordOf(p.modal.kind, p.modal.id)) setTimeout(() => open(p.modal.id), 0);
  }
  return true;
}

function go(view){
  App.view = view;
  rememberPlace(null);
  render();
  window.scrollTo(0,0);
}

  renderBrand();
  renderClockBar();

  const v = VIEWS.find(x => x.id === App.view) || VIEWS[0];
  $("#crumb").textContent = v.crumb;
  $("#page-title").textContent = v.label;

  const host = $("#view");
  if (App.search.trim()) { host.innerHTML = viewSearch(); }
  else {
    switch(App.view){
      case "schedule":  host.innerHTML = viewSchedule();  break;
      case "today":     host.innerHTML = viewToday();     break;
      case "leads":     host.innerHTML = viewLeads();     break;
      case "estimates": host.innerHTML = viewEstimates(); break;
      case "timemoney": host.innerHTML = viewTimeMoney(); break;
      case "pickup":    host.innerHTML = viewPickup(); break;
      case "waivers":   host.innerHTML = viewWaivers();   break;
      case "pricebook": host.innerHTML = viewPriceBook(); break;
      case "jobs":      host.innerHTML = viewJobs();      break;
      case "invoices":  host.innerHTML = viewInvoices();  break;
      case "customers": host.innerHTML = viewCustomers(); break;
      case "techs":     host.innerHTML = viewTechs();     break;
      case "data":      host.innerHTML = viewData();      break;

}
