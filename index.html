  /* Poseidon — deep sea navy, marine blue, and brass for the accent.
     Brand colours are --navy / --blue / --gold. Red, green and amber are
     reserved for meaning (emergency, complete, needs attention) and are
     never used for branding, so a red badge always means the same thing. */
  --navy:#0a2a42; --navy-2:#10405f;
  --blue:#1668ab; --blue-soft:#e7f0f8;
  --gold:#e8b931; --gold-deep:#8d6a10; --gold-soft:#fdf4dc;
  --amber:#c4701a; --amber-soft:#fcefe2;
  --bg:#f3f6f9; --card:#fff; --line:#e1e7ed;
  --text:#16222e; --muted:#6b7c8c; --muted-2:#93a2b0;
  --green:#1f8a4c; --green-soft:#e6f4ec;
  --red:#c0392b; --red-soft:#fbeae8;
  --purple:#5b4bb5; --purple-soft:#eeecfa;
  --radius:8px;
  --shadow:0 1px 2px rgba(16,36,56,.06),0 2px 8px rgba(16,36,56,.05);
}
*{box-sizing:border-box}
/* min-height, not height: with height:100% the body stays exactly one
   viewport tall no matter how long the page is, which is invisible in a
   normal tab but makes an embedding frame measure the page short and clip
   everything below the fold. */
html,body{min-height:100%}
body{
  margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;min-height:100dvh}
#sidebar{
  width:216px;flex:0 0 216px;background:var(--navy);color:#cfdcea;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .mark{display:flex;align-items:center;gap:9px}
.brand .logo{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;
  background:var(--logo) center/cover no-repeat;
  box-shadow:0 0 0 1px rgba(255,255,255,.14), 0 1px 4px rgba(0,0,0,.35);
}
.brand .name{color:#fff;font-weight:700;font-size:14px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.brand .sub{font-size:11px;color:#8aa6bd;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
nav{padding:10px 10px;flex:1;overflow:auto}
nav .nav-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#6e8aa3;padding:12px 8px 6px}
nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;color:#cfdcea;padding:8px 10px;border-radius:6px;
  font-size:13.5px;margin-bottom:1px;
}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button.active{background:var(--blue);color:#fff;font-weight:600}
nav button .ico{width:18px;text-align:center;font-size:14px;opacity:.95}
nav button .count{
  margin-left:auto;background:rgba(255,255,255,.14);color:#fff;font-size:11px;
  padding:1px 6px;border-radius:9px;font-weight:600;
}
nav button.active .count{background:rgba(255,255,255,.25)}
nav button .count.alert{background:var(--amber);color:#fff}
.sidebar-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#6f8ca6}
.sync{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px}
.sync .d{width:7px;height:7px;border-radius:50%;background:#6f8ca6;flex:0 0 7px}
.sync.synced .d{background:var(--green)}
.sync.syncing .d{background:var(--gold);animation:blip 1.1s ease-in-out infinite}
.sync.error .d,.sync.conflict .d{background:var(--amber)}
.sync.signed-out .d{background:var(--muted-2)}
.sync.conflict{color:var(--gold)}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.sync.syncing .d{animation:none}}
.cloud-state{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:12px}
.cloud-state .d{width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:var(--muted-2)}
.cloud-state.synced .d{background:var(--green)} .cloud-state.synced{color:var(--green)}
.cloud-state.error .d,.cloud-state.conflict .d{background:var(--amber)}
.cloud-state.error,.cloud-state.conflict{color:#9c5712}

#main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- Phone layout ---------- */
#mobile-nav{display:none}
.nav-sheet{display:none}
.nav-sheet.open{
  display:flex;position:fixed;inset:0;z-index:70;background:rgba(10,42,66,.5);
  align-items:flex-end;
  /* without this a drag on the sheet scrolls the page underneath it */
  overscroll-behavior:contain;touch-action:none;
}
.nav-sheet .sheet{
  background:#fff;width:100%;border-radius:14px 14px 0 0;padding:10px 10px
  calc(14px + env(safe-area-inset-bottom,0px));max-height:76vh;overflow:auto;
  overscroll-behavior:contain;touch-action:pan-y;
  will-change:transform;
}
.nav-sheet .sheet.settling{transition:transform .2s ease-out}
@media (prefers-reduced-motion:reduce){.nav-sheet .sheet.settling{transition:none}}
.nav-sheet .sheet h4{
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  padding:12px 12px 6px;margin:0;
}
.nav-sheet .sheet button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;
  border:0;padding:13px 12px;border-radius:9px;font-size:15px;color:var(--text);
}
.nav-sheet .sheet button:hover{background:var(--bg)}
.nav-sheet .sheet button .ico{width:22px;text-align:center;font-size:17px}
.nav-sheet .grabzone{
  padding:10px 0 8px;margin:-10px -10px 0;cursor:grab;touch-action:none;
  display:block;width:calc(100% + 20px);border:0;background:none;
}
.nav-sheet .grabzone:active{cursor:grabbing}
.nav-sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}

/* ---------- Today: the field view ---------- */
.today-head{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px;
}
.today-head .big{font-size:21px;font-weight:700;letter-spacing:-.01em}
.today-head .sub{color:var(--muted);font-size:14px}
.today-sum{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;
}
.today-sum .pill{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:6px 13px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;
}
.today-sum .pill b{font-variant-numeric:tabular-nums}
.today-sum .pill.cash{border-color:#bfe0cc;background:var(--green-soft);color:var(--green)}
.today-sum .pill.warn{border-color:#f0d6bb;background:var(--amber-soft);color:#9c5712}

.stop{
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden;
  border-left:4px solid var(--blue);
}
.stop.pri-Emergency{border-left-color:var(--red)}
.stop.pri-High{border-left-color:var(--amber)}
.stop.st-complete{border-left-color:var(--green);opacity:.75}
.waiting.lead-wait{border-color:#d6d1f5;background:var(--purple-soft);color:#43389b}
.stop.lead-card{border-left-color:var(--purple)}
.stop.lead-done{border-left-color:var(--green);opacity:.72}
.lead-body{padding:0 14px 10px}
.lead-shots{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px}
.lead-shots .ls{
  width:84px;height:84px;border-radius:8px;border:1px solid var(--line);
  background:var(--sunk,#f3f6f9) center/cover no-repeat;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--muted-2);font-size:18px;
}
.lead-shots .ls.on{cursor:zoom-in;border-color:#c6d2de}
.lead-shots .ls.bad{color:var(--red)}
.lead-said{
  margin:0 0 9px;padding:10px 12px;background:var(--sunk,#f3f6f9);border-radius:8px;
  font-size:14px;line-height:1.5;white-space:pre-wrap;
}
.lead-row{display:flex;gap:10px;font-size:13.5px;padding:3px 0}
.lead-row .k{color:var(--muted);min-width:52px}
.lead-row .v{font-weight:550;overflow-wrap:anywhere}
.stop.inv-tosend{border-left-color:var(--gold)}
.stop.inv-out{border-left-color:var(--blue)}
.stop.inv-late{border-left-color:var(--red)}
.stop.inv-paid{border-left-color:var(--green);opacity:.8}
.stop.st-cancelled{opacity:.5}
.stop-main{display:flex;gap:12px;padding:13px 14px;cursor:pointer;align-items:flex-start}
.stop-main:hover{background:#fafcfd}
.stop-when{
  flex:0 0 62px;text-align:center;padding-top:1px;
}
.stop-when .w{font-size:14px;font-weight:700;color:var(--navy);line-height:1.2;letter-spacing:-.01em}
.stop-when .n{font-size:10.5px;color:var(--muted);margin-top:2px}
.stop-body{flex:1;min-width:0}
.stop-body .cust{font-weight:650;font-size:15.5px;line-height:1.25}
.stop-body .addr{font-size:13.5px;color:var(--muted);margin-top:2px}
.stop-body .what{font-size:13.5px;margin-top:5px}
.stop-body .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stop-acts{
  display:flex;gap:7px;padding:0 14px 12px;flex-wrap:wrap;
}
.stop-acts .btn{flex:1;min-width:92px;justify-content:center;padding:10px 10px}
.stop-acts a.btn{text-decoration:none}
.stop-flag{
  font-size:12.5px;padding:7px 14px;background:var(--amber-soft);color:#9c5712;
  border-top:1px solid #f0d6bb;font-weight:550;
}
.msg-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.msg-tabs button{
  border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 14px;
  font-size:13px;font-weight:600;color:var(--muted);
}
.msg-tabs button:hover{border-color:#c6d2de;color:var(--text)}
.msg-tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.msg-prev{
  width:100%;border:1px solid #d5dde5;border-radius:9px;padding:13px 14px;
  font:15px/1.55 inherit;background:#fff;resize:vertical;min-height:112px;color:var(--text);
}
.msg-prev:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,104,171,.12);outline:none}
.msg-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted-2);margin-top:5px}
.msg-eta{
  display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:14px 0;
  padding:12px 13px;background:var(--sunk,#f3f6f9);border:1px solid var(--line);border-radius:9px;
}
.msg-eta .lab{font-size:12.5px;font-weight:600;color:#455565;margin-right:2px}
@media (max-width:560px){
  .msg-eta{gap:6px}
  .msg-eta .lab{flex-basis:100%;margin:0}
  .msg-eta button{flex:1;min-width:0}
  .msg-eta .zone-chip{flex-basis:100%}
}
.msg-eta button{
  border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;
  font-size:13px;font-weight:600;color:var(--muted);
}
.msg-eta button.on{background:var(--amber);border-color:var(--amber);color:#fff}
.msg-send{display:flex;gap:9px;flex-wrap:wrap}
.msg-send .btn{flex:1;min-width:120px;justify-content:center;padding:12px 10px;text-decoration:none}
.zone-chip{
  display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;
  background:var(--blue-soft);color:#105585;
}
/* Running-clock bar. Sticks to the top of every screen so a forgotten
   clock-out is impossible to miss. */
#clockbar{
  display:none;position:sticky;top:0;z-index:55;
  background:var(--green);color:#fff;padding:9px 14px;
  align-items:center;gap:11px;font-size:14px;box-shadow:0 2px 8px rgba(16,36,56,.18);
}
#clockbar.on{display:flex}
#clockbar.stale{background:var(--amber)}
#clockbar .pulse{
  width:9px;height:9px;border-radius:50%;background:#fff;flex:0 0 9px;
  animation:beat 1.6s ease-in-out infinite;
}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#clockbar .pulse{animation:none}}
#clockbar .who{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#clockbar .el{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
#clockbar button{
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);color:#fff;
  border-radius:7px;padding:7px 13px;font-weight:650;font-size:13.5px;white-space:nowrap;
}
#clockbar button:hover{background:rgba(255,255,255,.3)}

.clock-btn{width:100%;justify-content:center;padding:12px 10px;font-size:15px}
.clock-on{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important}
.time-row{
  display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef2f6;font-size:13.5px;
}
.time-row:last-child{border-bottom:0}
.time-row .when{color:var(--muted);min-width:148px}
.time-row .dur{margin-left:auto;font-weight:650;font-variant-numeric:tabular-nums}
.time-row.live .dur{color:var(--green)}
.time-sum{
  display:flex;align-items:baseline;gap:10px;padding:11px 0 0;margin-top:4px;
  border-top:2px solid var(--line);font-weight:700;
}
.time-sum .n{margin-left:auto;font-variant-numeric:tabular-nums}
.rate-good{color:var(--green)} .rate-thin{color:var(--amber)} .rate-bad{color:var(--red)}
.today-empty{
  background:var(--card);border:1px dashed var(--line);border-radius:11px;
  padding:34px 20px;text-align:center;color:var(--muted);
}
.today-empty .big{font-size:30px;opacity:.5;margin-bottom:9px}
.sec-head{
  font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  font-weight:650;margin:22px 0 9px;
}
header.topbar{
  background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:19px}
.topbar .crumb{font-size:12px;color:var(--muted);margin-bottom:1px}
.topbar .spacer{flex:1}
.search{position:relative}
.search input{
  width:250px;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:6px;
  background:var(--bg);outline:none;
}
.search input:focus{border-color:var(--blue);background:#fff}
.search .si{position:absolute;left:9px;top:7px;color:var(--muted-2);font-size:13px}
main.content{padding:22px 24px 60px;flex:1}

/* ---------- Buttons ---------- */
.btn{
  border:1px solid var(--line);background:#fff;color:var(--text);
  padding:8px 13px;border-radius:6px;font-size:13.5px;font-weight:550;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{background:#f7f9fb;border-color:#cfd8e1}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#12558f;border-color:#12558f}
/* Brass on navy text — gold is too light to carry white legibly. */
.btn.accent{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:650}
.btn.accent:hover{background:#d9a81f;border-color:#d9a81f}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:#eef2f6;color:var(--text)}
.btn.danger{color:var(--red);border-color:#f0d4d0}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Cards / layout ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{
  padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
}
.card-head h3{font-size:14.5px}
.card-head .spacer{flex:1}
.card-body{padding:16px}
.grid{display:grid;gap:16px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .value{font-size:27px;font-weight:700;margin-top:5px;letter-spacing:-.02em}
.stat .foot{font-size:12px;color:var(--muted);margin-top:2px}
.stat.alert{border-color:#f3c9a8;background:linear-gradient(180deg,#fff9f3,#fff)}
.stat.alert .value{color:var(--amber)}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;margin:26px 0 10px}
.two-col{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:1080px){.two-col{grid-template-columns:minmax(0,1fr)}}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:650;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafcfd;white-space:nowrap;
}
td{padding:11px 12px;border-bottom:1px solid #eef2f6;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:#f7fafc}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.t-strong{font-weight:600}
.t-sub{font-size:12px;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:26px;opacity:.5;margin-bottom:8px}

/* ---------- Badges ---------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 8px;border-radius:20px;white-space:nowrap;line-height:1.4;
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{background:#eef2f6;color:#54687a}
.s-scheduled{background:var(--blue-soft);color:#105585}
.s-dispatched{background:var(--purple-soft);color:var(--purple)}
.s-in_progress{background:var(--amber-soft);color:#9c5712}
.s-complete{background:var(--green-soft);color:var(--green)}
.s-cancelled{background:#f0f2f4;color:#8b98a4;text-decoration:line-through}
.p-Emergency{background:var(--red-soft);color:var(--red)}
.p-High{background:var(--amber-soft);color:#9c5712}
.p-Normal{background:#eef2f6;color:#54687a}
.p-Low{background:#eef2f6;color:#8b98a4}
.e-draft{background:#eef2f6;color:#54687a}
.e-sent{background:var(--amber-soft);color:#9c5712}
.e-approved{background:var(--green-soft);color:var(--green)}
.e-declined{background:var(--red-soft);color:var(--red)}
.money-lg{font-size:19px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.linkish{color:var(--blue);cursor:pointer;font-weight:600}
.linkish:hover{text-decoration:underline}
.sigpad-wrap{border:1px solid #d5dde5;border-radius:7px;background:#fff;position:relative;overflow:hidden}
.sigpad-wrap.filled{border-color:var(--green)}
#sigpad{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair}
.sigpad-line{position:absolute;left:24px;right:24px;bottom:34px;border-bottom:1px solid #cfd8e1;pointer-events:none}
.sigpad-hint{position:absolute;left:24px;bottom:14px;font-size:11.5px;color:var(--muted-2);pointer-events:none}
.waiver-body p{margin:0 0 10px;line-height:1.6}
.waiver-body p:last-child{margin-bottom:0}
.ack-list{list-style:none;margin:0;padding:0}
.ack-list li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f2f5f8}
.ack-list li:last-child{border-bottom:0}
.ack-list input{margin-top:3px;flex:0 0 auto;width:15px;height:15px}
.ack-list label{font-size:13px;line-height:1.5;cursor:pointer}
.legal-note{
  border:1px solid #f0d9b8;background:#fdf7ee;border-radius:7px;padding:12px 14px;
  font-size:12.5px;line-height:1.6;color:#7a5a25;margin-bottom:16px;
}
.legal-note strong{color:#5e441a}
.pay-unbilled{background:#eef2f6;color:#54687a}
.pay-invoiced{background:var(--amber-soft);color:#9c5712}
.pay-paid{background:var(--green-soft);color:var(--green)}
.pay-partial{background:var(--amber-soft);color:#9c5712}
.money-row{display:flex;align-items:baseline;gap:10px;padding:9px 16px;border-bottom:1px solid #f2f5f8}
.money-row .mr-label{font-size:12.5px;color:var(--muted)}
.money-row .mr-val{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:650}
.tpl-card{border:1px solid var(--line);border-radius:8px;background:#fff;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.tpl-card .tc-cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--blue)}
.tpl-card h4{font-size:14px;margin:5px 0 6px;line-height:1.35}
.tpl-card .tc-when{font-size:12.5px;color:var(--muted);line-height:1.55}
.tpl-card .tc-foot{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:14px}
.pick-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
.pick-row .field{margin-bottom:0}
.opt-card{border:1px solid var(--line);border-radius:7px;padding:12px 14px;margin-bottom:10px;cursor:pointer;background:#fff}
.opt-card:hover{border-color:#c6d2de}
.opt-card.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 3px rgba(29,111,165,.1)}
.opt-card .oc-t{font-weight:650;font-size:13.5px;display:flex;align-items:center;gap:7px}
.opt-card .oc-s{font-size:12px;color:var(--muted);margin-top:2px}
.chip{
  display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:5px;
  background:#eef2f6;color:#54687a;font-weight:550;
}
.tech-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.avatar{
  width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:10px;font-weight:700;color:#fff;flex:0 0 22px;letter-spacing:.02em;
}
.avatar.lg{width:32px;height:32px;font-size:12px;flex-basis:32px}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:#455565;margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--muted-2);margin-top:4px}
.input,select.input,textarea.input{
  width:100%;padding:8px 10px;border:1px solid #d5dde5;border-radius:6px;background:#fff;outline:none;
}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,111,165,.12)}
textarea.input{resize:vertical;min-height:76px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}
.err{color:var(--red);font-size:12px;margin-top:4px}
.input.invalid{border-color:var(--red)}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(15,39,64,.45);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;
}
.modal{
  background:#fff;border-radius:10px;width:100%;max-width:720px;
  box-shadow:0 12px 40px rgba(10,25,45,.28);animation:pop .13s ease-out;
}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:translateY(-8px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-head h2{font-size:16.5px}
.modal-head .spacer{flex:1}
.modal-body{padding:20px;max-height:calc(100vh - 220px);overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;background:#fafcfd;border-radius:0 0 10px 10px}
.modal-foot .spacer{flex:1}
.x{border:0;background:none;font-size:20px;color:var(--muted);line-height:1;padding:2px 6px;border-radius:5px}
.x:hover{background:#eef2f6;color:var(--text)}

/* ---------- Schedule board ---------- */
.board-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px}
.datenav button{border:0;background:none;padding:6px 10px;border-radius:4px;color:var(--muted)}
.datenav button:hover{background:#eef2f6;color:var(--text)}
.datenav .today-lbl{padding:0 10px;font-weight:650;font-size:13.5px;min-width:180px;text-align:center}
/* mode switch */
.segmented{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}
.segmented button{border:0;background:none;padding:6px 14px;border-radius:4px;color:var(--muted);font-weight:550;font-size:13px}
.segmented button:hover{background:#eef2f6;color:var(--text)}
.segmented button.on{background:var(--navy);color:#fff}

/* unscheduled tray */
.tray{
  background:var(--amber-soft);border:1px solid #f0d6bb;border-radius:8px;
  padding:10px 12px;margin-bottom:14px;
}
.tray-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tray-head .nm{font-weight:650;font-size:13px;color:#9c5712}
.tray-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tray-strip .minicard{flex:0 0 190px}

/* week grid */
.weekwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.weekgrid{display:grid;grid-template-columns:150px repeat(7,minmax(132px,1fr));min-width:1060px}
.wk-corner{background:#fafcfd;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:10px 12px}
.wk-day{
  background:#fafcfd;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
  padding:8px 10px;text-align:center;
}
.wk-day:last-child{border-right:0}
.wk-day .dn{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650}
.wk-day .dd{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:1px;font-variant-numeric:tabular-nums}
.wk-day.today .dd{color:var(--gold-deep)}
.wk-day.today{background:var(--gold-soft)}
.wk-techcell{
  border-bottom:1px solid #eef2f6;border-right:1px solid var(--line);padding:10px 12px;
  display:flex;gap:8px;align-items:flex-start;background:#fafcfd;
}
.wk-techcell .nm{font-weight:600;font-size:13px;line-height:1.25}
.wk-cell{
  border-bottom:1px solid #eef2f6;border-right:1px solid #eef2f6;padding:6px;
  min-height:74px;display:flex;flex-direction:column;gap:5px;
}
.wk-cell:nth-child(8n+1){border-right:1px solid var(--line)}
.wk-cell.today{background:#fffdf5}
.wk-cell.dragover{background:#e2eef7;outline:2px dashed var(--blue);outline-offset:-3px}
.wk-row-unassigned .wk-cell{background:#fdf6ef}
.wk-row-unassigned .wk-cell.dragover{background:#e2eef7}

/* month grid */
.monthgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.mo-head{
  background:#fafcfd;border-bottom:1px solid var(--line);padding:8px 10px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;text-align:center;
}
.mo-cell{
  border-bottom:1px solid #eef2f6;border-right:1px solid #eef2f6;padding:6px 7px;
  min-height:108px;display:flex;flex-direction:column;gap:4px;
}
.mo-cell:nth-child(7n){border-right:0}
.mo-cell.out{background:#fafbfc}
.mo-cell.out .dnum{color:var(--muted-2)}
.mo-cell.today{background:var(--gold-soft)}
.mo-cell.dragover{background:#e2eef7;outline:2px dashed var(--blue);outline-offset:-3px}
.mo-cell .dtop{display:flex;align-items:center;gap:5px}
.mo-cell .dnum{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.mo-cell.today .dnum{color:var(--gold-deep)}
.mo-cell .dcount{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:600}
.mo-more{font-size:11px;color:var(--blue);font-weight:600;cursor:pointer;padding-left:2px}
.mo-more:hover{text-decoration:underline}
.mo-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:10px;font-size:12px;color:var(--muted)}
.mo-legend .lg-item{display:inline-flex;align-items:center;gap:6px}
.mo-legend .lg-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}

/* compact card used in week + month + tray */
.minicard{
  background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:5px;
  padding:5px 7px;cursor:grab;font-size:11.5px;line-height:1.35;
}
.minicard:hover{border-color:#c6d2de;box-shadow:0 1px 4px rgba(16,36,56,.1)}
.minicard.dragging{opacity:.4}
.minicard.pri-Emergency{border-left-color:var(--red)}
.minicard.pri-High{border-left-color:var(--amber)}
.minicard.pri-Low{border-left-color:#c3ccd6}
.minicard.st-complete{border-left-color:var(--green);background:#fbfdfc}
.minicard.st-cancelled{opacity:.5}
.minicard .mc-top{display:flex;align-items:center;gap:5px}
.minicard .mc-win{font-weight:700;color:var(--navy);font-size:10.5px;white-space:nowrap}
.minicard .mc-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-left:auto}
.minicard .mc-cust{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minicard .mc-type{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{
  flex:1 1 238px;min-width:238px;max-width:340px;background:#eaeff4;border-radius:8px;padding:8px;min-height:180px;
  border:1px solid #dfe6ed;
}
.col.unassigned{background:var(--amber-soft);border-color:#f0d6bb}
.col.dragover{outline:2px dashed var(--blue);outline-offset:-3px;background:#e2eef7}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 4px 10px}
.col-head .nm{font-weight:650;font-size:13px}
.col-head .ct{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600;background:#fff;padding:1px 7px;border-radius:10px}
.jobcard{
  background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px;margin-bottom:8px;
  cursor:grab;box-shadow:0 1px 2px rgba(16,36,56,.07);border-left:3px solid var(--blue);
}
.jobcard:hover{border-color:#c6d2de;box-shadow:0 2px 8px rgba(16,36,56,.1)}
.jobcard:active{cursor:grabbing}
.jobcard.dragging{opacity:.4}
.jobcard.pri-Emergency{border-left-color:var(--red)}
.jobcard.pri-High{border-left-color:var(--amber)}
.jobcard.pri-Low{border-left-color:#c3ccd6}
.jobcard.st-complete{border-left-color:var(--green);background:#fbfdfc}
.jobcard.st-cancelled{opacity:.55}
.jobcard .jc-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.jobcard .jc-win{font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.01em}
.jobcard .jc-id{margin-left:auto;font-size:10.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.jobcard .jc-cust{font-weight:600;font-size:13px;margin-bottom:2px}
.jobcard .jc-meta{font-size:11.5px;color:var(--muted);line-height:1.45}
.jobcard .jc-foot{display:flex;align-items:center;gap:6px;margin-top:7px}
.col-empty{text-align:center;color:var(--muted-2);font-size:12px;padding:18px 6px}

/* ---------- Detail drawer ---------- */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.dl{margin-bottom:13px}
.dl dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;margin-bottom:3px}
.dl dd{margin:0;font-size:13.5px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:9px 0 9px 18px;border-left:2px solid var(--line);position:relative;font-size:13px}
.timeline li:before{
  content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;
  background:var(--blue);border:2px solid #fff;
}
.timeline li .ts{font-size:11.5px;color:var(--muted-2);display:block;margin-top:1px}
.status-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.status-steps a.btn,.modal-head a.btn{text-decoration:none}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar select,.toolbar input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff}
.filter-note{font-size:12.5px;color:var(--muted)}

/* ---------- Invoice preview ----------
   Deliberately the same rules as the print stylesheet, so what he checks on
   screen is what comes out of the PDF. */
.inv-preview{background:#fff;color:#111;padding:22px 20px;border-radius:8px;font-size:12.5px;line-height:1.5}
.inv-preview h1{font-size:20px;margin:0 0 2px}
.inv-preview .inv-head{border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:16px;display:flex;gap:12px}
.inv-preview .doc-logo{width:54px;height:54px;flex:0 0 54px;border-radius:50%;background:var(--logo) center/cover no-repeat}
.inv-preview .inv-meta{width:100%;border-collapse:collapse;margin-bottom:14px}
.inv-preview .inv-meta td{padding:5px 4px;border-bottom:1px solid #e3e3e3;vertical-align:top}
.inv-preview .inv-desc{margin:0 0 14px}
.inv-preview .inv-sig{margin-top:4px}
.inv-preview .inv-sig img{max-height:46px;max-width:100%;display:block}
.inv-preview .inv-lines{width:100%;border-collapse:collapse;margin-top:6px}
.inv-preview .inv-lines th,.inv-preview .inv-lines td{border-bottom:1px solid #ddd;padding:7px 4px}
.inv-preview .inv-lines th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#555}
.inv-preview .inv-lines .num{text-align:right;font-variant-numeric:tabular-nums}
.inv-preview .inv-lines tfoot td{border-bottom:0;padding-top:7px}
.inv-preview .inv-lines tr.tot td{font-weight:700;font-size:15px;border-top:2px solid #111}
.inv-preview .inv-pay{margin:16px 0 0;padding:9px 11px;border:1px solid #bbb;word-break:break-all}
.inv-preview .inv-sec{font-weight:700;margin:20px 0 8px;border-bottom:1px solid #111;padding-bottom:3px}
.inv-preview .inv-grid{display:flex;gap:12px;flex-wrap:wrap}
.inv-preview .inv-grid figure{margin:0;width:46%;min-width:120px}
.inv-preview .inv-grid img{width:100%;height:auto;border:1px solid #bbb;display:block}
.inv-preview .inv-grid figcaption{font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:3px;color:#555}
.inv-preview .inv-note{margin-top:20px;font-size:11.5px;color:#444}

/* ---------- Waiting-to-sync strip ---------- */
.waiting{
  display:flex;align-items:flex-start;gap:9px;margin-bottom:14px;padding:11px 13px;
  border-radius:9px;font-size:13.5px;line-height:1.5;
  background:var(--amber-soft);border:1px solid #f0d6bb;color:#8a4f16;
}
.waiting.ok{background:var(--green-soft);border-color:#bfe0cc;color:var(--green)}
.waiting .w-ico{flex:0 0 auto;font-size:15px;line-height:1.35}
.waiting b{font-weight:700}
.waiting .w-act{margin-left:auto;flex:0 0 auto}

/* ---------- Photos ---------- */
.ph-label{padding:13px 16px;border-top:1px solid var(--line);background:var(--sunk);flex:0 0 auto}
.ph-quick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.ph-custom{display:flex;gap:8px}
.ph-custom .input{flex:1;min-width:0}
.ph-custom .btn{flex:0 0 auto}
@media (max-width:480px){
  .ph-custom{flex-wrap:wrap}
  .ph-custom .input{flex-basis:100%}
  .ph-custom .btn{flex:1;justify-content:center}
}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph-take,.ph-pick{cursor:pointer;margin:0;position:relative;overflow:hidden}
/* visually gone rather than display:none — some mobile browsers refuse to
   open a picker for an input that isn't rendered at all */
.ph-take input[type=file],.ph-pick input[type=file]{
  position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;
  left:0;bottom:0;
}
.ph-wait{font-size:12.5px;color:var(--amber);font-weight:600}
.ph.busy{opacity:.55;pointer-events:none}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;margin-top:12px}
.ph-cell{
  position:relative;margin:0;aspect-ratio:1;border-radius:9px;overflow:hidden;
  border:1px solid var(--line);background:var(--sunk);cursor:pointer;
}
.ph-cell:hover{border-color:var(--blue)}
.ph-img{width:100%;height:100%;background:var(--sunk) center/cover no-repeat;
  display:grid;place-items:center;color:var(--muted-2);font-size:20px}
.ph-img.ph-missing{font-size:15px}
.ph-tag{
  position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:10.5px;
  font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#fff;
  background:linear-gradient(transparent,rgba(8,20,32,.82));text-align:center;
}
.ph-cell.tag-before .ph-tag{background:linear-gradient(transparent,rgba(164,90,20,.9))}
.ph-cell.tag-after  .ph-tag{background:linear-gradient(transparent,rgba(20,110,62,.9))}
.ph-up{
  position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;
  background:var(--amber);color:#fff;font-size:11px;line-height:18px;text-align:center;
  font-weight:700;
}
@media (max-width:560px){
  .ph-grid{grid-template-columns:repeat(3,1fr)}
  .ph-actions .btn{flex:1;justify-content:center}
}

/* ---------- Materials ---------- */
.mat-add{display:flex;gap:8px;margin-bottom:4px}
.mat-add .input:first-child{flex:1;min-width:0}
.mat-add .input.num{width:66px;flex:0 0 66px;text-align:center}
.mat-add .btn{flex:0 0 auto}
.mat-sum{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:12px 0 6px;font-size:13px}
.mat-left{font-weight:650;color:var(--amber)}
.mat-done{font-weight:650;color:var(--green)}
.mat-cost{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.mat-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mat-list li{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid #eef2f6;background:#fff}
.mat-list li:last-child{border-bottom:0}
.mat-list li.got{background:#fafcfb}
.mat-list li.got .mat-t{text-decoration:line-through;color:var(--muted-2)}
.mat-tick{
  flex:0 0 24px;width:24px;height:24px;border-radius:6px;border:1.5px solid #c6d2de;
  background:#fff;color:#fff;font-size:14px;line-height:1;padding:0;font-weight:700;
}
.mat-list li.got .mat-tick{background:var(--green);border-color:var(--green)}
.mat-tick:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mat-q{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;min-width:22px}
.mat-t{flex:1;min-width:0;font-size:14.5px;overflow-wrap:anywhere}
.mat-src{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);
  background:var(--blue-soft);padding:2px 6px;border-radius:4px;flex:0 0 auto}
.mat-c{width:74px;flex:0 0 74px;padding:5px 7px;font-size:12.5px;text-align:right}
@media (max-width:560px){
  .mat-add{flex-wrap:wrap}
  .mat-add .input:first-child{flex-basis:100%}
  .mat-c{width:62px;flex-basis:62px}
  .mat-src{display:none}
}

/* the pick-up view */
.pick-group{margin-bottom:14px}
.pick-head{display:flex;align-items:baseline;gap:9px;padding:0 2px 7px}
.pick-head .nm{font-weight:650;font-size:14.5px}
.pick-head .sub{font-size:12.5px;color:var(--muted)}
.pick-head .when{margin-left:auto;font-size:12px;color:var(--muted)}

/* ---------- Toast ---------- */
#toasts{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--navy);color:#fff;padding:11px 15px;border-radius:7px;font-size:13.5px;
  box-shadow:0 6px 20px rgba(10,25,45,.3);animation:slidein .18s ease-out;max-width:330px;
}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Phone layout overrides ----------
   Last in the sheet on purpose: these and the desktop rules have the
   same specificity, so whichever comes later wins. Sitting above them
   it lost every conflict and the phone quietly rendered desktop
   padding, grids and modal sizing. */
@media (max-width:820px){
  #sidebar{display:none}
  #mobile-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--navy);border-top:1px solid rgba(255,255,255,.1);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  }
  #mobile-nav button{
    flex:1;background:none;border:0;color:#9db4cb;display:flex;flex-direction:column;
    align-items:center;gap:3px;padding:6px 2px;font-size:10.5px;font-weight:600;border-radius:7px;
    position:relative;min-height:46px;
  }
  #mobile-nav button .ico{font-size:17px;line-height:1}
  #mobile-nav button.active{color:var(--gold)}
  #mobile-nav button .dot{
    position:absolute;top:4px;right:calc(50% - 18px);min-width:15px;height:15px;
    border-radius:8px;background:var(--amber);color:#fff;font-size:9.5px;line-height:15px;
    font-weight:700;padding:0 3px;
  }
  /* The bottom nav grows by the home-indicator inset, so the space we
     reserve for it has to grow by the same amount or it covers the last
     row of a long list. */
  main.content{padding:14px 13px calc(92px + env(safe-area-inset-bottom,0px))}
  header.topbar{padding:10px 13px;gap:9px;flex-wrap:wrap}
  .topbar h1{font-size:17px}
  .topbar .crumb{display:none}
  .search{order:3;flex-basis:100%}
  .search input{width:100%}
  #btn-new-estimate{display:none}
  .stat-row{grid-template-columns:1fr 1fr;gap:10px}
  .two-col{grid-template-columns:minmax(0,1fr)}
  .card-head{flex-wrap:wrap}
  /* A record modal is a bottom sheet on a phone. Capping the modal itself
     and letting only its body scroll keeps Close and Delete on screen — the
     old fixed body max-height assumed a short header, and a wrapped one
     pushed the footer 115px below the fold. */
  .overlay{padding:0;align-items:flex-end}
  .modal,.modal.wide{
    max-width:100%;max-height:100vh;max-height:100dvh;
    border-radius:13px 13px 0 0;display:flex;flex-direction:column;
  }
  .modal-head{flex:0 0 auto;flex-wrap:wrap;row-gap:8px}
  /* the title block was being squeezed beside the status badges, which broke
     a customer's name one word per line. Give it the row to itself. */
  .modal-head > div:first-child{flex:1 0 100%;min-width:0}
  .modal-head h2{font-size:17px;line-height:1.25;overflow-wrap:anywhere}
  .modal-body{flex:1 1 auto;min-height:0;max-height:none;padding:15px}
  .modal-foot{flex:0 0 auto;border-radius:0}
  .modal-head,.modal-foot{padding:13px 15px}
  /* Wide tables scroll inside their card instead of dragging the page sideways. */
  .card{overflow-x:auto}
  .row2,.row3{grid-template-columns:1fr}
  .board{flex-direction:column}
  .col{flex:1 1 auto;max-width:none;width:100%}
  /* A lead card carries four actions — call, job, estimate, dismiss — and
     "Make an estimate" clipped itself at phone width. Two per row. */
  .stop.lead-card .stop-acts .btn{flex:1 1 calc(50% - 4px);min-width:0}
  .stop.inv-out .stop-acts > :first-child,
  .stop.inv-late .stop-acts > :first-child{flex:1 0 100%}
  .toolbar{gap:6px}
  .tpl-grid{grid-template-columns:1fr}
}

/* ---------- Print (dispatch ticket) ---------- */
#print-area{display:none}
@media print{
  #app,.overlay,#toasts,.no-print{display:none!important}
  body{background:#fff}
  #print-area{display:block;padding:0}
  .ticket{page-break-after:always;padding:28px 4px}
  .ticket h1{font-size:20px}
  .ticket .tk-head{border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:16px;display:flex}
  .doc-logo{
    width:54px;height:54px;flex:0 0 54px;border-radius:50%;margin-right:12px;
    background:var(--logo) center/cover no-repeat;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .ticket table{margin-top:10px}
  .ticket .sig,.estdoc .sig{margin-top:44px;border-top:1px solid #000;width:280px;padding-top:5px;font-size:12px}
  .wvdoc{page-break-after:always;padding:28px 4px;font-size:12px;line-height:1.55}
  .wvdoc h1{font-size:18px}
  .wvdoc .wv-head{border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:14px;display:flex}
  .wvdoc .wv-meta{width:100%;border-collapse:collapse;margin-bottom:14px}
  .wvdoc .wv-meta td{padding:3px 4px;border-bottom:1px solid #ddd}
  .wvdoc p{margin:0 0 9px}
  .wvdoc ul{margin:6px 0 0;padding-left:18px}
  .wvdoc li{margin-bottom:5px}
  .wvdoc .wv-sig{margin-top:22px;border-top:2px solid #000;padding-top:12px;display:flex;gap:30px;align-items:flex-end}
  .wvdoc .wv-sig img{max-height:70px;border-bottom:1px solid #000}
  .invdoc{page-break-after:always;padding:28px 4px;font-size:12.5px}
  .invdoc h1{font-size:20px}
  .invdoc .inv-head{border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:16px;display:flex}
  .invdoc .inv-meta{width:100%;border-collapse:collapse;margin-bottom:14px}
  .invdoc .inv-meta td{padding:4px 4px;border-bottom:1px solid #ddd;vertical-align:top}
  .invdoc .inv-desc{margin:0 0 14px;line-height:1.55}
  .invdoc .inv-sig{margin-top:4px}
  .invdoc .inv-sig img{max-height:46px;max-width:100%;display:block}
  .invdoc .inv-lines{width:100%;border-collapse:collapse;margin-top:6px}
  .invdoc .inv-lines th,.invdoc .inv-lines td{border-bottom:1px solid #ccc;padding:6px 4px}
  .invdoc .inv-lines th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .invdoc .inv-lines .num{text-align:right}
  .invdoc .inv-lines tfoot td{border-bottom:0;padding-top:7px}
  .invdoc .inv-lines tr.tot td{font-weight:700;font-size:15px;border-top:2px solid #000}
  .invdoc .inv-pay{margin:16px 0 0;padding:9px 11px;border:1px solid #999;word-break:break-all}
  .invdoc .inv-sec{font-weight:700;margin:22px 0 8px;border-bottom:1px solid #000;padding-bottom:3px}
  .invdoc .inv-grid{display:flex;gap:12px;flex-wrap:wrap}
  .invdoc .inv-grid figure{margin:0;width:46%}
  .invdoc .inv-grid img{width:100%;height:auto;border:1px solid #999}
  .invdoc .inv-grid figcaption{font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
  .invdoc .inv-note{margin-top:22px;font-size:11.5px;color:#333;line-height:1.6}
  .estdoc{page-break-after:always;padding:28px 4px}
  .estdoc h1{font-size:20px}
  .estdoc .ed-head{border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:16px;display:flex}
  .estdoc table{margin-top:10px;width:100%;border-collapse:collapse}
  .estdoc th,.estdoc td{border-bottom:1px solid #ccc;padding:6px 4px;font-size:12.5px}
  .estdoc .tot{font-weight:700;font-size:15px;border-top:2px solid #000}
  .estdoc .terms{margin-top:24px;font-size:11.5px;color:#333;line-height:1.6}
}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="mark">
        <div class="logo" role="img" aria-label="Poseidon Plumbing &amp; Gasfitting"></div>
        <div>
          <div class="name" id="brand-name">Poseidon Plumbing &amp; Gasfitting Ltd.</div>
        </div>
      </div>
      <div class="sub">Service Dispatch</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="sync" id="sync-pill" hidden><span class="d"></span><span id="sync-text"></span></div>
      <div id="storage-note">Local prototype · data on this device</div>
    </div>
  </aside>

  <div id="main">
    <header class="topbar">
      <div>
        <div class="crumb" id="crumb">Dispatch</div>
        <h1 id="page-title">Dashboard</h1>
      </div>
      <div class="spacer"></div>
      <div class="search">
        <span class="si">🔍</span>
        <input id="global-search" type="search" placeholder="Search jobs, customers, phone…" autocomplete="off">
      </div>
      <button class="btn" id="btn-new-estimate">＋ Estimate</button>
      <button class="btn accent" id="btn-new-job">＋ New Job</button>
    </header>
    <div id="clockbar" aria-live="polite"></div>
    <main class="content" id="view"></main>
  </div>

  <nav id="mobile-nav" aria-label="Main"></nav>
  <div class="nav-sheet" id="nav-sheet" hidden></div>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>
<div id="print-area"></div>

<script>
"use strict";
/* ============================================================
   Poseidon Plumbing & Gasfitting Ltd. — Service Dispatch
   Single-file prototype. All data persists to localStorage.
   ============================================================ */

/* ---------- Constants ---------- */
const STORAGE_KEY = "pcp.dispatch.v1";

/* ---------- Tiny helpers ---------- */
const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function esc(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function uid(prefix){
  return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function todayStr(){
  const d = new Date();
  return ymd(d);
}
function ymd(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseYmd(s){
  const [y,m,d] = String(s || "").split("-").map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m-1, d);
}
function addDays(s, n){
  const d = parseYmd(s) || new Date();
  d.setDate(d.getDate() + n);
  return ymd(d);
}
function daysBetween(a, b){
  const x = parseYmd(a), y = parseYmd(b);
  if (!x || !y) return 0;
  return Math.round((y - x) / 86400000);
}
function addMonths(s, n){
  const d = parseYmd(s) || new Date();
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last));
  return ymd(d);
}
/* Weeks run Sunday to Saturday, the way a US wall calendar does. */
function startOfWeek(s){
  const d = parseYmd(s) || new Date();
  d.setDate(d.getDate() - d.getDay());
  return ymd(d);
}
function weekDays(s){
  const a = startOfWeek(s);
  return Array.from({ length:7 }, (_, i) => addDays(a, i));
}
/* Whole weeks covering the anchor's month, so the grid always has full rows. */
function monthCells(s){
  const d = parseYmd(s) || new Date();
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const daysIn = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  const weeks = Math.ceil((first.getDay() + daysIn) / 7);
  let cur = startOfWeek(ymd(first));
  const cells = [];
  for (let i = 0; i < weeks * 7; i++){ cells.push(cur); cur = addDays(cur, 1); }
  return cells;
}
function sameMonth(a, b){
  const x = parseYmd(a), y = parseYmd(b);
  return !!x && !!y && x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth();
}
function fmtMonth(s){
  const d = parseYmd(s);
  return d ? d.toLocaleDateString(undefined, { month:"long", year:"numeric" }) : "—";
}
function fmtWeekRange(s){
  const days = weekDays(s);
  const a = parseYmd(days[0]), b = parseYmd(days[6]);
  const sameY = a.getFullYear() === b.getFullYear();
  const left = a.toLocaleDateString(undefined, { month:"short", day:"numeric" });
  const right = b.toLocaleDateString(undefined,
    sameY && a.getMonth() === b.getMonth() ? { day:"numeric" } : { month:"short", day:"numeric" });
  return `${left} – ${right}, ${b.getFullYear()}`;
}

function fmtDate(s, opts){
  const d = parseYmd(s);
  if (!d) return "—";
  return d.toLocaleDateString(undefined, opts || { weekday:"short", month:"short", day:"numeric" });
}
function fmtDateLong(s){
  return fmtDate(s, { weekday:"long", month:"long", day:"numeric", year:"numeric" });
}
function fmtStamp(ts){
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " · " +
         d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
/* "1h 24m" reads faster than 84 minutes when you're glancing at a phone. */
function fmtDur(ms){
  const mins = Math.max(0, Math.round((Number(ms) || 0) / 60000));
  const h = Math.floor(mins / 60), m = mins % 60;
  if (!h) return m + "m";
  return m ? `${h}h ${m}m` : `${h}h`;
}
function fmtClock(ms){
  const total = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), sec = total % 60;
  const pad = n => String(n).padStart(2, "0");
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
}
function hoursOf(ms){ return (Number(ms) || 0) / 3600000; }
/* For the datetime-local inputs used to correct a forgotten clock-out. */
function toLocalInput(ts){
  if (!ts) return "";
  const d = new Date(ts), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fromLocalInput(v){
  const t = v ? new Date(v).getTime() : NaN;
  return Number.isFinite(t) ? t : null;
}

function money(n){
  const v = Number(n) || 0;
  return "$" + v.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
}
function initials(name){
  return String(name||"?").trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();
}
function fmtPhone(p){
  const d = String(p||"").replace(/\D/g,"");
  if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  return p || "";
}
/* The website's table is the website's. Its column names were chosen for a
   contact form, not for dispatch, and `contact` holds a phone OR an email in
   one field. This reads a row of it into the shape the app thinks in, and
   tolerates the names moving, because they are not ours to pin down. */
function readInquiry(r){
  const pick = (...names) => {
    for (const n of names){
      const v = r[n];
      if (v != null && String(v).trim() !== "") return String(v).trim();
    }
    return "";
  };
  const one   = pick("contact", "contact_info", "phone_or_email");
  const mail  = /@/.test(one);
  const digits = String(one).replace(/\D/g, "");
  return {
    id:      String(r.id != null ? r.id : pick("uuid", "inquiry_id", "ref")),
    name:    pick("name", "full_name", "customer_name", "first_name") || "(no name given)",
    phone:   mail ? pick("phone", "telephone") : (digits.length >= 7 ? one : pick("phone", "telephone")),
    email:   mail ? one : pick("email"),
    service: pick("service", "service_type", "type", "subject"),
    what:    pick("description", "message", "details", "notes", "body"),
    timing:  pick("timing", "availability", "when", "preferred_time", "best_time"),
    address: pick("address", "service_address", "street", "location"),
    source:  pick("source") || "website",
    photos:  (Array.isArray(r.photos) ? r.photos
             : Array.isArray(r.images) ? r.images : [])
             .map(x => typeof x === "string" ? x : (x && (x.path || x.key || x.name)))
             .filter(Boolean),
    at:      pick("created_at", "inserted_at", "created", "submitted_at", "timestamp"),
    raw: r
  };
}

/* The trident is a data URI on --logo so a saved copy of this file carries
   its own logo. The customer's invoice page is a different file on a
   different domain, so it has to be handed the image itself. */
function logoDataUrl(){
  try {
    const v = getComputedStyle(document.documentElement).getPropertyValue("--logo") || "";
    const m = v.match(/url\(\s*["']?(data:image\/[^"')]+)["']?\s*\)/);
    return m ? m[1] : "";
  } catch(e){ return ""; }
}
