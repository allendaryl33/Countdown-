<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your invoice</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* Standalone, like the signing page. A customer opens this once, on a phone,
   possibly on bad signal, and it must not wait on a font or a library. */
:root{
  --navy:#0a2a42; --blue:#1668ab; --gold:#e8b931;
  --bg:#f3f6f9; --card:#fff; --line:#e1e7ed;
  --text:#16222e; --muted:#6b7c8c; --green:#1f8a4c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:0 0 calc(28px + env(safe-area-inset-bottom,0px));}
.wrap{max-width:660px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 1px 2px rgba(16,36,56,.06),0 2px 8px rgba(16,36,56,.05);
  padding:20px;margin-bottom:14px}
.head{display:flex;gap:12px;align-items:flex-start;border-bottom:2px solid var(--navy);
  padding-bottom:12px;margin-bottom:14px}
.head img{width:46px;height:46px;border-radius:50%;flex:0 0 46px}
.head h1{font-size:17px;margin:0 0 2px;line-height:1.25}
.head .meta{font-size:12.5px;color:var(--muted)}
.head .right{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
.head .right b{display:block;font-size:16px;color:var(--text)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  font-weight:650;margin:0 0 8px}
.cols{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.cols>div{flex:1 1 180px}
table{width:100%;border-collapse:collapse}
td,th{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:14px}
tr.total td{border-bottom:0;border-top:2px solid var(--navy);font-weight:700;font-size:19px;padding-top:12px}
.desc{white-space:pre-wrap;margin:0 0 14px}
.shots{display:flex;gap:10px;flex-wrap:wrap}
.shots figure{margin:0;flex:1 1 44%}
.shots img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block}
.shots figcaption{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);padding-top:4px}
.sig img{max-height:64px;display:block;margin-top:6px}
.pay{display:block;background:var(--navy);color:#fff;text-decoration:none;text-align:center;
  padding:17px;border-radius:10px;font-weight:700;font-size:17px;margin-bottom:12px}
.way{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.way:last-child{border-bottom:0}
.way .ico{font-size:19px;line-height:1.3}
.way b{display:block}
.way .sub{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted);margin:14px 0 0}
.state{text-align:center;padding:48px 20px}
.state .big{font-size:40px;margin-bottom:10px}
.state h2{font-size:17px;text-transform:none;letter-spacing:0;color:var(--text);margin-bottom:6px}
.paid{background:var(--green);color:#fff;border-radius:10px;padding:13px 16px;
  font-weight:650;text-align:center;margin-bottom:14px}
.keepit{text-align:center;margin:18px 0 6px}
.keepit button{font:inherit;font-weight:650;cursor:pointer;color:var(--text);
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:13px 20px;width:100%;max-width:320px}
.keepit button:active{opacity:.7}
.keepit .note{margin-top:7px}
@media print{
  body{background:#fff}
  .card{box-shadow:none;border:0;padding:0;margin-bottom:18px}
  .pay{background:#fff;color:#111;border:1px solid #999}
  .keepit{display:none}
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1620;--card:#152233;--line:#25384f;--text:#e8eef5;--muted:#9db0c4}
}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="state"><div class="big">⏳</div><h2>Loading your invoice…</h2></div>
</div>

<script>
/* Same as the signing page: everything arrives after the #, which browsers
   never send to a server, and the two project values can be baked in by
   whoever hosts this so the link stays short. */
const BAKED_URL = "";
const BAKED_KEY = "";

const P = new URLSearchParams(location.hash.slice(1));
const TOKEN = P.get("t") || "";
const BASE  = (P.get("u") || BAKED_URL).replace(/\/+$/, "");
const KEY   = P.get("k") || BAKED_KEY;

const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = n => "$" + (Number(n)||0).toLocaleString(undefined,
  { minimumFractionDigits:2, maximumFractionDigits:2 });

function rpc(fn, body){
  return fetch(BASE + "/rest/v1/rpc/" + fn, {
    method:"POST", headers:{ "apikey":KEY, "Content-Type":"application/json" },
    body: JSON.stringify(body)
  }).then(async r => {
    const txt = await r.text();
    let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){}
    if (!r.ok) throw new Error((j && (j.message || j.error)) || ("HTTP " + r.status));
    return j;
  });
}

function state(icon, title, body){
  $("#root").innerHTML = `<div class="state"><div class="big">${icon}</div>
    <h2>${esc(title)}</h2><div style="color:var(--muted)">${body||""}</div></div>`;
}

function render(p){
  const co = p.company || {};
  const lines = p.lines || [];
  const shots = p.photos || [];
  const signed = p.signed || [];
  const pay = p.pay || {};
  const owing = Number(p.balance != null ? p.balance : p.total) || 0;

  $("#root").innerHTML = `
    <div class="card">
      <div class="head">
        ${co.logo ? `<img src="${esc(co.logo)}" alt="">` : ""}
        <div>
          <h1>${esc(co.name || "Invoice")}</h1>
          <div class="meta">${[co.phone, co.email, co.website, co.address]
            .filter(Boolean).map(x => `<div>${esc(x)}</div>`).join("")}</div>
        </div>
        <div class="right"><b>INVOICE</b>${esc(p.no || "")}<br>${esc(p.date || "")}</div>
      </div>

      <div class="cols">
        <div><h2>Billed to</h2>${[p.customer, p.address, p.city, p.phone]
          .filter(Boolean).map(x => `<div>${esc(x)}</div>`).join("")}</div>
        <div><h2>Work done</h2>
          <div>${esc(p.type || "")}${p.jobNo ? " · Job #" + esc(p.jobNo) : ""}</div>
          ${p.when ? `<div>${esc(p.when)}</div>` : ""}
          ${p.terms ? `<div style="margin-top:4px"><strong>${esc(p.terms)}</strong></div>` : ""}</div>
      </div>

      ${p.description ? `<p class="desc"><strong>What was wrong:</strong> ${esc(p.description)}</p>` : ""}

      <table>
        <thead><tr><th>Description</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Amount</th></tr></thead>
        <tbody>
          ${lines.map(l => `<tr>
            <td>${esc(l.desc)}</td><td class="n">${esc(l.qty)}</td>
            <td class="n">${esc(money(l.price))}</td>
            <td class="n">${esc(money(l.qty * l.price))}</td></tr>`).join("")}
          ${p.tax ? `<tr><td colspan="3" class="n">${esc(p.taxLabel || "Tax")}</td>
            <td class="n">${esc(money(p.tax))}</td></tr>` : ""}
          <tr class="total"><td colspan="3" class="n">Total</td><td class="n">${esc(money(p.total))}</td></tr>
          ${Number(p.paid) > 0 ? `<tr><td colspan="3" class="n">Already received</td>
            <td class="n">${esc(money(p.paid))}</td></tr>
            <tr class="total"><td colspan="3" class="n">Still owing</td>
            <td class="n">${esc(money(owing))}</td></tr>` : ""}
        </tbody>
      </table>
    </div>

    ${owing > 0.005 ? `
      <div class="card">
        <h2>Pay it</h2>
        ${pay.stripe ? `<a class="pay" href="${esc(pay.stripe)}" target="_blank"
             rel="noopener noreferrer">Pay ${esc(money(owing))} by card →</a>` : ""}
        ${pay.etransfer ? `<div class="way"><span class="ico">🏦</span>
          <span><b>Interac e-Transfer</b>
            <span class="sub">${esc(pay.etransfer)}</span></span></div>` : ""}
        ${pay.cash ? `<div class="way"><span class="ico">💵</span>
          <span><b>Cash</b><span class="sub">On completion, to the plumber</span></span></div>` : ""}
      </div>` : `<div class="paid">✓ Paid in full — thank you</div>`}

    ${shots.length ? `<div class="card"><h2>The work</h2>
      <div class="shots">${shots.map(s => `<figure>
        <img src="${esc(s.url)}" alt="${esc(s.tag || "")}" loading="lazy">
        <figcaption>${esc(s.tag || "")}</figcaption></figure>`).join("")}</div></div>` : ""}

    ${signed.length ? `<div class="card"><h2>What you signed</h2>
      ${signed.map(w => `<div class="sig" style="margin-bottom:12px">
        <div>${esc(w.title)}</div>
        <div style="font-size:13px;color:var(--muted)">${esc(w.who)} · ${esc(w.at)}</div>
        ${w.signature ? `<img src="${esc(w.signature)}" alt="Signature">` : ""}
      </div>`).join("")}</div>` : ""}

    ${p.note ? `<p class="note" style="text-align:center">${esc(p.note)}</p>` : ""}

    <div class="keepit">
      <button type="button" id="pdf">🖨 Save a copy / Print</button>
      <div class="note">Your phone's print screen can save this as a PDF.</div>
    </div>

    <p class="note" style="text-align:center">
      Questions? ${esc(co.phone || "")}${co.email ? " · " + esc(co.email) : ""}
    </p>`;
}

document.addEventListener("click", e => {
  if (e.target && e.target.id === "pdf") window.print();
});

window.addEventListener("hashchange", () => location.reload());

(async () => {
  if (!TOKEN || !BASE || !KEY){
    state("🔗", "That link isn't complete",
      "Ask whoever sent it to send the whole thing — some apps cut long links short.");
    return;
  }
  try {
    const p = await rpc("invoice_for_viewing", { p_token: TOKEN });
    if (!p){ state("⌛", "This link has expired", "Get in touch and we'll send a fresh one."); return; }
    render(p);
    // Let him know it was opened. Never block the page on it.
    rpc("mark_invoice_viewed", { p_token: TOKEN }).catch(() => {});
  } catch(err){
    state("⚠", "Couldn't load it",
      /Failed to fetch|NetworkError|Load failed/i.test(err.message || "")
        ? "Looks like there's no connection. Try again in a moment."
        : esc(err.message || "Something went wrong."));
  }
})();
</script>
</body>
</html>
